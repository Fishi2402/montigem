name: Build

on:
  push:
  pull_request:

jobs:
  build_no_containers:
    name: build_no_containers
    runs-on: self-hosted

    container:
      image: registry.git.rwth-aachen.de/monticore/container-registry/gradle8.14.4-chrome-installed
      credentials:
        username: ${{ secrets.REGISTRY_USER }}
        password: ${{ secrets.REGISTRY_PASSWORD }}

    env:
      CI_REGISTRY_USER: ${{ secrets.REGISTRY_USER }} # required for jib configuration
      CI_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }} # required for jib configuration
      GRADLE_OPTS: "-Dmaven.repo.local=$PWD/.m2"
      GRADLE_USER_HOME: "$PWD/.gradle"
      GRADLE_COMMON_ARGS: "-P mavenPassword=${{ secrets.mavenPassword }} -P mavenUser=${{ secrets.mavenUser }}"
      NPM_CONFIG_CACHE: "$PWD/.npm"
      PUPPETEER_SKIP_DOWNLOAD: "true"
      CHROME_BIN: "/usr/bin/google-chrome-stable"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/google-chrome-stable"

    # GitLab:
    # except:
    #   refs:
    #     - dev
    if: github.ref == 'refs/heads/dev'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build
        shell: bash
        run: |
          # Double the Gradle daemon heap for this job only
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8/' gradle.properties

          # Gradle launcher JVM memory
          export JAVA_OPTS="-Xmx2g"
          export CHROME_BIN=/usr/bin/google-chrome-stable

          gradle --version 2>&1 | tee $PWD/build.log

          gradle :umlp-tool:build :umlp-rte:build :umlp-jsweet:build --refresh-dependencies --stacktrace $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 >> $PWD/build.log 2> >(tee -a $PWD/build.log >&2)

          # Add downloaded node distribution to PATH
          export PATH="$PATH:$(dirname $(find $(pwd) -type f -name "node" -print -quit))"

          cd umlp-tool

          gradle packageUMLPWithGUIVscodePlugin -P buildVscodePlugin=true --info --refresh-dependencies $GRADLE_COMMON_ARGS $GRADLE_OPTS $ARGS1 >> $PWD/build.log 2> >(tee -a $PWD/build.log) >&2
