name: "Trigger the MontiGem CI (workflow-call)"

on:
  workflow_call:
    inputs:
      project:
        description: 'The (internal) name for this project, as defined within the MontiVerse job'
        type: string
        required: true
      refspec:
        description: 'The branch or commit to use. By default GITHUB_REF is used'
        type: string
        required: false
    secrets:
      PIPELINE_TRIGGER_TOKEN:
        required: true
      PIPELINE_ACCESS_TOKEN:
        required: true


jobs:
  # Run the MontiVerse pipeline (tests this change on a suite of projects)
  # The MontiVerse is a suite of projects, which are not build & tested with the given changes on a branch
  trigger-thorough-montigem-test:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write  # to write PR comments
    steps:
      - name: Extract Branch Name
        # Use the refspec input if present, otherwise the PR source branch or the pushed branch
        # (a plain branch name, as the GitLab pipeline clones it with `git clone --branch`)
        run: |
          echo "refspec=${{ inputs.refspec }}"
          echo "ref=${{ github.ref }}"
          echo "BRANCH_NAME=${{ inputs.refspec || github.head_ref || github.ref_name }}" >> $GITHUB_ENV
      - name: Resolve montigem ref
        # github.workflow_ref looks like "MontiCore/montigem/.github/workflows/trigger_full_montigem_ci.yml@<ref>".
        # Extract <ref> so we fetch the trigger script matching whichever ref of this
        # reusable workflow the caller used.
        id: resolve_ref
        run: |
          ref="${GITHUB_WORKFLOW_REF#*@}"
          echo "ref=${ref:-main}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
      - name: Checkout trigger script
        uses: actions/checkout@v4
        with:
          repository: MontiCore/montigem
          ref: ${{ steps.resolve_ref.outputs.ref }}
          sparse-checkout: |
            .github/workflows/scripts/trigger-gitlab-pipeline.sh
          sparse-checkout-cone-mode: false
      - name: Trigger MontiGem Pipeline
        # Trigger the MontiVerseCI GitLab pipeline (via a plain curl script, see
        # .github/workflows/scripts/trigger-gitlab-pipeline.sh) and wait for it to complete
        id: montigem-ci
        run: .github/workflows/scripts/trigger-gitlab-pipeline.sh
        env:
          GITLAB_HOST: 'git.rwth-aachen.de'
          GITLAB_PROJECT_ID: '129999'  # MontiGem CI project id
          GITLAB_REF: 'main'
          GITLAB_TRIGGER_TOKEN: ${{ secrets.PIPELINE_TRIGGER_TOKEN }}
          GITLAB_ACCESS_TOKEN: ${{ secrets.PIPELINE_ACCESS_TOKEN }}  # Access is required to show the status
          GITLAB_INPUTS_JSON: '{"umlp_ref":"${{ env.BRANCH_NAME }}"}'
        # Fetch the related PRs (if applicable)
      - uses: octokit/request-action@v2.x
        name: 'Fetch related PR (if not already known)'
        if: ${{ (success() || failure()) && !github.event.pull_request.number }}
        id: get_related_pr
        with:
          route: GET /repos/{ownerandrepo}/commits/{commit_sha}/pulls
          ownerandrepo: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
