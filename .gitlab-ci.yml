# (c) https://github.com/MontiCore/monticore
image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:7-chromium-deps

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"

cache:
  paths:
    - .gradle/wrapper
  key: ${CI_COMMIT_REF_SLUG}

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
  #  - it_tests
  - check
  - deploy
  - testDeployed

build_no_containers:
  stage: build
  script:
    - "gradle --version"
    - "gradle build --refresh-dependencies --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
    # add one of the downloaded nodejs distributions to PATH, so we can build the vscode plugin
    - export PATH="$PATH:$(dirname $(find $(pwd) -type f -name "node" -print -quit))"
    - "cd umlp-tool"
    - "gradle buildPlugin packageUMLPWithGUIVscodePlugin -P buildIntelliJPlugin=true -P buildVscodePlugin=true --info --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
  cache:
    paths:
      - examples/weather/frontend/build/frontendGen/node_modules
      - examples/weather/frontend/.gradle/nodejs
      - examples/sehub/frontend/build/frontendGen/node_modules
      - examples/sehub/frontend/.gradle/nodejs
      - examples/dtcockpit/frontend/build/frontendGen/node_modules
      - examples/dtcockpit/frontend/.gradle/nodejs
      - products/demorec/frontend/build/frontendGen/node_modules
      - products/demorec/frontend/.gradle/nodejs
  artifacts:
    paths:
      - examples/weather/frontend/build/frontendGen/**
      - examples/sehub/frontend/build/frontendGen/**
      - examples/dtcockpit/frontend/build/frontendGen/**
      - products/demorec/frontend/build/frontendGen/**
      - umlp-tool/build/distributions/**
      - umlp-tool/build/generated-sources/UMLPWithGUI/**/*.vsix
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week
  except:
    refs:
      - dev

build_with_containers:
  stage: build
  script:
    - "gradle --version"
    - "gradle build --refresh-dependencies --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
    # add one of the downloaded nodejs distributions to PATH, so we can build the vscode plugin
    - export PATH="$PATH:$(dirname $(find $(pwd) -type f -name "node" -print -quit))"
    - "cd umlp-tool"
    - "gradle buildPlugin packageUMLPWithGUIVscodePlugin -P buildIntelliJPlugin=true -P buildVscodePlugin=true --info --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
    - "cd .."
    # Weather Backend
    - "gradle :examples:weather:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/weather_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # SEHub Backend
    - "gradle :examples:sehub:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/sehub_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # Stat-Server
    - "gradle :examples:stat:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/stat_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # DTCockpit Backend
    - "gradle :examples:dtcockpit:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
       -Djib.to.image=$CI_REGISTRY_IMAGE/dtcockpit_backend:latest \
       -Djib.to.auth.username=$CI_REGISTRY_USER  \
       -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # DemoRec Application
    - "gradle :products:demorec:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
       -Djib.to.image=$CI_REGISTRY_IMAGE/demorec_backend:latest \
       -Djib.to.auth.username=$CI_REGISTRY_USER  \
       -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "

    # Frontends
    - "gradle :examples:weather:frontend:deployImageCI :examples:sehub:frontend:deployImageCI :examples:dtcockpit:frontend:deployImageCI :products:demorec:frontend:deployImageCI -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
  cache:
    paths:
      - examples/weather/frontend/build/frontendGen/node_modules
      - examples/weather/frontend/.gradle/nodejs
      - examples/sehub/frontend/build/frontendGen/node_modules
      - examples/sehub/frontend/.gradle/nodejs
      - examples/dtcockpit/frontend/build/frontendGen/node_modules
      - examples/dtcockpit/frontend/.gradle/nodejs
      - products/demorec/frontend/build/frontendGen/node_modules
      - products/demorec/frontend/.gradle/nodejs
  artifacts:
    paths:
      - examples/weather/frontend/build/frontendGen/**
      - examples/sehub/frontend/build/frontendGen/**
      - examples/dtcockpit/frontend/build/frontendGen/**
      - products/demorec/frontend/build/frontendGen/**
      - umlp-tool/build/distributions/**
      - umlp-tool/build/generated-sources/UMLPWithGUI/**/*.vsix
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week
  only:
    refs:
      - dev

slowtest:
  stage: check
  tags:
    - node2-docker-postgres
  services:
    - postgres:12.2-alpine
  variables:
    POSTGRES_DB:  $POSTGRES_DB
    POSTGRES_USER:  $user
    POSTGRES_PASSWORD:  $pass
    POSTGRES_HOST_AUTH_METHOD: trust
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - "gradle --version"
    - "gradle slowtest --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
  artifacts:
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/slowtest/**/TEST-*.xml"
    expire_in: 1 week

deployRTE:
  stage: deploy
  script:
    - "gradle :umlp-tool:publish :umlp-rte:publish :umlp-rte:umlp-jsweet:publish :umlp-rte:client:publish -P mavenPassword=$pass -P mavenUser=$user"
  only:
    - dev

