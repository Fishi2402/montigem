# (c) https://github.com/MontiCore/monticore
image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:6.8.2-jdk8

variables:
  GRADLE_OPTS: "-Dorg.gradle.daemon=false"
  MAVEN_CLI_OPTS: "--settings settings.xml --batch-mode"

cache:
  paths:
    - .gradle/wrapper
  key: ${CI_COMMIT_REF_SLUG}

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
  - test
  - buildExamples
  - deploy
  - check

build:
  stage: build
  script:
    - "gradle buildUMLP --refresh-dependencies $GRADLE_OPTS $ARGS1"

test_experiments:
  stage: test
  dependencies:
    - build
  script:
    - "gradle -p experiments build $GRADLE_OPTS $ARGS2"


        include ':cars'
        include ':filesystem'
        include ':mediahub'
        include ':restaurant'
        include ':university'

example_cars:
  stage: buildExamples
  dependencies:
    - build
  script:
    - cd examples
    - "gradle -p cars build $GRADLE_OPTS $ARGS2"

example_filesystem:
  stage: buildExamples
  dependencies:
    - build
  script:
    - cd examples
    - "gradle -p filesystem build $GRADLE_OPTS $ARGS2"

example_mediahub:
  stage: buildExamples
  dependencies:
    - build
  script:
    - cd examples
    - "gradle -p mediahub build $GRADLE_OPTS $ARGS2"

example_restaurant:
  stage: buildExamples
  dependencies:
    - build
  script:
    - cd examples
    - "gradle -p restaurant build $GRADLE_OPTS $ARGS2"

example_university:
  stage: buildExamples
  dependencies:
    - build
  script:
    - cd examples
    - "gradle -p university build $GRADLE_OPTS $ARGS2"

deploy:
  stage: deploy
  dependencies:
    - build
  script:
    - "gradle deployUMLP $GRADLE_OPTS $ARGS3 -PmavenPassword=$pass -PmavenUser=$user"
  only:
    - master
    - develop

checkMDLinks:
  stage: check
  dependencies:
    - test_experiments
  script:
    - "curl --location --header \"PRIVATE-TOKEN: $secibuildtoken\" \"https://git.rwth-aachen.de/api/v4/projects/monticore%2Fmdlinkchecker/jobs/artifacts/master/raw/target/libs/MDLinkCheckerCLI.jar?job=build\" --output MDLinkCheckerCLI.jar"
    - "url=https://git.rwth-aachen.de/monticore/umlp/-/tree/master"
    - "linkCheckRes=$(java -jar MDLinkCheckerCLI.jar -url $url -t $secibuildtoken -p)"
    - "echo \"$linkCheckRes\""
    - "if [[ $linkCheckRes == *\"ERROR\"* ]]; then exit 1; fi"
  only:
    - master
