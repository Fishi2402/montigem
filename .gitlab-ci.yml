checkMDLinks:
  stage: check
  script:
    - "curl --location --header \"PRIVATE-TOKEN: $secibuildtoken\" \"https://git.rwth-aachen.de/api/v4/projects/monticore%2Fmdlinkchecker/jobs/artifacts/master/raw/target/libs/MDLinkCheckerCLI.jar?job=build\" --output MDLinkCheckerCLI.jar"
    - "url=https://git.rwth-aachen.de/monticore/umlp/-/tree/master"
    - "linkCheckRes=$(java -jar MDLinkCheckerCLI.jar -url $url -t $secibuildtoken -p)"
    - "echo \"$linkCheckRes\""
    - "if [[ $linkCheckRes == *\"ERROR\"* ]]; then exit 1; fi"
  only:
    - master

deploy-python-package:
  stage: build
  image: python:3.11
  script:
    - cd experiments/python-client/runtime-package
    - pip install --upgrade hatch
    - export HATCH_BUILD_METADATA="gitlab.${CI_PIPELINE_ID}"
    - python -m hatch build
    - python -m hatch publish
  variables:
    HATCH_INDEX_REPO: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi
    HATCH_INDEX_AUTH: $CI_JOB_TOKEN
    HATCH_INDEX_USER: gitlab-ci-token
  rules:
    - if: $CI_COMMIT_BRANCH == "dev" # only publish on dev
      changes:
        - experiments/python-client/runtime-package/**/* # and on changes to the runtime package dir

