# (c) https://github.com/MontiCore/monticore
image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:7-chromium-deps

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"

cache:
  paths:
    - .gradle/wrapper
  key: ${CI_COMMIT_REF_SLUG}

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
  #  - it_tests
  - check
  - deploy
  - testDeployed

build:
  stage: build
  script:
    - "gradle --version"
    - "gradle build --refresh-dependencies --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
    - "cd umlp-tool"
    - "gradle buildPlugin --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
  cache:
    paths:
      - examples/weather/frontend/build/frontendGen/node_modules
      - examples/weather/frontend/.gradle/nodejs
      - examples/sehub/frontend/build/frontendGen/node_modules
      - examples/sehub/frontend/.gradle/nodejs
      - examples/dtcockpit/frontend/build/frontendGen/node_modules
      - examples/dtcockpit/frontend/.gradle/nodejs
      - products/demorec/frontend/build/frontendGen/node_modules
      - products/demorec/frontend/.gradle/nodejs
  artifacts:
    paths:
      - examples/weather/frontend/build/frontendGen/dist/**
      - examples/weather/frontend/build/frontendGen/Dockerfile
      - examples/weather/frontend/build/frontendGen/Caddyfile
      - examples/weather/frontend/build/frontendGen/.dockerignore
      - examples/sehub/frontend/build/frontendGen/dist/**
      - examples/sehub/frontend/build/frontendGen/Dockerfile
      - examples/sehub/frontend/build/frontendGen/Caddyfile
      - examples/sehub/frontend/build/frontendGen/.dockerignore
      - examples/dtcockpit/frontend/build/frontendGen/dist/**
      - examples/dtcockpit/frontend/build/frontendGen/Dockerfile
      - examples/dtcockpit/frontend/build/frontendGen/Caddyfile
      - examples/dtcockpit/frontend/build/frontendGen/.dockerignore
      - products/demorec/frontend/build/frontendGen/dist/**
      - products/demorec/frontend/build/frontendGen/Dockerfile
      - products/demorec/frontend/build/frontendGen/Caddyfile
      - products/demorec/frontend/build/frontendGen/.dockerignore
      - umlp-tool/target/distributions/**

    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"

slowtest:
  stage: check
  dependencies:
    - build
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - "gradle --version"
    - "gradle slowtest --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
  artifacts:
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/slowtest/**/TEST-*.xml"

deployBackendDocker:
  stage: deploy
  dependencies:
    - build
  script:
    # Weather Backend
    - "gradle :examples:weather:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/weather_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # SEHub Backend
    - "gradle :examples:sehub:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/sehub_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # Stat-Server
    - "gradle :examples:stat:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/stat_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # DTCockpit Backend
    - "gradle :examples:dtcockpit:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
       -Djib.to.image=$CI_REGISTRY_IMAGE/dtcockpit_backend:latest \
       -Djib.to.auth.username=$CI_REGISTRY_USER  \
       -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # DemoRec Application
    - "gradle :products:demorec:backend:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
       -Djib.to.image=$CI_REGISTRY_IMAGE/demorec_backend:latest \
       -Djib.to.auth.username=$CI_REGISTRY_USER  \
       -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "

  only:
    - dev

deployRTE:
  stage: deploy
  dependencies:
    - build
  script:
    - "gradle :umlp-tool:publish :umlp-rte:publish :umlp-rte:umlp-frontend-rte-java:publish :umlp-rte:client:publish -P mavenPassword=$pass -P mavenUser=$user"
  only:
    - dev

