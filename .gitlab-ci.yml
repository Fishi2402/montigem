image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:6.8.2-jdk11

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"

cache:
  paths:
    - .gradle/wrapper
  key: ${CI_COMMIT_REF_SLUG}

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
#  - it_tests
  - check
  - deploy

build:
  stage: build
  script:
    - "gradle build --refresh-dependencies $GRADLE_OPTS $ARGS1"
  artifacts:
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"

#build_experiments:
#  stage: it_tests
#  dependencies:
#    - build
#  script:
#    - "gradle -p experiments build $GRADLE_OPTS $ARGS2"
#
#build_examples:
#  stage: it_tests
#  dependencies:
#    - build
#  script:
#    - "gradle -p examples build $GRADLE_OPTS $ARGS2"

deploy:
  stage: deploy
  dependencies:
    - build
  script:
    - "gradle :experiments:coreRequirements:jib $GRADLE_OPTS $ARGS3 \ 
      -Djib.to.image=$CI_REGISTRY_IMAGE/corerequirements:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
  only:
    - dev

checkMDLinks:
  stage: check
  script:
    - "curl --location --header \"PRIVATE-TOKEN: $secibuildtoken\" \"https://git.rwth-aachen.de/api/v4/projects/monticore%2Fmdlinkchecker/jobs/artifacts/master/raw/target/libs/MDLinkCheckerCLI.jar?job=build\" --output MDLinkCheckerCLI.jar"
    - "url=https://git.rwth-aachen.de/monticore/umlp/-/tree/master"
    - "linkCheckRes=$(java -jar MDLinkCheckerCLI.jar -url $url -t $secibuildtoken -p)"
    - "echo \"$linkCheckRes\""
    - "if [[ $linkCheckRes == *\"ERROR\"* ]]; then exit 1; fi"
  only:
    - master
