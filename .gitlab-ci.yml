# (c) https://github.com/MontiCore/monticore
image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:7-chromium-deps

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"
  FF_TIMESTAMPS: true

cache:
  paths:
    - .gradle/wrapper
  key: ${CI_COMMIT_REF_SLUG}

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
  #  - it_tests
  - check
  - deploy
  - testDeployed

gendoc:
  stage: build
  script:
    - gradle comment2doc:md --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user
  artifacts:
    paths:
      - docs/gendoc_components
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"

pages:
  stage: build
  needs: ["gendoc"]
  image: python:alpine
  rules:
    - if: $CI_COMMIT_BRANCH == "dev"
  before_script:
    - apk add gcc musl-dev python3-dev
    - pip install cython
    - pip install mkdocs
    - pip install mkdocs-material
  script:
    - mkdocs build --verbose --clean
    - mv site public
  artifacts:
    paths:
      - public

build_no_containers:
  stage: build
  script:
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle build --refresh-dependencies --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
    - "gradle :examples:vis-lib:frontend:build -Dj2ts_vislib=true 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
    # add one of the downloaded nodejs distributions to PATH, so we can build the vscode plugin
    - export PATH="$PATH:$(dirname $(find $(pwd) -type f -name "node" -print -quit))"
    - "cd umlp-tool"
    - "gradle packageUMLPWithGUIVscodePlugin -P buildVscodePlugin=true --info --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
  after_script:
    - "cp -r /root/.npm/_logs/ ."
  cache:
    paths:
      - .gradle/nodejs
      - examples/weather/frontend/build/app/node_modules
      - examples/sehub/frontend/build/app/node_modules
      - examples/dtcockpit/frontend/build/app/node_modules
      - products/demorec/frontend/build/app/node_modules
  artifacts:
    when: always
    paths:
      - umlp-tool/umlp-intellij-plugin/build/distributions/**
      - umlp-tool/build/generated-sources/UMLPWithGUI/**/*.vsix
      - ./**/build/reports/tests/test/**
      - build.log
      - ./_logs
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week
  except:
    refs:
      - dev

build_intellij_plugin:
  image: gradle:8.5
  stage: build
  script:
    - "cd umlp-tool"
    - "gradle buildPlugin -P buildIntelliJPlugin=true --info --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1 | tee -a $CI_PROJECT_DIR/build.log"
  artifacts:
    when: always
    paths:
      - umlp-tool/umlp-intellij-plugin/build/distributions/**
      - build.log
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week

build_with_deploy:
  stage: build
  script:
    # Build project + examples
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle build --refresh-dependencies --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
    - "gradle :examples:vis-lib:frontend:build -Dj2ts_vislib=true 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
    # Deploy RTEs
    - "gradle :umlp-tool:publish :umlp-tool:gradle-plugin:publish :umlp-rte:publish :umlp-rte:backend:publish :umlp-rte:frontend:publish :umlp-test-rte:publish :umlp-jsweet:publish :modules:publishModules :experiments:python-client:backend:publish -P mavenPassword=$pass -P mavenUser=$user 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
    # Build editor plugin
    # add one of the downloaded nodejs distributions to PATH, so we can build the vscode plugin
    - export PATH="$PATH:$(dirname $(find $(pwd) -type f -name "node" -print -quit))"
    - "cd umlp-tool"
    # monticore/monticore#4743 - "gradle packageUMLPWithGUIVscodePlugin -P buildVscodePlugin=true --info --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
    - "cd .."
    # Build containers
    # Backends
    - "gradle \
      :examples:weather:backend:jib \
      :examples:sehub:backend:jib \
      :examples:stat:jib \
      :products:demorec:backend:jib \
      :examples:vis-lib:backend:jib \
      :experiments:server-performance:backend:jib \
      -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.from.auth.username=$CI_REGISTRY_USER  \
      -Djib.from.auth.password=$CI_REGISTRY_PASSWORD \
      -Djib.console=plain \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD 2>&1 | tee -a $CI_PROJECT_DIR/build.log"

    # Frontends
    - "gradle \
      :examples:weather:frontend:deployImageCI \
      :examples:sehub:frontend:deployImageCI \
      :products:demorec:frontend:deployImageCI \
      :examples:vis-lib:frontend:deployImageCI \
      -P mavenPassword=$pass \
      -P mavenUser=$user $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
  cache:
    paths:
      - .gradle/nodejs
      - examples/weather/frontend/build/app/node_modules
      - examples/sehub/frontend/build/app/node_modules
      - examples/dtcockpit/frontend/build/app/node_modules
      - products/demorec/frontend/build/app/node_modules
  artifacts:
    when: always
    paths:
      - umlp-tool/umlp-intellij-plugin/build/distributions/**
      - umlp-tool/build/generated-sources/UMLPWithGUI/**/*.vsix
      - ./**/build/reports/tests/test/**
      - build.log
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"
    expire_in: 1 week
  only: # This job is deploying docker-containers... this should _really_ only happen from the `dev` branch
    refs:
      - dev

slowtest:
  stage: check
  tags:
    - node2-docker-postgres
  services:
    - postgres:12.2-alpine
  variables:
    POSTGRES_DB:  $POSTGRES_DB
    POSTGRES_USER:  $user
    POSTGRES_PASSWORD:  $pass
    POSTGRES_HOST_AUTH_METHOD: trust
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - "gradle --version 2>&1 | tee $CI_PROJECT_DIR/build.log"
    - "gradle slowtest --stacktrace -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1 2>&1 | tee -a $CI_PROJECT_DIR/build.log"
  artifacts:
    when: always
    paths:
      - build.log
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/slowtest/**/TEST-*.xml"
    expire_in: 1 week

