trigger-doppelkopf:
  stage: testDeployed
  allow_failure: false # Failure is not an option
  trigger:
    project: monticore/umlp-anwendungen/doppelkopf
    branch: main
  only:
    - dev


checkMDLinks:
  stage: check
  script:
    - "curl --location --header \"PRIVATE-TOKEN: $secibuildtoken\" \"https://git.rwth-aachen.de/api/v4/projects/monticore%2Fmdlinkchecker/jobs/artifacts/master/raw/target/libs/MDLinkCheckerCLI.jar?job=build\" --output MDLinkCheckerCLI.jar"
    - "url=https://git.rwth-aachen.de/monticore/umlp/-/tree/master"
    - "linkCheckRes=$(java -jar MDLinkCheckerCLI.jar -url $url -t $secibuildtoken -p)"
    - "echo \"$linkCheckRes\""
    - "if [[ $linkCheckRes == *\"ERROR\"* ]]; then exit 1; fi"
  only:
    - master

buildNativeImage:
  image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:7-native-image
  stage: build
  artifacts:
    paths:
      - ./examples/native-image/build/native/nativeCompile/*
  script:
    - "gradle :examples:native-image:nativeBuild --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
    - "gradle :examples:native-image:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
        -Djib.to.image=$CI_REGISTRY_IMAGE/native-image-demo:latest \
        -Djib.to.auth.username=$CI_REGISTRY_USER  \
        -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
