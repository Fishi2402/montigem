# (c) https://github.com/MontiCore/monticore
image: registry.git.rwth-aachen.de/monticore/container-registry/gradle:6.8.2-jdk11

variables:
  GRADLE_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2"

cache:
  paths:
    - .gradle/wrapper
  key: ${CI_COMMIT_REF_SLUG}

before_script:
  - export GRADLE_USER_HOME=`pwd`/.gradle

stages:
  - build
#  - it_tests
  - check
  - deploy

build:
  stage: build
  script:
    - "gradle --version"
    - "gradle build --refresh-dependencies -P mavenPassword=$pass -P mavenUser=$user $GRADLE_OPTS $ARGS1"
  cache:
    key:
      files:  # Cache depends on state of "package-lock"
        - experiments/coreRequirements/stanley/package-lock.json
    paths:
      - experiments/coreRequirements/stanley/node_modules
      - experiments/coreRequirements/stanley/.gradle/nodejs
  artifacts:
    paths:
      - experiments/coreRequirements/stanley/dist/**
    reports:
      # Lets gitlab render infos about failed tests
      junit: "**/test/**/TEST-*.xml"

deployBackendDocker:
  stage: deploy
  dependencies:
    - build
  script:
      # Core Requirements
    - "gradle :experiments:coreRequirements:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/corerequirements:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "
    # Stat-Server
    - "gradle :examples:stat:jib -P mavenPassword=$pass -P mavenUser=$user $ARGS3 \
      -Djib.to.image=$CI_REGISTRY_IMAGE/stat_backend:latest \
      -Djib.to.auth.username=$CI_REGISTRY_USER  \
      -Djib.to.auth.password=$CI_REGISTRY_PASSWORD "

  only:
    - dev

deployRTE:
  stage: deploy
  dependencies:
    - build
  script:
    - "gradle :umlp-tool:publish :umlp-rte:publish -P mavenPassword=$pass -P mavenUser=$user"
  only:
    - dev

### TODO: Do this via Gradle. e.g. similar to backend with JIB
deployFrontendDocker:
  stage: deploy
  tags:
    - shell
    - docker
  dependencies:
    - build
  script:
    - "cd experiments/coreRequirements/stanley"
    - "docker build . -t $CI_REGISTRY_IMAGE/corerequirements_frontend:latest"
    - "docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY"
    - "docker push $CI_REGISTRY_IMAGE/corerequirements_frontend:latest"
  only:
    - dev


checkMDLinks:
  stage: check
  script:
    - "curl --location --header \"PRIVATE-TOKEN: $secibuildtoken\" \"https://git.rwth-aachen.de/api/v4/projects/monticore%2Fmdlinkchecker/jobs/artifacts/master/raw/target/libs/MDLinkCheckerCLI.jar?job=build\" --output MDLinkCheckerCLI.jar"
    - "url=https://git.rwth-aachen.de/monticore/umlp/-/tree/master"
    - "linkCheckRes=$(java -jar MDLinkCheckerCLI.jar -url $url -t $secibuildtoken -p)"
    - "echo \"$linkCheckRes\""
    - "if [[ $linkCheckRes == *\"ERROR\"* ]]; then exit 1; fi"
  only:
    - master
