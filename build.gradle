plugins {
  id 'base'
  id 'de.rwth.se.umlp-tool' // See "umlp-tool/src/main/java/gradle"
  id "io.github.themrmilchmann.ecj" version "0.2.0"
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'io.github.themrmilchmann.ecj'

  dependencies {
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: junit_version
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: junit_version
  }
  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(11)
    }
  }

  test {
    useJUnitPlatform()
    testLogging {
      showStandardStreams = true
      events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
  }
  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword
      url repo
    }
    mavenCentral()
  }

  tasks.withType(JavaCompile).configureEach {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    options.encoding = 'UTF-8'
    options.warnings = false
  }

  jar {
    onlyIf { !sourceSets.main.allSource.files.isEmpty() }
  }

  configurations {
    all {
      exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
      exclude group: 'ch.qos.logback', module: 'logback-classic'
      exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
  }

  afterEvaluate {
    tasks.withType(gradle.specific.UMLPFrontendCIImageTask.class).each {
      it.getFullImageName().set(project.provider {
        String imgBase = Objects.requireNonNull(System.getenv("CI_REGISTRY_IMAGE"), "CI_REGISTRY_IMAGE not set")
        String parentName = project.parent.name
        return imgBase + "/" + parentName + "_frontend:latest"
      })
    }

    tasks.withType(gradle.specific.UMLPFrontendLocalImageTask.class).each {
      it.getFullImageName().set(getProject().provider(() ->
          (getProject().getParent() != null ? getProject().getParent().getName() : getProject().getName()) + "/frontend"
      ))
    }
  }
}

repositories { // required to resolve the ecj dependency, including the whole chain of repos to avoid unexpected behaviour
    if(("true").equals(getProperty('useLocalRepo'))) {
        mavenLocal()
    }
    maven {
        credentials.username mavenUser
        credentials.password mavenPassword
        url repo
    }
    mavenCentral()
}


build.dependsOn(gradle.includedBuild("umlp-tool").task(":build"))

task umlp_check_report
build.dependsOn(umlp_check_report)

