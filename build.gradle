import gradle.common.CommonUMLPTask
import gradle.common.UMLPOutputReportCheck

/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'base'
  id 'de.rwth.se.umlp-tool' // See "umlp-tool/src/main/java/gradle"
}

subprojects {
  apply plugin: 'java'

  dependencies {
    testRuntimeOnly group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-api', version: junit_version
    testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: junit_version
  }
  java {
    toolchain {
      languageVersion = JavaLanguageVersion.of(11)
    }
  }

  test {
    useJUnitPlatform()
    testLogging {
      showStandardStreams = true
      events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
  }
  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword
      url repo
    }
    mavenCentral()
  }

  tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
  }

  jar {
    onlyIf { !sourceSets.main.allSource.files.isEmpty() }
  }

  configurations {
    all {
      exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
      exclude group: 'ch.qos.logback', module: 'logback-classic'
      exclude group: 'org.apache.logging.log4j', module: 'log4j-to-slf4j'
    }
  }
}


build.dependsOn(gradle.includedBuild("umlp-tool").task(":build"))

task umlp_check_report
build.dependsOn(umlp_check_report)

subprojects {
  // After every UMLPTask, run basic checks on the generated report
  // e.g. "every generated file is also reported"
  tasks.withType(CommonUMLPTask).all {
    String taskname = it.name + "__check_report"
    CommonUMLPTask umlpTask = it
    if(!umlpTask.name.equals("guiVariability")) {  // ToDo @LN: Reporting for GuiVariabilityHandler
      Task t = task "$taskname"(type: UMLPOutputReportCheck) {
        dependsOn(umlpTask)
        input.from(umlpTask.input)
        // symbolOutDir.set(umlpTask.symbolOutDir)
        outputDir.set(umlpTask.outputDir)
        reportDir.set(umlpTask.reportDir)
        hwcDir.set(umlpTask.hwcDir)
        setOriginalTask(umlpTask)
      }
      umlp_check_report.dependsOn(t)
    }
  }
}

