/* (c) https://github.com/MontiCore/monticore */

plugins {
    id 'java'
    // id 'monticore' version "$mc_version"
    // id 'com.github.johnrengelman.shadow' version "$shadow_plugin_version"

    id 'de.rwth.se.umlp-tool' // See "umlp-tool/src/main/java/gradle"
}

test {
    useJUnitPlatform()
}

allprojects {
    group = 'umlp'
    repositories {
      mavenCentral()
      maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }
      maven {
        credentials.username mavenUser
        credentials.password mavenPassword
        url prrepo
      }
      if(("true").equals(getProperty('useLocalRepo'))) {
            mavenLocal()
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    jar {
        onlyIf { !sourceSets.main.allSource.files.isEmpty() }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    dependencies {
        implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
        implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version
        implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
        implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
        implementation group: 'de.monticore', name: 'class2mc', version: mc_version
        implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
        implementation group: 'de.monticore.lang', name: 'guidsl', version: mc_version
        implementation group: 'com.google.guava', name: 'guava', version: guava_version

        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: junit_version
    }
    // configure non-standard source sets
    sourceSets {
        main.java.srcDirs += ["$projectDir/target/generated-sources/monticore/sourcecode"]

        grammars {
            resources {
                srcDirs([grammarDir])
                include "**/*.mc4"
            }
        }
    }

    java {
        registerFeature('grammars') { usingSourceSet(sourceSets.grammars) }
    }

    compileJava {
        dependsOn project.collect { it.tasks.withType(UMLPTask) }
    }
    buildDir = file("$projectDir/target")
    sourceCompatibility = '11'
}

build.dependsOn(gradle.includedBuild("umlp-tool").task(":build"))

/**
 *  Builds the core projects, i.e. the umlp-tool and the examples.
 *  Executes JUnit tests and assembles the jars.
 */
task buildUMLP {
    group("build")
    description('Builds the core projects, i.e. the umlp-tool, experiments, and examples.')
    dependsOn(
            ":umlp-tool:build",
            ":experiments:build",
            ":examples:build"
    )
}

