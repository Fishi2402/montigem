/* (c) https://github.com/MontiCore/monticore */

plugins {
    id 'java'
    id 'monticore' version "$mc_version"
    id 'com.github.johnrengelman.shadow' version "$shadow_plugin_version"
}

allprojects {
    group = 'umlp'
    repositories {
        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }
        mavenLocal()
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    jar {
        onlyIf { !sourceSets.main.allSource.files.isEmpty() }
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'

    dependencies {
        implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
        implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version
        implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
        implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
        implementation group: 'de.monticore', name: 'class2mc', version: mc_version
        implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version

        testImplementation group: 'junit', name: 'junit', version: junit_version
    }
    // configure non-standard source sets
    sourceSets {
        main.java.srcDirs += ["$projectDir/target/generated-sources/monticore/sourcecode"]

        grammars {
            resources {
                srcDirs([grammarDir])
                include "**/*.mc4"
            }
        }

    }

    java {
        registerFeature('grammars') { usingSourceSet(sourceSets.grammars) }
    }

    buildDir = file("$projectDir/target")
    sourceCompatibility = '1.8'
}

project(':umlp-tool') {
    apply plugin: 'java'
    apply plugin: 'monticore'
    apply plugin: 'com.github.johnrengelman.shadow'

    dependencies {
        implementation "org.codehaus.groovy:groovy:$groovy_version"
        implementation "de.se_rwth.commons:se-commons-groovy:$mc_version"
        grammar("de.monticore.lang:cd4analysis:$mc_version") {
            capabilities { requireCapability("de.monticore.lang:cd4analysis-grammars") }
        }
        grammar("de.monticore:monticore-grammar:$mc_version") {
            capabilities { requireCapability("de.monticore:monticore-grammar-grammars") }
        }
    }

    description = 'UML/P Language and Tool'

    task generateUMLP(type: MCTask) {
        grammar = file "$grammarDir/UMLP.mc4"
        outputDir = file "$buildDir/generated-sources/monticore/sourcecode"
        def uptoDate = incCheck("UMLP.mc4")
        outputs.upToDateWhen { uptoDate }
    }

    compileJava {
        dependsOn project.collect { it.tasks.withType(MCTask) }
    }

    ///////////////////////// Building Jars //////////////////////////////////

    // build sources jar with handwritten + generated sources
    task sourcesJar(type: Jar) {
        archiveClassifier = 'sources'
        from(sourceSets.main.allJava)
    }

    sourcesJar.dependsOn project.collect { it.tasks.withType(MCTask) }

    shadowJar { // all in one jar
        manifest {
            attributes "Main-Class": "umlp.UMLPTool"
        }
        archiveClassifier = 'cli'
        archiveFileName = "UMLPTool.jar"
//        minimize()
        duplicatesStrategy DuplicatesStrategy.INCLUDE
    }

    jar.dependsOn(sourcesJar)
    jar.dependsOn(shadowJar)

    /////////////////////////   Deployment  //////////////////////////////////

    // configure deployment
    publishing {
        // configure what artifacts to publish
        publications {
            mavenJava(MavenPublication) {
                artifactId = "$project.name"
                from components.java
                artifact sourcesJar
            }
        }
        repositories.maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
            def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
            url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
        }
    }
}

//project(':examples') {
//
//}

/**
 *  Builds the core projects, i.e. the umlp-tool and the examples.
 *  Executes JUnit tests and assembles the jars.
 */
task buildUMLP {
    group("build")
    description('Builds the core projects, i.e. the umlp-tool and the examples.')
    dependsOn(
            ":umlp-tool:build",
            ":examples:build"
    )
}

/**
 *  Publishes the jars of the core projects, i.e. the umlp-tool and the examples
 *  to the nexus repository.
 *  Assembles the jars and publishes them, but does not execute JUnit tests.
 */
task deployUMLP {
    group("build")
    description('Publishes the core projects, i.e. the umlp-tool and the examples.')

    dependsOn(
            ":umlp-tool:publish",
            ":examples:publish"
    )
}
