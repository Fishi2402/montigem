# Example Docker-Compose for the deployment _on the server_
# Look for the comment "CHANGE ME" to see what needs to be modified on other deployments
#
# Also see "deploy.md"
#
version: "2.1"
services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=<ChangeThisPassword_PLEASE> # CHANGE ME: !!!!
      - POSTGRES_DB=umlpdb
      - POSTGRES_USER=admin
      - CONNECT_TIMEOUT=31536000
      - WAIT_TIMEOUT=31536000
    restart: "unless-stopped"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d umlpdb" ]
      interval: 5s
      timeout: 1s
      retries: 10
    expose:
      - 5432
# CHANGE ME: Comment in!
#    volumes:
#      - './db_data:/var/lib/postgresql/data/'     # Persist Data

  backend:
    image: registry.git.rwth-aachen.de/monticore/umlp/corerequirements # CHANGE ME: use your own backend-image
    environment:
      # CHANGE ME: your own domain, where the website should be available from
      # - UMLP_DEPLOYED_DOMAIN=https://<DOMAIN>  # Required for Allowed Origins

      - jdbc_driver=org.postgresql.Driver
      - database_url=jdbc:postgresql://db:5432/umlpdb
      - user=admin
      - password=<ChangeThisPassword_PLEASE>    # CHANGE ME: !!!!
    restart: "unless-stopped"
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8081/tcp

  frontend:  # Static Apache Server with Proxy to backend
    image: registry.git.rwth-aachen.de/monticore/umlp/corerequirements_frontend        # CHANGE ME: use your own frontend-image
# CHANGE ME: Comment in!
#    environment:
      # CHANGE ME: your own domain, where the website should be available from
    # - UMLP_DEPLOYED_DOMAIN=<DOMAIN>   # Required for SSL certificate
    restart: "unless-stopped"
# CHANGE ME: Comment in!
#    ports:
#      - '443:443'
#      - '80:80'
    links:
      - backend
# CHANGE ME: Comment in!
#    volumes:
#      - './caddy_secret_data:/data/'                         # Persist certificates, otherwise a new certificate might be created for every start
