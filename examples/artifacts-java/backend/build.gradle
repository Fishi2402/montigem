/* (c) https://github.com/MontiCore/monticore */
plugins {
  id 'de.rwth.se.umlp-tool-backend'
}

description 'artifacts example'

generateUmlpBackend {
  //configTemplate = "umlp.UMLP2JavaNeo4j"
  input = file("../models/JavaProject.umlp")
  modelDir.from(project(":examples:artifacts-test").projectDir.toPath().resolve("src").resolve("models").toFile())
}

dependencies {
  implementation project(":examples:artifacts-test")
  implementation group: 'org.neo4j', name: 'neo4j-jdbc-driver', version: neo4j_jdbc_version
  testImplementation "org.neo4j:neo4j:4.4.10"
  implementation "org.neo4j.driver:neo4j-java-driver:$neo4jVersion"
  implementation "com.github.javaparser:javaparser-symbol-solver-core:3.25.1"
  testImplementation project(':umlp-test-rte')
  implementation project(':umlp-rte')
}
