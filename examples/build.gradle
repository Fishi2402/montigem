subprojects {
  repositories {
        if(("true").equals(getProperty('useLocalRepo'))) {
            mavenLocal()
        }
        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }
    java {
      toolchain {
        languageVersion = JavaLanguageVersion.of(11)
      }
    }

    dependencies {
      implementation project(':umlp-rte')
      implementation group: 'com.google.code.gson', name: 'gson', version: gson_version

      testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
      testImplementation 'com.h2database:h2:2.1.214'
    }

    test {
      testLogging {
        events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
      }
      useJUnitPlatform()
    }
}

clean.dependsOn(subprojects.collect{it.getTasksByName("clean", false)})

build.dependsOn(subprojects.collect{ it.getTasksByName("build", false)})
