/* (c) https://github.com/MontiCore/monticore */

plugins {
    id 'java'
//    id "maven-publish"
}

subprojects {
    apply plugin: 'java'

    repositories {
        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }
        if(("true").equals(getProperty('useLocalRepo'))) {
            mavenLocal()
        }
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

    dependencies {
///        implementation project(":umlp-tool")
//        implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version
//        implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
//        implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
//        implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
        testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
    }

    sourceSets {
        main.java.srcDirs += ["$projectDir/target/generated-sources/monticore/sourcecode"]
    }
    buildDir = file("$projectDir/target")
    sourceCompatibility = '11'
}

clean.dependsOn(subprojects.collect{it.getTasksByName("clean", false)})

build.dependsOn(subprojects.collect{ it.getTasksByName("build", false)})

jar.enabled = false
