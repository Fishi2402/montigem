import gradle.specific.UMLPGuiGenTask

/* (c) https://github.com/MontiCore/monticore */
plugins {
  id 'java-library'

  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}

repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url repo
  }

  // native image
  maven { url "https://repo.spring.io/snapshot" }
  maven { url "https://repo.spring.io/milestone" }

  mavenCentral()
}

dependencies {
  implementation("umlp:umlp-rte:${mc_version}")
  testImplementation("com.h2database:h2:${h2_database}")

  implementation project(":examples:carrental-tmp:backend")
  // the backend also contains the sources of our domain
  domainSources project(":examples:carrental-tmp:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  testImplementation "de.monticore.lang:guidsl:${mc_version}"
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

node {
  download = true
  version = "${node_version}"
  nodeProxySettings = ProxySettings.OFF
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)


tasks.register('generateCDTOGUI', UMLPCdToGuiTask) {
  setGroup('build')
  input = file("../models/Carrental.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

tasks.register('guiVariability', GuiVariabilityHandlerTask) {
  input.from(generateCDTOGUI.getOutputDir())
  input.from(file("../models/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
  dependsOn(tasks.generateCDTOGUI)
}

genGUI {
  domainModels = ["Carrental"]
  guiCreateModels = []
  guiCreateModelsAsFile = file(generateCDTOGUI.getOutputDir().file("meta/carrental/guiCreateTextModels"))
  // Override input, do not use from
  input.setFrom(file(tasks.guiVariability.getOutputDir()))
  // Use cd2gui symbols instead of cd2gui/symbols
  symbolDir += generateCDTOGUI.getOutputDir().file("symbols")
  // and exclude the createDomainSymbols symbols (without gemId)
  var toExclude = tasks.createDomainSymbols.getSymbolOutDir().get().asFile
  symbolDir.setFrom symbolDir.filter(f -> f != toExclude)
  modelDir = file(tasks.guiVariability.getOutputDir())
  domainModels = ["Carrental"]
  dependsOn(tasks.guiVariability)

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

// TODO: For comparison: TS vs JSweet(Java)
tasks.register("genGuiTS", UMLPGuiGenTask.class) {
  domainModels = ["Carrental"]
  guiCreateModels = []
  guiCreateModelsAsFile = file(generateCDTOGUI.getOutputDir().file("meta/carrental/guiCreateTextModels"))
  // Override input, do not use from
//  input.setFrom(file(tasks.guiVariability.getOutputDir()))

  input.setFrom(tasks.genGUI.input)
  symbolDir.setFrom(tasks.genGUI.symbolDir)


  // Use cd2gui symbols instead of cd2gui/symbols
//  symbolDir += generateCDTOGUI.getOutputDir().file("symbols")
  // and exclude the createDomainSymbols symbols (without gemId)
  var toExclude = tasks.createDomainSymbols.getSymbolOutDir().get().asFile
//  symbolDir.setFrom symbolDir.filter(f -> f != toExclude)
//  symbolDir.from(configurations.guiTypes)
  modelDir = file(tasks.guiVariability.getOutputDir())
  domainModels = ["Carrental"]
  dependsOn(tasks.guiVariability)

  getGuiGenTSFuncionality().set(true)
  getGuiGenJsweet().set(false);
  outputDir = file "$buildDir/gen_gui_ts"
  symbolOutDir = file "$buildDir/gen_gui_ts_s"



  // might output not working code, as the domain is also transpiled
}

translateJava2TSDomain {
  domainModel = 'Carrental'
  verbose = true
  dependsOn(tasks.generateCDTOGUI, tasks.genGUI)
}

translateJava2TSGUI {
  domainModel = 'Carrental'
  verbose = true
  dependsOn(tasks.generateCDTOGUI, tasks.genGUI)
}

nodeSetup.dependsOn(frontendSetup)

def prebuildTasks = [
    npmInstall, generate, translateJava2TSGUI
]

task buildApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

task testApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

task runApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}
