plugins {
  id 'de.rwth.se.montigem-backend'

  id 'com.google.cloud.tools.jib' version '3.4.4'
  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'org.springframework.boot' version "${spring_version}"
}


dependencies {
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }
  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
  implementation 'com.h2database:h2:2.1.214'

  implementation group: 'de.se-rwth.artifacts', name: 'sourcemap', version: sourcemap_version

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.10"

  implementation group: "org.apache.commons", name: 'commons-text', version: '1.10.0'

  compileOnly group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2', withoutSpringLogging
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2', withoutSpringLogging
  implementation project(':umlp-rte')
  implementation project(':umlp-rte:frontend')
  testImplementation project(':umlp-test-rte')
}

umlp2java{
  doFirst {
    System.setProperty("MC_REPORT_SOURCE_MAPPING", "true")
  }

  doLast {
    System.setProperty("MC_REPORT_SOURCE_MAPPING", "false")
  }
}

// Use rootDir.absolutePath to ensure absolute paths in XML/JSON reports resolve correctly
def containerWorkspaceRoot = "/" + rootProject.rootDir.absolutePath
    .replace("\\", "/")
    .replace(":", "")
    .replaceAll("^/+", "")
jib{
  from.image =  'eclipse-temurin:21-jre-alpine'//"$container_from_image"
  to.image = "${container_target_image_base}coverage-dashboard-backend:latest"

  container{
    mainClass = application.mainClass.get()
    workingDirectory = "${containerWorkspaceRoot}/examples/coverage-dashboard/backend"
  }

  extraDirectories{
    paths{
      path{
        setFrom(rootProject.file("examples/jsweet-test/frontend/build/app/coverage"))
        includes = ['coverage-final.json']
        into = "${containerWorkspaceRoot}/examples/jsweet-test/frontend/build/app/coverage"
      }

      path {
        setFrom(rootProject.file("umlp-jsweet/build/reports/jacoco/test"))
        includes = ['jacocoTestReport.xml']
        into = "${containerWorkspaceRoot}/umlp-jsweet/build/reports/jacoco/test"
      }

      path {
        setFrom(rootProject.file("examples/jsweet-test/frontend/build/reports/jacoco/jacocoAggregated"))
        includes = ['jacocoAggregated.xml']
        into = "${containerWorkspaceRoot}/examples/jsweet-test/frontend/build/reports/jacoco/jacocoAggregated"
      }

      path {
        setFrom(rootProject.file("umlp-jsweet/src/main/java"))
        into = "${containerWorkspaceRoot}/umlp-jsweet/src/main/java"
      }
    }
  }
}

tasks.matching { it.name.startsWith('jib') }.configureEach {
  // Depend on tasks from other modules in your root Gradle build
  dependsOn(
      ':umlp-jsweet:jacocoTestReport',
      ':examples:jsweet-test:frontend:test',
      ':examples:jsweet-test:frontend:generateC8Report'
  )
}
