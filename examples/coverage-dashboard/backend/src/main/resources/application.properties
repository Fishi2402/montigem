server.servlet.context-path=/umlp/api
server.port=${PORT:8081}

# Multipart upload limits for CI/CD coverage bundles
spring.servlet.multipart.max-file-size=${COVERAGE_MAX_UPLOAD_SIZE:200MB}
spring.servlet.multipart.max-request-size=${COVERAGE_MAX_UPLOAD_SIZE:200MB}

# Coverage artifact ingestion
coverage.ingestion.storage-dir=${COVERAGE_STORAGE_DIR:./coverage-storage}
coverage.ingestion.max-extracted-bytes=${COVERAGE_MAX_EXTRACTED_BYTES:1073741824}
coverage.ingestion.load-local-data=${COVERAGE_LOAD_LOCAL_DATA:false}
