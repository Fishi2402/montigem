plugins {
  id 'java'
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}


dependencies {
  implementation project(":examples:dtcockpit-jsweet:backend")
  // a configuration containing the domain sources
  domainSources project(":examples:dtcockpit-jsweet:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
  testImplementation project(':umlp-test-rte')
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

genGUI {
  domainModels = ["Dtcockpit"]
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate"]
}

translateJava2TSDomain {
  verbose = false
}

translateJava2TSGUI {
  verbose = false
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}


// End 2 end testing using the build website + backend
tasks.register('installPlaywright', NpxTask){
  dependsOn(npmInstall)
  command = "playwright"
  args = ["install"]
}

// TODO: Let those tasks use a shared service, as to stop gradle from executing them in parallel
tasks.register('e2eTestApp', NpmTask){
  dependsOn(buildApp, installPlaywright, project(":examples:dtcockpit-jsweet:backend").tasks.e2eBootJar)
  args = ["run", "e2e"]
  enabled = false // TODO: ALu
}

tasks.register('e2eTestAppDebug', NpmTask){
  dependsOn(buildApp, installPlaywright, project(":examples:dtcockpit-jsweet:backend").tasks.e2eBootJar)
  args = ["run", "e2e", "--", "--debug"]
  enabled = false // TODO: ALu
}

tasks.register('e2eRecordTest', NpmTask) {
  // Note: Start a backend & frontend before running this command
  dependsOn(installPlaywright)
  args = ["run", "e2erecord"]
  enabled = false // TODO: ALu
}

tasks.register('linkStuff', NpmTask) {
  dependsOn(prebuildTasks)
  // Avoid declaring the junction paths directly as outputs
  outputs.upToDateWhen {
    def hwcsrc = file("$buildDir/frontendGen/hwcsrc")
    def loginDomain = file("$buildDir/frontendGen/login_moduel_domain")
    def loginGui = file("$buildDir/frontendGen/login_module_gui")
    def frontendOut = file("$buildDir/frontendGen/build/umlp_frontend")
    isJunction(hwcsrc) &&
    isJunction(loginDomain) &&
    isJunction(loginGui) &&
    isJunction(frontendOut)
  }

  args = ['run', 'custom']
}

// Utility method to detect junction/symlink
static boolean isJunction(File file) {
  return java.nio.file.Files.isSymbolicLink(file.toPath())
}

tasks.named('runApp') {
  dependsOn {
    tasks.named('linkStuff').get()
  }
}


tasks.named('buildApp') {
  dependsOn {
    tasks.named('linkStuff').get()
  }
}
