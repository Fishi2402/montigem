plugins {
  id 'java'
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}

configurations {
  // a configuration containing the domain sources
  domainSources {
    setTransitive(false)
    attributes {
      attribute(Attribute.of("org.gradle.verificationtype", String), "main-sources")
      attribute(Attribute.of("org.gradle.dependency.bundling", String), "external")
    }
  }
}

dependencies {
  implementation project(":examples:dtcockpit-jsweet:backend")
  domainSources project(":examples:dtcockpit-jsweet:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
}

node {
  download = true
  version = "${node_version}"
  nodeProxySettings = ProxySettings.OFF
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

configurations {
  jsweettranspiler {
    extendsFrom(configurations.compileClasspath)
  }
}
dependencies {
  jsweettranspiler project(":umlp-rte:umlp-jsweet")
}

genGUI {
  domainModels = ["Dtcockpit"]
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate"]
  dependsOn([tasks.createDomainSymbols,tasks.genDomain])
}

translateJava2TSDomain {
  domainModel = 'Dtcockpit'
  getJSweetClassPath().from(configurations.jsweettranspiler)

  // add domain-sources to the to-be-transpiled
  input.from(configurations.domainSources)

  // TODO: Fix ShellAPI imports
  // Required due to "imports cannot use * wildcards when using modules"
  getExcludeSource().add("glob:**/shellapi/*ShellAPI.java") // via @Erased

  verbose = false
}

translateJava2TSGUI {
  domainModel = 'Dtcockpit'
  getJSweetClassPath().from(configurations.jsweettranspiler)

  input.from(tasks.getByName("genGUI").getOutputDir())
  input.from("src/main/java") // plz?

  // TODO: Remove the following at some point
  // required with getExcludeTranspile - otherwise "import { Project } from '@src/dtcockpit/Project';" is missing
  input.from(configurations.domainSources)
  getExcludeSource().add("glob:**/shellapi/*ShellAPI.java")
  getExcludeTranspile().add("glob:**/dtcockpit/**.java")

  // TODO: END OF REMOVAL

  verbose = true
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

task buildApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

task testApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

task runApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}
