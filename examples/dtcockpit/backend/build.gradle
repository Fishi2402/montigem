import de.montigem.gradle.common.SpringBootJarTypeFileSpec
import de.montigem.gradle.specific.UMLP2JavaTask
import org.springframework.boot.gradle.tasks.run.BootRun

plugins {
  id 'de.rwth.se.montigem-backend-test'

  id 'com.google.cloud.tools.jib' version '3.4.4'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
  id 'org.springframework.boot' version "${spring_version}"
}

dependencies {
  montigemModule project(":modules:login")
  montigemModuleGeneratorExtension project(":modules:login")
  montigemModuleUMLPModels project(":modules:login")
  montigemModuleUMLPSymbols project(":modules:login")
  montigemModuleImportMap project(":modules:login")
  montigemModuleGUISymbols project(":modules:login")

  montigemModule project(":modules:comment")
  montigemModuleGeneratorExtension project(":modules:comment")
  montigemModuleUMLPModels project(":modules:comment")
}

jib { // For Docker-Container
  container.mainClass = application.mainClass.get()
  from.image = "$container_from_image"
  to.image = "${container_target_image_base}dtcockpit_backend:latest"
}

dependencies {
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }

  implementation project(':umlp-rte')

  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
  implementation 'com.h2database:h2:2.1.214'

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version
  developmentOnly("org.springframework.boot:spring-boot-devtools:$spring_version")  // Used for Hot Reload!

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.10"

  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging

  implementation "org.eclipse.jgit:org.eclipse.jgit:5.2.2.201904231744-r"

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'
  implementation group: 'com.sun.activation', name: 'javax.activation', version: '1.2.0'

  implementation("com.hivemq:hivemq-mqtt-client:1.3.0")

  implementation group: 'org.gitlab4j', name: 'gitlab4j-api', version: '5.3.0'

  // Welcome board
  implementation("com.microsoft.ews-java-api:ews-java-api:2.0") // Exchange api for calendar
  implementation("javax.xml.ws:jaxws-api:2.3.1") // Needed for exchange api
  implementation("org.jsoup:jsoup:1.17.1") // HTML of outlook appointment body to readable text

  testImplementation group: 'org.neo4j', name: 'neo4j-jdbc-driver', version: '4.0.9'
  testImplementation "org.neo4j:neo4j:4.4.10"
  testImplementation "org.neo4j.driver:neo4j-java-driver:$neo4jVersion"
}

tasks.named("umlp2java", UMLP2JavaTask) {
  modelDir.from(configurations.named("montigemModuleUMLPModels"))
  useShell = true
}

tasks.register('runShellApi', BootRun) {
  group = "application"
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'dtcockpit.DtcockpitShellAPIApplication'
  standardInput = System.in
}

sourceSets {
  test {
    java {
      exclude '**/gui/**'
    }
  }
  e2esetup {
    compileClasspath += sourceSets.main.output
    runtimeClasspath += sourceSets.main.output
  }
}

tasks.register("e2eBootJar", org.springframework.boot.gradle.tasks.bundling.BootJar.class) {
  group = "build"
  var e2es = sourceSets.e2esetup;
  classpath = project.provider({
    e2es.getRuntimeClasspath()
        .minus((configurations.developmentOnly.minus(configurations.productionRuntimeClasspath)))
//      .minus((configurations.testAndDevelopmentOnly.minus(configurations.productionRuntimeClasspath)))
        .filter(new SpringBootJarTypeFileSpec())
  })
  mainClass = "e2e.E2EServerApplication"
  archiveClassifier.set("e2esetup")
}

tasks.register("e2eRun", JavaExec.class) {
  group = "application"
  mainClass = "e2e.E2EServerApplication"
  classpath = project.files().from(project.provider({ tasks.e2eBootJar.classpath }))
}

tasks.withType(Zip).all {
  duplicatesStrategy = DuplicatesStrategy.WARN
}
tasks.withType(Tar).all {
  duplicatesStrategy = DuplicatesStrategy.WARN
}
