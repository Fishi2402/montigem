plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend-test"  // suffix "-test" adds aditional tests of the UMLPGenerator to "build" task
}


dependencies {
  umlpModulesGen("umlp.modules:login:$version") // Load generator modifications
  umlpModulesDomainSymbols("umlp.modules.login:frontendTS:$version") // frontend domain symbols
  umlpModulesModels("umlp.modules:login:$version") // and models itself
}

// ALus local gradle is apparently unaware of these versions?
// Explicitly use the local login module
configurations.all {
  resolutionStrategy.dependencySubstitution {
    substitute module("umlp.modules:login") using project(":modules:login")
    substitute module("umlp.modules.login:frontendTS") using project(":modules:login:frontendTS")
  }
}


node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}

createDomainSymbols {
}

genDomain {
  // TODO: Gradle setup


  // Alternative: Generate the module-frontend-domain too
  input = file("../models/Dtcockpit.umlp")
//  modelDir.from(configurations.umlpModulesModels) // TODO: Move this module logic into the plugin

  // TODO: The module has to be added to the tsconfig path
  /*
      "paths": {
      "@src/*": ["build/appdomain/*", "build/appgui/*", "src/app/*", "../../src/app/*",
        "../../../../../modules/login/frontendsTS/build/frontendGen/build/appdomain/*",
        "../../../../../modules/login/frontendsTS/src/app/*",
      ],

   */

}

genGUI {
  domainModels = ["Dtcockpit"] // "LoginModule" is included via the modGen (or not required?)
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate", "gui.project.ProjectsCreateByGroup"]

  // TODO: Gradle Setup for modules
  symbolDir.from(() -> tasks.named("createDomainSymbols").get().outputs)

  // Load the symbols from the .jars in the domain symbols path
//  symbolDir.from(configurations.umlpModulesDomainSymbols) // TODO: Move this module logic into the plugin

//  outputs.upToDateWhen { false }
  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}
nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate,  // Created from UMLP-Frontend Plugin.
    providers.provider { project(":modules:login:frontendTS").tasks.named("generate")}
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}
tasks.register('run') {
  dependsOn(runApp)
}
