/* (c) https://github.com/MontiCore/monticore */

plugins {
  id "de.rwth.se.montigem-frontend"
  // id "de.rwth.se.montigem-frontend-test"  // suffix "-test" adds aditional tests of the UMLPGenerator to "build" task
}

dependencies {
  implementation project(":examples:dtcockpit:backend")
  // a configuration containing the domain sources
  domainSources project(":examples:dtcockpit:backend")

  montigemModule project(":modules:login")
  montigemModuleGenExt project(":modules:comment")
  montigemModuleUMLPModels project(":modules:comment")

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version
  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation project(':umlp-test-rte')
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}

genGUI {
  domainModels = ["Dtcockpit"] // "LoginModule" is included via the modGen (or not required?)
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate", "gui.project.ProjectsCreateByGroup"]

  // TODO: Gradle Setup for modules
  symbolDir.from(() -> tasks.named("createDomainSymbols").get().outputs)

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}
nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

translateJava2TSDomain {
  verbose = false
}

translateJava2TSGUI {
  verbose = false
}

tasks.named('buildApp', NpxTask) {
  dependsOn(
    project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") }
  )
}

tasks.named('testApp') {
  dependsOn(project(':modules:login:frontend').tasks.named('models2ts'))
}

tasks.named("symlinkCreation") {
  dependsOn {
    project(':modules:login:frontend').tasks.named('models2ts')
    // project(':modules:comment:frontend').tasks.named('generate')
  }

  def loginDomain = file("$buildDir/frontendGen/login_module_domain")
  def loginDomainTarget = file("../../../modules/login/frontend/build/frontendGen/build/appdomain")

  def loginGui = file("$buildDir/frontendGen/login_module_gui")
  def loginGuiTarget = file("../../../modules/login/frontend/build/frontendGen/build/appgui")

  def loginHWC = file("$buildDir/frontendGen/login_hwc")
  def loginHWCTarget = file("../../../modules/login/frontend/login")

  getSymlinkMap().put(loginDomain, loginDomainTarget)
  getSymlinkMap().put(loginGui, loginGuiTarget)
  getSymlinkMap().put(loginHWC, loginHWCTarget)
}

tasks.named('runApp') {
  dependsOn(project(':modules:login:frontend').tasks.named('models2ts'))
}

tasks.register('run') {
  dependsOn(runApp)
}

// End 2 end testing using the build website + backend
tasks.register('installPlaywright', NpxTask){
  dependsOn(npmInstall)
  command = "playwright"
  args = ["install"]
}

// TODO: Let those tasks use a shared service, as to stop gradle from executing them in parallel
tasks.register('e2eTestApp', NpmTask){
  dependsOn(buildApp, installPlaywright, project(":examples:dtcockpit:backend").tasks.e2eBootJar)
  args = ["run", "e2e"]
  enabled = false // TODO: ALu
}

tasks.register('e2eTestAppDebug', NpmTask){
  dependsOn(buildApp, installPlaywright, project(":examples:dtcockpit:backend").tasks.e2eBootJar)
  args = ["run", "e2e", "--", "--debug"]
  enabled = false // TODO: ALu
}

tasks.register('e2eRecordTest', NpmTask) {
  // Note: Start a backend & frontend before running this command
  dependsOn(installPlaywright)
  args = ["run", "e2erecord"]
  enabled = false // TODO: ALu
}
