tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.named('testApp') {
  dependsOn {
    project(':modules:login:frontendTS').tasks.named('generate').get()
    // project(':modules:comment:frontendTS').tasks.named('generate').get()
  }
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

tasks.register('linkStuff', NpmTask) {
  dependsOn(prebuildTasks)
  // Avoid declaring the junction paths directly as outputs
  outputs.upToDateWhen {
    def hwcsrc = file("$buildDir/frontendGen/hwcsrc")
    def loginDomain = file("$buildDir/frontendGen/login_moduel_domain")
    def loginGui = file("$buildDir/frontendGen/login_module_gui")
    def frontendOut = file("$buildDir/frontendGen/build/umlp_frontend")
    isJunction(hwcsrc) &&
        isJunction(loginDomain) &&
        isJunction(loginGui) &&
        isJunction(frontendOut)
  }

  args = ['run', 'custom']
}

// Utility method to detect junction/symlink
static boolean isJunction(File file) {
  return java.nio.file.Files.isSymbolicLink(file.toPath())
}


tasks.named('runApp') {
  dependsOn {
    tasks.named('linkStuff').get()
  }
}

tasks.named('buildApp') {
  dependsOn {
    tasks.named('linkStuff').get()
  }
}


tasks.named('runApp') {
  dependsOn {
    project(':modules:login:frontendTS').tasks.named('generate').get()
    // project(':modules:comment:frontendTS').tasks.named('generate').get()
  }
}

tasks.register('run') {
  dependsOn(runApp)
}

