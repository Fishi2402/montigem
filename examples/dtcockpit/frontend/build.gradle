plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}


configurations {
  guiDefaultTypes
}

dependencies {
  guiDefaultTypes "de.monticore.lang:guidsl:${project.properties['mc_version']}:default-types"
}

