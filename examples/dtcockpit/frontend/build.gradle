import de.montigem.gradle.specific.CreateSymlinkTask

/* (c) https://github.com/MontiCore/monticore */

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  montigemModule project(":modules:login")
  montigemModuleGeneratorExtension project(":modules:login")
  montigemModuleUMLPModels project(":modules:login")
  montigemModuleUMLPSymbols project(":modules:login")
  montigemModuleImportMap project(":modules:login")
  montigemModuleGUISymbols project(":modules:login")

  montigemModule project(":modules:comment")
  montigemModuleGeneratorExtension project(":modules:comment")
  montigemModuleUMLPModels project(":modules:comment")
  montigemModuleUMLPSymbols project(":modules:comment")
  montigemModuleImportMap project(":modules:comment")

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version
  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation project(':umlp-test-rte')
}

gui2java2ts {
  verbose = false
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate", "gui.project.ProjectsCreateByGroup"]

  symbolPath.from(configurations.named("montigemModuleUMLPSymbols"));

  // TODO: Gradle Setup for modules
  // symbolOutDir.from(() -> tasks.named("umlp2sym").get().outputs)

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

umlpJava2ts {
  verbose = false
}

tasks.named('testApp') {
  dependsOn(project(':modules:login:frontend').tasks.named('build'))
  dependsOn(project(':modules:comment:frontend').tasks.named('build'))
}

tasks.named("createSymlink", CreateSymlinkTask) {
  dependsOn {
    project(':modules:login:frontend').tasks.named('build')
    project(':modules:comment:frontend').tasks.named('build')
  }

  links.put(
      file("$buildDir/app/libs/@montigem/login"),
      project(':modules:login:frontend:login').layout.getProjectDirectory().getAsFile()
  )
  links.put(
      file("$buildDir/app/prodlibs/@montigem/login"),
      project(':modules:login:frontend').layout.getBuildDirectory().dir("dist/login").get().getAsFile()
  )

  links.put(
      file("$buildDir/app/libs/@montigem/comment"),
      project(':modules:comment:frontend:comment').layout.getProjectDirectory().getAsFile()
  )
  links.put(
      file("$buildDir/app/prodlibs/@montigem/comment"),
      project(':modules:comment:frontend').layout.getBuildDirectory().dir("dist/comment").get().getAsFile()
  )
}

tasks.named('runApp') {
  dependsOn(project(':modules:login:frontend').tasks.named('build'))
}

// End 2 end testing using the build website + backend
def installPlaywright = tasks.register('installPlaywright', NpxTask) {
  dependsOn(npmInstall)
  command = "playwright"
  args = ["install"]
}

// TODO: Let those tasks use a shared service, as to stop gradle from executing them in parallel
tasks.register('e2eTestApp', NpmTask) {
  dependsOn(
      tasks.named("buildApp"),
      installPlaywright,
      project(":examples:dtcockpit:backend").tasks.named("e2eBootJar")
  )
  args = ["run", "e2e"]
  enabled = false // TODO: ALu
}

tasks.register('e2eTestAppDebug', NpmTask) {
  dependsOn(
      tasks.named("buildApp"),
      installPlaywright,
      project(":examples:dtcockpit:backend").tasks.named("e2eBootJar")
  )
  args = ["run", "e2e", "--", "--debug"]
  enabled = false // TODO: ALu
}

tasks.register('e2eRecordTest', NpmTask) {
  // Note: Start a backend & frontend before running this command
  dependsOn(installPlaywright)
  args = ["run", "e2erecord"]
  enabled = false // TODO: ALu
}
