plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend-test"  // suffix "-test" adds aditional tests of the UMLPGenerator to "build" task
}

configurations {
  umlpModulesDomainSymbols
  umlpModulesModels
}

dependencies {
  umlpModules(project(path: ":modules:login", configuration: "moduleGenTime")) // Load generator modifications
  umlpModulesDomainSymbols(project(path: ":modules:login:frontendTS", configuration: "umlpOutgoingDomainSymbols")) // frontend domain symbols
  umlpModulesModels(project(path: ":modules:login", configuration: "umlpOutgoingModels")) // and models itself
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}

createDomainSymbols {
  // TODO: via resolveable configs
  modelDir.from(configurations.umlpModulesModels)

}

genDomain {
  // TODO: Gradle setup
  /*
  genDomain with A extends B (where B is only a symbol import)
   0xA7003x57269 get for AstNode can't return a value. Attribute is empty.

	at de.monticore.cdbasis._symboltable.CDTypeSymbolTOP.getAstNode(CDTypeSymbolTOP.java:1)
	at de.monticore.cd._symboltable.CDSymbolTables.getTransitiveSuperTypes(CDSymbolTables.java:86)
   */

  // Alternative: Generate the module-frontend-domain too
  input = file("../models/Dtcockpit.umlp")
  modelDir.from(configurations.umlpModulesModels)

  // TODO: tsconfig path
  /*
      "paths": {
      "@src/*": ["build/appdomain/*", "build/appgui/*", "src/app/*", "../../src/app/*",
        "../../../../../modules/login/frontendsTS/build/frontendGen/build/appdomain/*",
        "../../../../../modules/login/frontendsTS/src/app/*",
      ],

   */

}

genGUI {
  domainModels = ["Dtcockpit", "LoginModule"]
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate", "gui.project.ProjectsCreateByGroup"]

  // TODO: Gradle Setup for modules
  symbolDir.from(() -> tasks.named("createDomainSymbols").get().outputs)

  //  symbolDir.from(configurations.umlpModulesDomainSymbols)
  // TODO: When using the .jar - the .tags files are not found by TagRelated#initLookup
  symbolDir.from(() -> project(":modules:login:frontendTS").tasks.named("createDomainSymbols").get().outputs)


  outputs.upToDateWhen { false }
  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}
nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate,  // Created from UMLP-Frontend Plugin.
    providers.provider { project(":modules:login:frontendTS").tasks.named("generate")}
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}
tasks.register('run') {
  dependsOn(runApp)
}
