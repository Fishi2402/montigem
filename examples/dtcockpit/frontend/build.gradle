nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate,  // Created from UMLP-Frontend Plugin.
    providers.provider { project(":modules:login:frontendTS").tasks.named("generate")},
    // providers.provider { project(":modules:comment:frontendTS").tasks.named("generate")}
]

tasks.register('buildApp', NpxTask) {
  dependsOn(
    prebuildTasks,
    project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") }
  )
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

