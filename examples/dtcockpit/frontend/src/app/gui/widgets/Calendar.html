<div class="calendar-day" [ngStyle]="{width: stdNumberBlockWidth + '%'}">
  <div class="empty-block" [ngStyle]="{height: stdDateBlockHeight + '%'}">
  </div>
  <ng-container *ngFor="let hour of hours">
    <div class="empty-block" [ngStyle]="{height: stdEmptyBlockHeight + '%'}">
      {{hour}}
    </div>
  </ng-container>
</div>
<ng-container *ngFor="let day of days">
  <div class="calendar-day" [ngStyle]="{width: stdEmptyBlockWidth + '%'}">
    <div class="empty-block" [ngStyle]="{height: stdDateBlockHeight + '%'}">
      <div class="date-block">
        {{ day.toLocaleDateString('de-DE', { weekday: 'long' }) }}
      </div>
      <div class="date-block">
        {{ day.getDate() }}
      </div>
    </div>
    <ng-container *ngFor="let hour of hours">
      <div class="empty-block" [ngStyle]="{height: stdEmptyBlockHeight + '%'}">
      </div>
    </ng-container>
  </div>
</ng-container>

<ng-container *ngFor="let m of getCalendar()">
  <div
    class="meeting"
    [ngStyle]="{
      left: m.x + '%',
      top: m.y + '%',
      width: m.w + '%',
      height: m.h + '%'
    }"
  >
    <div class="meeting-title">
      {{ m.title }}
    </div>
    <div class="meeting-location">
      {{ m.loc }}
    </div>
  </div>
</ng-container>
