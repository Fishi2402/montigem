<ng-container *ngIf="direction === 'down'">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="15%" height="15%"
  >
    <circle cx="5" cy="5" r="5" class="circle"/>
    <line x1="5" y1="5" x2="10%" y2="80%" class="line"/>
    <line x1="10%" y1="80%" x2="50%" y2="80%" class="line"/>
  </svg>
  <div class="text-container top-down">{{topInfo}}</div>
  <div class="text-container bot-down">{{botInfo}}</div>
</ng-container>

<ng-container *ngIf="direction === 'up'">
  <svg
    xmlns="http://www.w3.org/2000/svg"
    width="15%" height="15%"
    class="up"
  >
    <circle cx="5" cy="5" r="5" class="circle"/>
    <line x1="5" y1="5" x2="10%" y2="80%" class="line"/>
    <line x1="10%" y1="80%" x2="50%" y2="80%" class="line"/>
  </svg>
  <div class="text-container top-up">{{topInfo}}</div>
  <div class="text-container bot-up">{{botInfo}}</div>
</ng-container>
