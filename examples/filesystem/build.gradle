description 'filesystem example'

task generateFileSystem(type: JavaExec) {
    group = 'umlp'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'umlp.UMLPTool'
    args '-i', 'src/FileSystem.umlp', '-o', 'target'
}

build.dependsOn(generateFileSystem)
