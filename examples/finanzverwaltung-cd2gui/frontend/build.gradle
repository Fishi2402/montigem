tasks.register('genGUI2', UMLPGuiGenTask) {
  enabled(useCD2GUI)
  setGroup('build')
  dependsOn(genGUI, guiVariability, generateCDTOGUI)
  input = file(guiVariability.getOutputDir())
  symbolDir = files(
      generateCDTOGUI.getOutputDir().file("symbols"),
      configurations.guiLib,
      configurations.guiTypes,
      configurations.umlpModulesDomainSymbols,
      configurations.umlpModulesImportMap,
      configurations.umlpModulesGuiSymbols
  )
  hwcDir = file("src/app/")
  symbolOutDir = layout.buildDirectory.dir("umlp/fe2/symbols")
  outputDir = layout.buildDirectory.dir("umlp/fe2")
  modelDir = file(guiVariability.getOutputDir())
  domainModels = ["Finanzverwaltung"]
  // Note: on windows its Finanzverwaltung, ob *nix its finanzverwaltung (lowercase)
  guiCreateModelsAsFile = file(generateCDTOGUI.getOutputDir().file("meta/finanzverwaltung/guiCreateTextModels"))
  // TODO: generateCDTOGUI is skipped due to module path
  enabled = false
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    genGUI2,
    tasks.named("generate"),
    providers.provider { project(":modules:login:frontendTS").tasks.named("generate")},
]

tasks.register('buildApp', NpxTask) {
  dependsOn(
      prebuildTasks,
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") },
  )
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

