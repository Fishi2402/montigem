tasks.named("symlinkCreation")  {
  dependsOn(prebuildTasks)

  dependsOn {
    project(':modules:login:frontendTS').tasks.named('generate').get()
    // project(':modules:comment:frontendTS').tasks.named('generate').get()
  }

  def loginDomain = file("$buildDir/frontendGen/login_module_domain")
  def loginDomainTarget = file("../../../modules/login/frontendTS/build/frontendGen/build/appdomain")

  def loginGui = file("$buildDir/frontendGen/login_module_gui")
  def loginGuiTarget = file("../../../modules/login/frontendTS/build/frontendGen/build/appgui")

  def loginHWC = file("$buildDir/frontendGen/login_hwc")
  def loginHWCTarget = file("../../../modules/login/frontendTS/login")

  getSymlinkMap().put(loginDomain, loginDomainTarget)
  getSymlinkMap().put(loginGui, loginGuiTarget)
  getSymlinkMap().put(loginHWC, loginHWCTarget)

  def frontend2Out = file("$buildDir/frontendGen/fe2")
  def frontend2OutTarget = file("$buildDir/umlp/fe2")
  getSymlinkMap().put(frontend2Out, frontend2OutTarget)
}

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.named('testApp') {
  dependsOn {
    project(':modules:login:frontendTS').tasks.named('generate').get()
  }
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

tasks.named('runApp') {
  dependsOn {
    project(':modules:login:frontendTS').tasks.named('generate').get()
  }
}
