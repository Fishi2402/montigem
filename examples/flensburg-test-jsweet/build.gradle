task generateFlensburg_BE(type: UMLPTask) {
  input = file("src/models/hardy")
  hwcDir = file("src/main/java")
  symbolOutDir = file("$project.buildDir/umlp/symbols")
  outputDir = layout.buildDirectory.dir("umlp/be")
}

