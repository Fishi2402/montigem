sourceSets {
  main {
    java.srcDirs += [layout.buildDirectory.dir("umlp/be")]
    // TODO MB
    //java.srcDirs += [layout.buildDirectory.dir("umlp/fe1")]
    //java.srcDirs += [layout.buildDirectory.dir("umlp/fe2")]
    main.resources.srcDirs += generateFlensburg_BE.getOutputDir().dir("resources")  // Add generated resources (e.g. html & sql files) to JAR
  }
  test {
    java {
      exclude '**/gui/**'
    }
  }
}

project('client') {
  sourceSets.main.java.srcDirs = ['../src/main/java', generateFlensburg_BE.getOutputDir()]
}

