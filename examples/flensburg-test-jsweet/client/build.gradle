buildscript {
  repositories {
    mavenCentral()
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
  }
  dependencies {
    classpath('de.rwth.se.umlp.jsweet:jsweet-gradle-plugin:3.2.0-UMLP-SNAPSHOT') {
      transitive = true
    }
    classpath group: 'umlp', name: 'umlp-frontend-rte-java'
  }
}

plugins {
  id "de.rwth.se.umlp.jsweet.jsweet-gradle-plugin" version "3.2.0-UMLP-SNAPSHOT"
  id "com.github.node-gradle.node" version "5.0.0"
}

compileJava {
  enabled = false
}

jsweet {
  autoPropagateAsyncAwaits = true
  verbose = true
  encoding = 'UTF-8'
  sourceMap = true
  tsOnly = true
  tsOut = project.file('build/frontendGen/build/appdomain/')
  candiesJsOut = project.file('build/jsweet/candies')
  workingDir = project.file('build/jsweet')
  targetVersion = 'ES6'
  includes = ['**/hardy/**/*.java']
  excludes = [
      '**/flensburg/FlensburgManagerImpl.java',
      '**/flensburg/FlensburgMock.java',
      '**/flensburg/FlensburgMockTestSetup.java',
      '**/flensburg/FlensburgDummyProvider.java',
      '**/flensburg/FlensburgTestContext.java',
      '**/flensburg/test_infrastructure/**',
      '**/flensburg/FlensburgServerApplication.java',
      '**/flensburg/FlensburgShellAPIApplication.java',
      '**/flensburg/shellapi/**',
  ]
  module = 'commonjs'
  excludeTranspilation = [
    '**/flensburg/*DAO.java',
    '**/flensburg/*DbObserver.java',
    '**/flensburg/FlensburgManagerImpl.java',
    '**/flensburg/FlensburgMock.java',
    '**/flensburg/FlensburgMockTestSetup.java',
    '**/flensburg/FlensburgDummyProvider.java',
    '**/flensburg/FlensburgTestContext.java'
  ]
}

node {
  download = true
  version = "18.10.0"
  nodeProxySettings = ProxySettings.OFF
}

task generateNPMAuth(type: NPMAuthCreate){
  npmrcFile = project.file(".npmrc")
}
npmInstall.dependsOn(generateNPMAuth, ':umlp-rte:client:npmInstall')

//task installRTELocal(type: NpxTask) {
//  command = "install"
//  args ["..\\..\\..\\umlp-rte\\umlp-frontend-rte\\dist\\umlp-frontend-rte\\umlp-frontend-rte-7.5.0-SNAPSHOT.tgz"]
//}

task buildFlensburgApp(type: NpxTask) {
  command = "ng"
  args = ["build"]
  dependsOn(project.tasks.npmInstall)
  inputs.dir(project.fileTree("src").exclude("**/*.spec.ts"))
  inputs.dir(project.fileTree("build/frontendGen/build/appdomain/"))
  inputs.dir(project.fileTree("node_modules"))
  inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.app.json")
  outputs.dir("${project.buildDir}/webapp")
}

task runFlensburgApp(type: NpxTask) {
  command = "ng"
  args = ["serve"]
  dependsOn(project.tasks.npmInstall)
  inputs.dir(project.fileTree("src").exclude("**/*.spec.ts"))
  inputs.dir("node_modules")
  inputs.dir("build/frontendGen/build/appdomain/")
  inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.spec.json")
  outputs.upToDateWhen { true }
}

project.getTasksByName("jsweet", true).forEach {
  t ->
    runFlensburgApp.dependsOn(t)
}

compileJava {
  enabled = false
}

clean.dependsOn(jsweetClean)
