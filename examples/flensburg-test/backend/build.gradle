plugins {
  id 'java'
  id 'de.rwth.se.umlp-tool-backend'

  id 'application'
  id 'com.google.cloud.tools.jib' version '3.2.1'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
  id 'org.springframework.boot' version "${spring_version}"
}

repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url repo
  }
  mavenCentral()
}

configurations {
  guiDefaultTypes
}

dependencies {
  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  guiDefaultTypes "de.monticore.lang:guidsl:${project.properties['mc_version']}:default-types"
}

application {
  mainClass = 'app.FlensburgServerApplication'
}

dependencies {
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }

  implementation group: 'umlp', name: 'umlp-rte', version: mc_version, {
    exclude group: "org.slf4j", module: "slf4j-simple"
  }

  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
  implementation 'com.h2database:h2:2.1.214'

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.10"

  testImplementation group: 'org.neo4j', name: 'neo4j-jdbc-driver', version: '4.0.9'
  testImplementation "org.neo4j:neo4j:4.4.10"
  testImplementation "org.neo4j.driver:neo4j-java-driver:$neo4jVersion"
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2', withoutSpringLogging
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2', withoutSpringLogging

  implementation project(':umlp-rte')
}

generateUmlpBackend {
  input = file("../models/hardy/Flensburg.umlp")
  symbolOutDir = file("${project.buildDir}/symbols")
}

task runServer {
  dependsOn(bootRun)
}

task genTestGUI(type: UMLPGuiGenTask) {
  dependsOn(generateUmlpBackend)
  input = file("../models")
  outputDir = file("$project.buildDir/testgui")
  hwcDir = file("$projectDir/src/main/java")
  modelDir = layout.projectDirectory.dir("../models")
  symbolDir = files(
      generateUmlpBackend.symbolOutDir,
      project(":umlp-rte:client").tasks.createGuiSymbols.output,
      configurations.guiDefaultTypes.files
  )
  domainModels = ["hardy.Flensburg"]
  guiCreateModels = ["stanley.gui.AccountCreate"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}

sourceSets {
  main {
    java.srcDirs += [layout.buildDirectory.dir("testgui")]
    java.srcDirs += [layout.buildDirectory.dir("umlp/fe2")]
    //main.resources.srcDirs += generateUmlpBackend.getOutputDir().dir("resources")  // Add generated resources (e.g. html & sql files) to JAR
  }
  test {
    java {
      //exclude '**/gui/**'
    }
  }
}
compileJava.dependsOn(generateUmlpBackend, genTestGUI)
