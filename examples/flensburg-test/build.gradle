description 'cars example'

repositories {
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
}

task generateFlensburg(type: UMLPTask) {
    input.from(file("src"))
    outputDir = layout.buildDirectory.dir("generated-sources/monticore/sourcecode")
    hwcDir = layout.projectDirectory.dir("src/main/java/")
}

build.dependsOn(generateFlensburg)

project('client'){
    sourceSets.main.java.srcDirs = ['../src/main/java', "../target/generated-sources/monticore/sourcecode"]
}