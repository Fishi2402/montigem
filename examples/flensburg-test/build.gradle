description 'cars example'

repositories {
  maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
  maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
}


configurations {
  symbol
}

dependencies {
  symbol "umlp:frontend-rte:$mc_version"
}

task copyGUISymbols(type: Copy) {
  copy {
    from zipTree(configurations.symbol.asPath)
    into "$project.buildDir/umlp/symbols"
  }
}

// TODO AGe: don't know if that is needed
task generateCDTOGUI(type: UMLPTask) {
  input = file("src/models/hardy")
  cdToGui = true
  outputDir = layout.buildDirectory.dir("cd2gui")
}

task generateFlensburg_BE(type: UMLPTask) {
  input = file("src/models/hardy")
  hwcDir = file("src/main/java")
  symbolOutDir = file("$project.buildDir/umlp/symbols")
  outputDir = layout.buildDirectory.dir("umlp/be")
}

task generateFlensburg_FE1(type: UMLPGuiGenTask) {
  dependsOn(generateFlensburg_BE, copyGUISymbols)
  input = file("src/models/stanley")
  modelDir = file("src/models")
  symbolDir = layout.buildDirectory.dir("umlp/symbols")
  symbolOutDir = layout.buildDirectory.dir("umlp/fe1/symbols")
  outputDir = layout.buildDirectory.dir("umlp/fe1")
}

task generateFlensburg_FE2(type: UMLPGuiGenTask) {
  dependsOn(generateFlensburg_FE1, generateCDTOGUI)
  input = file(layout.buildDirectory.dir("cd2gui/models"))
  symbolDir = file("$projectDir/build/umlp/symbols")
  symbolOutDir = layout.buildDirectory.dir("umlp/fe2/symbols")
  outputDir = layout.buildDirectory.dir("umlp/fe2")
}

sourceSets {
  main {
    java.srcDirs += [layout.buildDirectory.dir("umlp/be")]
    // TODO MB
    //java.srcDirs += [layout.buildDirectory.dir("umlp/fe1")]
    //java.srcDirs += [layout.buildDirectory.dir("umlp/fe2")]
    main.resources.srcDirs += generateFlensburg_BE.getOutputDir().dir("resources")  // Add generated resources (e.g. html & sql files) to JAR
  }
  test {
    java {
      exclude '**/gui/**'
    }
  }
}

compileJava.dependsOn(generateFlensburg_BE, generateFlensburg_FE1, generateFlensburg_FE2)
