/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend-test"
}

dependencies {
  implementation(project(":examples:flensburg-test:backend"))
  testImplementation(project(":umlp-test-rte"))
}

sourceSets {
  main.java.srcDirs += [layout.buildDir.dir("umlp_frontend/intermediate/appgui")]
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}

genDomain {
  input = file("../models/hardy/Flensburg.umlp")
}

genGUI {
  domainModels = ["hardy.Flensburg"] // "LoginModule" is included via the modGen (or not required?)
  guiCreateModels = ["stanley.gui.AccountCreate"]
  hwcDir += [layout.projectDirectory.dir("src/main/java")]
}
tasks.compileJava.dependsOn(genGUI)

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

test {
  useJUnitPlatform()
}
