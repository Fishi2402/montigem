/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "de.rwth.se.montigem-frontend-test"
}

dependencies {
  implementation(project(":examples:flensburg-test:backend"))
  testImplementation(project(":umlp-test-rte"))
}

sourceSets {
  main.java.srcDirs += [layout.buildDir.dir("umlp_frontend/intermediate/appgui")]
}

node {
  nodeProjectDir = file("${buildDir}/app")
}

umlp2ts {
  input = file("../models/hardy/Flensburg.umlp")
}

gui2java {
  domainModels = ["hardy.Flensburg"] // "LoginModule" is included via the modGen (or not required?)
  guiCreateModels = ["stanley.gui.AccountCreate"]
  hwcDir += [layout.projectDirectory.dir("src/main/java")]
}
tasks.compileJava.dependsOn(gui2java)

nodeSetup.dependsOn(setupFrontend)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

test {
  useJUnitPlatform()
}

// TODO: We have now implicitly added assemble.dependsOn(buildApp)
tasks.named("buildApp") {
  enabled = false
}
