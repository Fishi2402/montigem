plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

dependencies {
  umlpModulesGen("umlp.modules:login:$version") // Load generator modifications
  umlpModulesDomainSymbols("umlp.modules.login:frontendTS:$version") // frontend domain symbols
  umlpModulesModels("umlp.modules:login:$version") // and models itself
}

// ALus local gradle is apparently unaware of these versions?
// Explicitly use the local login module
configurations.all {
  resolutionStrategy.dependencySubstitution {
    substitute module("umlp.modules:login") using project(":modules:login")
    substitute module("umlp.modules.login:frontendTS") using project(":modules:login:frontendTS")
  }
}

genGUI {
  domainModels = ["Guidslpaper"]
  guiCreateModels = ["gui.login.UserCreate", "gui.person.PersonCreate", "gui.konto.KontoCreate"]

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate  // Created from UMLP-Frontend Plugin.
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

tasks.register('run') {
  dependsOn(runApp)
}
