/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'de.rwth.se.umlp-tool-backend'
}
description 'it tests'

dependencies {
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
  testImplementation group: 'org.neo4j', name: 'neo4j-jdbc-driver', version: neo4j_jdbc_version
  testImplementation "org.neo4j:neo4j:4.4.10"
  testImplementation "org.neo4j.driver:neo4j-java-driver:$neo4jVersion"
}

generateUmlpBackend {
  hwcDir = [file("$projectDir/src/main/java"), file("$projectDir/src/test/java")]
}

test {
  testLogging.showStandardStreams = true
}
