import de.montigem.gradle.specific.UMLP2JavaTask

plugins {
  id 'de.rwth.se.montigem-backend'
}
description 'it tests'

dependencies {
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version

  testRuntimeOnly group: 'org.neo4j', name: 'neo4j-jdbc', version: neo4j_jdbc_version
  testImplementation group: "org.neo4j.test", name: "neo4j-harness", version: neo4j_embedded_test exclude module: "commons-text"

  testImplementation project(':umlp-test-rte')
}

tasks.named("umlp2java", UMLP2JavaTask) {
  input = file("./src/models")
  handWrittenCodeDir.from(
      file("$projectDir/src/main/java"),
      file("$projectDir/src/test/java")
  )
  useSpring = false
}
