import de.montigem.gradle.specific.UMLP2JavaTask
import de.montigem.gradle.specific.UMLP2TestInfrastructureTask

plugins {
  id 'de.rwth.se.montigem-backend'

  id 'com.google.cloud.tools.jib' version '3.4.4'
  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'org.springframework.boot' version "${spring_version}"
}

jib {
  container.mainClass = application.mainClass.get()
}

dependencies {
  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
  api 'com.h2database:h2:2.1.214' // API-Dependency, because it is used in frontend. TODO: Remove hardcoded h2!

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version
  api group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version // API-Dependency, because it is used in frontend.
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version

  // to compile the (playwright=true) AbstractJsweettestE2ETest
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version


  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

  implementation project(':umlp-rte')
  testImplementation project(':umlp-test-rte')
  implementation "org.eclipse.jgit:org.eclipse.jgit:5.2.2.201904231744-r"
}

tasks.named("generateTestInfrastructure", UMLP2TestInfrastructureTask) {
  usePlaywright.set(true)
}
