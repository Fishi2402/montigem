/* (c) https://github.com/MontiCore/monticore */
plugins {
  id 'java'
  id 'de.rwth.se.montigem-frontend'
  id 'jacoco'
}

jacoco{
  toolVersion = "0.8.12"
}

dependencies {
  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  // TODO: NO Security, as otherwise HTTP Auth is required
//  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  testImplementation project(':umlp-test-rte')

  // to compile the (playwright=true) AbstractJsweettestE2ETest
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }
  // TODO: compileOnly? => transpile fails - maybe only add it to the jsweet-compile config?
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
}

configurations {
  // json is a duplicate somehow
  testImplementation.exclude group: 'org.json', module: 'json'
  testRuntimeClasspath.exclude group: 'de.monticore.language-server', module: 'monticore-language-server-runtime'
}

tasks.named("umlpJava2ts") {
  verbose = true
}

tasks.named("guiJava2ts") {
  verbose = true
}

test {
  dependsOn tasks.named("npmInstall"), tasks.named("buildApp")
  // each test JVM starts its own backend and frontend server on free ports
  maxParallelForks = 2
  useJUnitPlatform() {
    excludeTags "SlowTest"
  }
}

tasks.register("slowtest", Test) {
  group = "verification"
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}

if(project.hasProperty('coverage')){
  def agentPath = configurations.detachedConfiguration(
      dependencies.create("org.jacoco:org.jacoco.agent:${jacoco.toolVersion}:runtime")
  ).singleFile.absolutePath
  def destFileUmlpJava2ts = "${layout.buildDirectory.get()}/jacoco/umlpJava2ts.exec"
  def destFileGui2java2ts = "${layout.buildDirectory.get()}/jacoco/gui2java2ts.exec"

  tasks.named('umlpJava2ts'){
    jacocoAgentArg.set("-javaagent:${agentPath}=destfile=${destFileUmlpJava2ts},append=true,includes=umlp.jsweet.extension.*")
  }

  tasks.named('gui2java2ts'){
    jacocoAgentArg.set("-javaagent:${agentPath}=destfile=${destFileGui2java2ts},append=true,includes=umlp.jsweet.extension.*")
  }

  tasks.register('jacocoUmlpJava2ts', JacocoReport){
    executionData.setFrom(file("$destFileUmlpJava2ts"))
    reports {
      xml.required = true
      xml.outputLocation = layout.buildDirectory.dir("reports/jacoco/umlpJava2ts")
    }

    classDirectories.setFrom(files(
        project(':umlp-jsweet').sourceSets.main.output.classesDirs
    ))

    sourceDirectories.setFrom(files(
        project(':umlp-jsweet').sourceSets.main.allSource.srcDirs
    ))
  }

  tasks.register('jacocoGui2java2ts', JacocoReport){
    executionData.setFrom(file("$destFileGui2java2ts"))
    reports {
      xml.required = true
      xml.outputLocation = layout.buildDirectory.dir("reports/jacoco/gui2java2ts")
    }

    classDirectories.setFrom(files(
        project(':umlp-jsweet').sourceSets.main.output.classesDirs
    ))

    sourceDirectories.setFrom(files(
        project(':umlp-jsweet').sourceSets.main.allSource.srcDirs
    ))
  }

  tasks.register('jacocoAggregated', JacocoReport){
    executionData.setFrom(files(
        "$destFileUmlpJava2ts",
        "$destFileGui2java2ts"))
    reports {
      xml.required = true
      html.required = true
    }

    classDirectories.setFrom(files(
        project(':umlp-jsweet').sourceSets.main.output.classesDirs
    ))

    sourceDirectories.setFrom(files(
        project(':umlp-jsweet').sourceSets.main.allSource.srcDirs
    ))
  }
}
