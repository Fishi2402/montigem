/* (c) https://github.com/MontiCore/monticore */
plugins {
  id 'java'
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}

dependencies {
  implementation project(":examples:jsweet-test:backend")
  // a configuration containing the domain sources
  // causes configuration errors?
  //  domainSources project(":examples:jsweet-test:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  // TODO: NO Security, as otherwise HTTP Auth is required
//  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  testImplementation project(':umlp-test-rte')

  // to compile the (playwright=true) AbstractJsweettestE2ETest
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }
  // TODO: compileOnly? => transpile failes - maybe only add it to the jsweet-compile config?
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging

}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

genGUI {
  domainModels = ["Jsweettest"]
}

translateJava2TSDomain {
  verbose = true
}

translateJava2TSGUI {
  verbose = true
}

genJava2TSConfig {
  domainModel = 'Jsweettest'
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

test {
  dependsOn buildApp
  useJUnitPlatform(){
    excludeTags "SlowTest"
  }
}

tasks.register("slowtest", Test) {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}

