plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

genGUI {
  domainModels = ["KitchenCompanion"]
  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate", "gui.project.ProjectsCreateByGroup"]

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

tasks.register('run') {
  dependsOn(runApp)
}
