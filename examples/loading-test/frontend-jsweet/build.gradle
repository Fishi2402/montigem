import java.nio.file.Files
import java.nio.file.Paths

/* (c) https://github.com/MontiCore/monticore */


plugins {
  id 'java'
  id 'de.rwth.se.montigem-frontend'
}

dependencies {
  implementation project(":examples:loading-test:backend")
  // a configuration containing the domain sources
  jsweetExtraSourcesConfig project(":examples:loading-test:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  //  spring-boot-starter-security breaks the frontend tests!
  //  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
  testImplementation project(':umlp-test-rte')
}

node {
  nodeProjectDir = file("${buildDir}/app")
}
nodeSetup.dependsOn(setupFrontend)

gui2java {
  domainModels = ["LoadingTests"]
  guiCreateModels = [
      "test_update_of_builder.AnimalCreate",
      "test_update_after_build.one_page.PersonsAndBuilderInOnePage",
      "test_update_after_build.composed_in_builder_page.PersonsInBuilderPage",
      "test_update_after_build.PersonBuilder",
      "test_no_error.BuilderAndRouterNavigation"]
}

umlpJava2ts {
  verbose = false
}

guiJava2ts {
  verbose = false
}

nodeSetup.dependsOn(setupFrontend)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')



tasks.named('buildApp', NpxTask) {
  dependsOn(
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") },
  )
}

tasks.named('testApp', NpxTask) {
  dependsOn(
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("copy_") },
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") }
  )
}


test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
}

test {
  dependsOn npmInstall, buildApp
  useJUnitPlatform(){
    excludeTags "SlowTest"
  }
  environment.put("WITH_JSWEET", "TRUE")
  outputs.upToDateWhen { false } // For some reason gradle does not detect changes to (some?) files, such as the app.component.ts
  // (because we never specify them as inputs)
}

tasks.register("slowtest", Test) {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}



// End 2 end testing using the build website + backend
tasks.register('installPlaywright', NpxTask){
  dependsOn(npmInstall)
  command = "playwright"
  args = ["install"]
}

// Load the same tests as the non-jsweet example
sourceSets.test.java.srcDir("../frontend/src/test/java")
