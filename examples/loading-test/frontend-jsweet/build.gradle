import java.nio.file.Files
import java.nio.file.Paths

/* (c) https://github.com/MontiCore/monticore */


plugins {
  id 'java'
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}

dependencies {
  implementation project(":examples:loading-test:backend")
  // a configuration containing the domain sources
  domainSources project(":examples:loading-test:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  //  spring-boot-starter-security breaks the frontend tests!
  //  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
  testImplementation project(':umlp-test-rte')
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

genGUI {
  domainModels = ["LoadingTests"]
  guiCreateModels = [
      "test_update_of_builder.AnimalCreate",
      "test_update_after_build.one_page.PersonsAndBuilderInOnePage",
      "test_update_after_build.composed_in_builder_page.PersonsInBuilderPage",
      "test_update_after_build.PersonBuilder"]
}

translateJava2TSDomain {
  verbose = false
}

translateJava2TSGUI {
  verbose = false
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

tasks.register('linkStuff', NodeTask) {
  dependsOn(prebuildTasks)

  def hwcsrc = file("$buildDir/frontendGen/hwcsrc")
  def hwcsrcTarget = file("src/app")

  def frontendOutBuild = file("$buildDir/build").mkdirs();

  def frontendOut = file("$buildDir/build/umlp_frontend")
  def frontendOutTarget = file("$buildDir/umlp_frontend")

  def umlpDir = file("$buildDir/frontendGen/libs/@umlp")
  println "Created @umlp dir: "+ umlpDir.mkdirs();

  def clientRTELinks = [:]
  project(":umlp-rte:client").ext.libs.forEach {
    def f = file(project(":umlp-rte:client").projectDir.toString()+"/projects/"+it)
    // Link, Target
    clientRTELinks.put(umlpDir.toPath().resolve(f.name).toFile(),f.toPath().toAbsolutePath().toFile())
  }

  outputs.upToDateWhen {
    Files.isSymbolicLink(hwcsrc.toPath()) && Files.isSymbolicLink(frontendOut.toPath()) &&
        clientRTELinks.keySet().every {
          Files.isSymbolicLink(Paths.get(it.toString()))
        }
  }

  def allLinks =  [hwcsrc.toString(), hwcsrcTarget.toString(),
                   frontendOut.toString(), frontendOutTarget.toString(),
  ]
  clientRTELinks.keySet().forEach {
    allLinks.add(it.toString())
    allLinks.add(clientRTELinks.get(it).toString())
  }

  script = file("$buildDir/frontendGen/symlink-creation.js")
  args = allLinks
}

tasks.register('buildApp', NpxTask) {
  dependsOn(
      prebuildTasks,
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") },
      tasks.named('linkStuff').get()
  )
  dependsOn {
    tasks.named('linkStuff').get()
  }
  command = "ng"
  args = ["build"]
}

tasks.register('testApp', NpxTask) {
  dependsOn(
      prebuildTasks,
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("copy_") },
      project(":umlp-rte:client").tasks.matching { it.name.startsWith("build_") },
      tasks.named('linkStuff').get()
  )
  dependsOn {
    tasks.named('linkStuff').get()
  }
  command = "ng"
  args = ["test"]

  // TODO: Ensure the tests do not fail
  ignoreExitValue = true
}
assemble.dependsOn(buildApp)

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks, tasks.named('linkStuff').get())
  command = "ng"
  args = ["serve"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
}

test {
  dependsOn npmInstall, buildApp
  useJUnitPlatform(){
    excludeTags "SlowTest"
  }
  // TODO: Ensure the tests do not fail
  ignoreFailures = true
  outputs.upToDateWhen { false } // For some reason gradle does not detect changes to (some?) files, such as the app.component.ts
}

tasks.register("slowtest", Test) {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform {
    includeTags "SlowTest"
  }
  shouldRunAfter test
  dependsOn npmInstall
}



// End 2 end testing using the build website + backend
tasks.register('installPlaywright', NpxTask){
  dependsOn(npmInstall)
  command = "playwright"
  args = ["install"]
}

// Load the same tests as the non-jsweet example
sourceSets.test.java.srcDir("../frontend/src/test/java")
