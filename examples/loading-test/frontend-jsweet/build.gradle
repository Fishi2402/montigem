plugins {
  id 'java'
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool-frontend'
}

dependencies {
  implementation project(":examples:loading-test:backend")
  // a configuration containing the domain sources
  domainSources project(":examples:loading-test:backend")

  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-security', version: spring_version

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'

  testImplementation "de.monticore.lang:guidsl:${project.properties['mc_version']}"
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'
  testImplementation project(':umlp-test-rte')
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

genGUI {
  domainModels = ["LoadingTests"]
  guiCreateModels = [
      "test_update_of_builder.AnimalCreate",
      "test_update_after_build.one_page.PersonsAndBuilderInOnePage",
      "test_update_after_build.composed_in_builder_page.PersonsInBuilderPage",
      "test_update_after_build.PersonBuilder"]
}

translateJava2TSDomain {
  verbose = false
}

translateJava2TSGUI {
  verbose = false
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}


// End 2 end testing using the build website + backend
tasks.register('installPlaywright', NpxTask){
  dependsOn(npmInstall)
  command = "playwright"
  args = ["install"]
}

