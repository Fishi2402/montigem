description 'mediahub example'

task generateMediaHub(type: JavaExec) {
    group = 'umlp'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'umlp.UMLPTool'
    args '-i', 'src/MediaHub.umlp', '-o', 'target'
}

build.dependsOn(generateMediaHub)
