buildscript {
  dependencies {
    classpath('com.google.cloud.tools:jib-native-image-extension-gradle:0.1.0')
  }
}

plugins {
  id 'de.rwth.se.umlp-tool-backend'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
  id 'org.springframework.boot' version "${spring_version}"
  id 'application'

  // native image, see settings.gradle pluginManagement
  id 'org.springframework.experimental.aot' version '0.12.2'
  id 'com.google.cloud.tools.jib' version '3.4.4'
}

repositories {
  // native image
  maven { url "https://repo.spring.io/snapshot" }
  maven { url "https://repo.spring.io/milestone" }
}

def serverAppName = 'nativeimagedemo.NativeImageDemoServerApplication'

generateUmlpBackend {
  useSpring.set(true)
  useShell.set(true)
}

dependencies {
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }

  implementation 'com.h2database:h2:2.1.214'

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.10"

  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2', withoutSpringLogging
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2', withoutSpringLogging

  testImplementation project(':umlp-test-rte')

  // native image
  // Exclude logback
  configurations {
    all*.exclude module: 'spring-boot-starter-logging'
  }
}

bootRun {
  systemProperty "spring.shell.interactive.enabled", "false"
}

tasks.register('runShellApi', org.springframework.boot.gradle.tasks.run.BootRun) {
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'nativeimagedemo.NativeImageDemoShellAPIApplication'
  standardInput = System.in
}

springBoot {
  mainClass = serverAppName
}

// native image
springAot {
  mainClass =  serverAppName
}

def nativeImageBuildArgs = [
  "--initialize-at-build-time=org.slf4j.impl.SimpleLogger,org.slf4j.LoggerFactory,org.slf4j.simple.SimpleLogger,org.slf4j.impl.StaticLoggerBinder"
]

graalvmNative.binaries.main {
  buildArgs(nativeImageBuildArgs)
}

bootBuildImage {
  imageName = "registry.git.rwth-aachen.de/monticore/umlp/native_image_demo"
  builder = "paketobuildpacks/builder:tiny"
  environment = [
      "BP_NATIVE_IMAGE": "true",
      "BP_NATIVE_IMAGE_BUILD_ARGUMENTS": nativeImageBuildArgs.join(" ")
  ]
}

jib {
  container{
    mainClass = serverAppName
  }

  // Native image
  pluginExtensions {
    pluginExtension {
      implementation = 'com.google.cloud.tools.jib.gradle.extension.nativeimage.JibNativeImageExtension'
      properties = [
          imageName: 'native-image'
      ]
    }
  }
}
tasks.jib.dependsOn tasks.nativeBuild
