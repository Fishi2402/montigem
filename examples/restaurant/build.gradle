description 'restaurant example'

task generateRestaurantOrg(type: JavaExec) {
    group = 'umlp'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'umlp.UMLPTool'
    args '-i', 'src/RestaurantOrg.umlp', '-o', 'target'
}

build.dependsOn(generateRestaurantOrg)
