description 'restaurant example'

task generateRestaurantOrg(type: UMLPTask) {
    input = (file("src/models"))
    outputDir = layout.buildDirectory.dir("generated-sources/monticore/sourcecode")
    hwcDir = layout.projectDirectory.dir("src/main/java/")
}

build.dependsOn(generateRestaurantOrg)

def path = buildDir.toPath().resolve("generated-sources").resolve("monticore").resolve("sourcecode").resolve("resources").toString()
sourceSets.main.resources.srcDirs += path
