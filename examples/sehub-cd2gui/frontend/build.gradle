import java.nio.file.Paths


plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id 'de.rwth.se.umlp-tool'
}

def useCD2GUI = true

configurations {
  guiDefaultTypes
}

dependencies {
  guiDefaultTypes "de.monticore.lang:guidsl:${project.properties['mc_version']}:default-types"
}

tasks.register('generateNPMAuth', NPMAuthCreate){
  npmrcFile = file("config/.npmrc")
}

// Add Frontend-Config Files from UMLP-Tool Resources.
tasks.register('frontendSetup', FrontendSetup){
  input = file("config/")   // Can be used to add or replace files
  dependsOn(generateNPMAuth)
  output = layout.buildDir.dir("frontendGen/")
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

tasks.register('generateCDTOGUI', UMLPCdToGuiTask) {
  enabled(useCD2GUI)
  setGroup('build')
  input = file("../models/Sehub.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

tasks.register('guiVariability', GuiVariabilityHandlerTask) {
  if(useCD2GUI) {
    input.from(generateCDTOGUI.getOutputDir())
  }
  input.from(file("../models/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

tasks.register('genDomain', UMLPFrontendTask) {
  dependsOn(frontendSetup)
  input = file("../models/Sehub.umlp")
  outputDir = frontendSetup.getOutput().dir("build/appdomain")
  hwcDir = file("src/app/")
}

tasks.register('genDomainSymbols', UMLPSymbolsTask) {
  dependsOn(frontendSetup)
  input = layout.projectDirectory.dir("../models")
  symbolOutDir = file("${project.buildDir}/symbols")
  outputDir = file("${project.buildDir}/symbols")
}

tasks.register('genGUI', UMLPGuiGenTask) {
  dependsOn(genDomain, guiVariability, genDomainSymbols)
  input = file(guiVariability.getOutputDir().dir("gui"))
  outputDir = frontendSetup.getOutput().dir("build/appgui")
  hwcDir = file("src/app/")
  modelDir = layout.projectDirectory.dir("../models")
  symbolDir = files(
      genDomainSymbols.symbolOutDir,
      configurations.guiLib,
      configurations.guiDefaultTypes
  )
  domainModels = ["Sehub"]
  guiCreateModels = ["gui.login.UserCreate", "gui.issues.IssueCreate"]
}

tasks.register('genGUI2', UMLPGuiGenTask) {
  enabled(useCD2GUI)
  setGroup('build')
  dependsOn(genGUI, guiVariability, generateCDTOGUI)
  input = file(guiVariability.getOutputDir())
  symbolDir = files(
      generateCDTOGUI.getOutputDir().file("symbols"),
      configurations.guiLib,
      configurations.guiDefaultTypes
  )
  hwcDir = file("src/app/")
  symbolOutDir = layout.buildDirectory.dir("umlp/fe2/symbols")
  outputDir = layout.buildDirectory.dir("umlp/fe2")
  modelDir = file(guiVariability.getOutputDir())
  domainModels = ["Sehub"]
  // Note: on windows its Sehub, ob *nix its sehub (lowercase)
  guiCreateModelsAsFile = file(generateCDTOGUI.getOutputDir().file("meta/sehub/guiCreateTextModels"))
}

npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, genGUI2
]

tasks.register('linkStuff', NodeTask) {
  dependsOn(prebuildTasks, ':umlp-rte:client:buildAll')

  def hwcsrc = file("$buildDir/frontendGen/hwcsrc")
  def hwcsrcTarget = file("src/app")

  def frontendOutBuild = file("$buildDir/build").mkdirs();

  def frontendOut = file("$buildDir/frontendGen/fe2")
  def frontendOutTarget = file("$buildDir/umlp/fe2")

  def frontendGenLink = file("$buildDir/build/frontendGen")
  def frontendGenLinkTarget = file("$buildDir/frontendGen")

  outputs.upToDateWhen {
    isJunction(hwcsrc) &&
    isJunction(frontendOut) &&
    isJunction(frontendGenLink)
  }

  script = file("$buildDir/frontendGen/symlink-creation.js")
  args = [hwcsrc.toString(), hwcsrcTarget.toString(),
          frontendOut.toString(), frontendOutTarget.toString(),
          frontendGenLink.toString(), frontendGenLinkTarget.toString(),
  ]
}

// Utility method to detect junction/symlink
static boolean isJunction(File file) {
  return java.nio.file.Files.isSymbolicLink(file.toPath())
}

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  dependsOn {
    tasks.named('linkStuff').get()
  }
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  dependsOn {
    tasks.named('linkStuff').get()
  }
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  dependsOn {
    tasks.named('linkStuff').get()
  }
  command = "ng"
  args = ["serve"]
}
