<nav class="navMenu">
  <ng-container *ngIf="isSignedIn()">
    <a class="startNav" [routerLink]="'/gui/Start'"><img src = "assets/images/Eule.png" alt="SEHub" height="40px"/></a>
    <ng-container *ngFor="let item of items">
      <a [routerLink]="item.url">{{item.title}}</a>
    </ng-container>
    <div class="dot"></div>
    <div class="spacer"></div>
    <ng-container><div class="user">{{getCurrentUser()?.getUsername()}}</div></ng-container>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <a class="material-symbols-outlined" [routerLink]="'/login/LoginPage'" (click)="signOutCurrentUser()">
      logout
    </a>
  </ng-container>
</nav>
