plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

def useCD2GUI = true

dependencies {
  implementation project(":examples:sehub:backend")
  domainSources project(":examples:sehub:backend")
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

tasks.register('generateCDTOGUI', UMLPCdToGuiTask) {
  enabled(useCD2GUI)
  setGroup('build')
  input = file("../models/Sehub.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

tasks.register('guiVariability', GuiVariabilityHandlerTask) {
  if(useCD2GUI) {
    input.from(generateCDTOGUI.getOutputDir())
  }
  input.from(file("../models/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

createDomainSymbols {
  enabled = false // instead, we use the CD2Gui Symbols
}


genGUI {
  dependsOn(guiVariability)
  domainModels = ["Sehub"]
  guiCreateModels = ["gui.login.UserCreate", "gui.issues.IssueCreate"]
  guiCreateModelsAsFile = file(generateCDTOGUI.getOutputDir().file("meta/sehub/guiCreateTextModels"))
  // Use cd2gui symbols instead of cd2gui/symbols
  symbolDir += generateCDTOGUI.getOutputDir().file("symbols")
  symbolDir += file("$buildDir/tags")
  // and exclude the genDomain symbols (without gemId)
  //var toExclude = tasks.genDomain.getSymbolOutDir().get().asFile
  //symbolDir.setFrom symbolDir.filter(f -> f != toExclude)
  modelDir = file(tasks.guiVariability.getOutputDir())
}

npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, tasks.named("generate")
]

translateJava2TSDomain {
  excludeSource.addAll([
      "glob:**/dummy/*",
      "glob:**/security/*"
  ])
  verbose = true
}

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}
