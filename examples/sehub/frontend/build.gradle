import de.montigem.gradle.specific.CD2GUITask

/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "de.rwth.se.montigem-frontend"
}

def useCD2GUI = true

dependencies {
  implementation project(":examples:sehub:backend")
  srcUMLPConfig project(":examples:sehub:backend")
}

def cd2gui = tasks.register('cd2gui', CD2GUITask) {
  enabled(useCD2GUI)
  setGroup('build')
  input = file("../models/Sehub.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

tasks.register('guiVariability', GUIVariabilityTask) {
  if (useCD2GUI) {
    input.from(cd2gui.flatMap { it.getOutputDir() })
  }
  input.from(file("../models/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

umlp2sym {
  enabled = false // instead, we use the CD2Gui Symbols
}

gui2java2ts {
  dependsOn(guiVariability)
  guiCreateModels = ["gui.login.UserCreate", "gui.issues.IssueCreate"]
  guiCreateModelsAsFile = file(cd2gui.flatMap { it.getOutputDir().file("meta/sehub/guiCreateTextModels") })
  // Use cd2gui symbols instead of cd2gui/symbols
  symbolPath.from(cd2gui.flatMap { it.getOutputDir().("symbols") })
  symbolPath.from(file("$buildDir/tags"))
  modelDir = file(tasks.guiVariability.getOutputDir())
}

umlpJava2ts {
  excludeSource.addAll([
      "glob:**/dummy/*",
      "glob:**/security/*"
  ])
  verbose = true
}
