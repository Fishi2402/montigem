import de.montigem.gradle.specific.CD2GUITask
import de.montigem.gradle.specific.GUI2Java2TSTask
import de.montigem.gradle.specific.UMLP2SymTask
import de.montigem.gradle.specific.UMLPJava2TSTask

/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "de.rwth.se.montigem-frontend"
}

def useCD2GUI = true

def cd2gui = tasks.register('cd2gui', CD2GUITask) {
  enabled(useCD2GUI)
  setGroup('build')
  input = file("../models/Sehub.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

def guiVariability = tasks.register('guiVariability', GUIVariabilityTask) {
  if (useCD2GUI) {
    input.from(cd2gui.flatMap { it.getOutputDir() })
  }
  input.from(file("./src/main/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

tasks.named("umlp2sym", UMLP2SymTask) {
  enabled = false // instead, we use the CD2Gui Symbols
}

tasks.named("gui2java2ts", GUI2Java2TSTask) {
  dependsOn(guiVariability)
  guiCreateModels = ["gui.login.UserCreate", "gui.issues.IssueCreate"]
  guiCreateModelsAsFile = file(cd2gui.flatMap { it.getOutputDir().file("meta/sehub/guiCreateTextModels") })
  // Use cd2gui symbols instead of cd2gui/symbols
  symbolPath.from(cd2gui.flatMap { it.getOutputDir().dir("symbols") })
  symbolPath.from(file("$buildDir/tags"))
  modelDir = file(guiVariability.flatMap { it.getOutputDir() })
}

tasks.named("umlpJava2ts", UMLPJava2TSTask) {
  excludeSource.addAll([
      "glob:**/dummy/*",
      "glob:**/security/*"
  ])
  verbose = true
}
