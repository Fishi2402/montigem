import de.montigem.gradle.specific.GUI2Java2TSTask
import de.montigem.gradle.specific.UMLP2SymTask
import de.montigem.gradle.specific.UMLPJava2TSTask

/* (c) https://github.com/MontiCore/monticore */
plugins {
  id "de.rwth.se.montigem-frontend"
}

montigem {
  withCD2GUI = true
}

tasks.named("umlp2sym", UMLP2SymTask) {
  enabled = false // instead, we use the CD2Gui Symbols
}

tasks.named("gui2java2ts", GUI2Java2TSTask) {
  guiCreateModels = ["gui.login.UserCreate", "gui.issues.IssueCreate"]
}

tasks.named("umlpJava2ts", UMLPJava2TSTask) {
  excludeSource.addAll([
      "glob:**/dummy/*",
      "glob:**/security/*"
  ])
  verbose = true
}
