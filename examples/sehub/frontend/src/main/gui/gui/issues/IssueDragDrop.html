<div
  cdkDropList
  [id]="dropId"
  [cdkDropListData]="issues"
  [cdkDropListConnectedTo]="canDropTo"
  class="drag-drop-list"
  (cdkDropListDropped)="onDrop($event)">
  <ng-container *ngFor="let issue of getIssuesForAngular__ChangeDetection()">
    <issue-entry cdkDrag [issue]="issue"></issue-entry>
  </ng-container>
</div>
