/**
 * Run UMLP generator and compile: 
 * - gradle :examples:selib:assemble
 *
 * Start UMLP backend server:
 * - gradle :examples:selib:bootRun
 * The command does not terminate. Stopping the command is also stopping
 * the server. There can only be a single running server. A second server 
 * cannot start. 
 * 
 * Connect to the server:
 * - open the url http://localhost:8081 in your browser of choice
 */
plugins {
  id 'java'
  id 'application'

  id 'io.spring.dependency-management' version '1.0.11.RELEASE'
  id 'org.springframework.boot' version "${spring_version}"

  // Makes the task-types `UMLPBackendTask` and `UMLPMergeTask` available
  id 'de.rwth.se.umlp-tool'
}

description 'SE Bib Example'


task mergeUMLPModels(type: UMLPMergeTask){
  // One way to define input: List files manually
  source = files("src/models/AMergeTest.umlp", "src/models/SELib.umlp")

  /* // Other way to define input: add whole directory, and use regex to include/exclude files
    source = layout.projectDirectory.dir("src/models/")
    includes = ["**.umlp"]
    excludes = ["buggyFile.umlp", "**.gui"]
   */

  // Where should the merged result be stored?
  outputFile = layout.buildDirectory.file("SELib.umlp")  // buildDirectory = "build/"
}

task generateJavaCode(type: UMLPBackendTask) {
  input = mergeUMLPModels.outputFile  // when the input is defined like this, gradle automatically runs the task "mergeUMLPModels" before this task

  // Other way to define inputs:
  // input = file("src/models/")  // All files in directory are used as input
  // input = files("src/models/AMergeTest.umlp", "src/models/SELib.umlp")  // Listed files are used as input

  hwcDir = file("src/main/java")

  // tmplDir = file("src/templates")    // location for user-defined templates
  configTemplate = "umlp/UMLPConfig4teaching.ftl"

  outputDir = layout.buildDirectory.dir("umlp_backend")
  useSpring.set(true)
  useShell.set(true)
}

sourceSets {
  main.java.srcDirs += generateJavaCode.getOutputDir()  // Add generated files to the input of java compiler
  main.resources.srcDirs += generateJavaCode.getOutputDir().dir("resources")  // Add generated resources (e.g. html & sql files) to JAR
}

dependencies {
  implementation project(':umlp-rte')
  implementation 'com.h2database:h2:2.1.214'  // In-Memory database written in java

  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version  // Required for Hot-Reload
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
}


application {
  // Set Entrypoint of Application
  mainClass = 'selib.SELibServerApplication'
}


task runShellApi(type: org.springframework.boot.gradle.tasks.run.BootRun) {
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'selib.SELibShellAPIApplication'
  standardInput = System.in
}

tasks.named("bootRun") {
  systemProperty "spring.shell.interactive.enabled", "false"
}
