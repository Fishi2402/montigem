import de.montigem.gradle.specific.UMLP2JavaTask

plugins {
  id 'de.rwth.se.montigem-backend'

  id 'com.google.cloud.tools.jib' version '3.4.4'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
  id 'org.springframework.boot' version "${spring_version}"
}

description 'StatServer'

bootBuildImage {
  imageName = "statserver"
}

jib {
  container.mainClass = application.mainClass.get()
  from.image = "$container_from_image"
  to.image = "${container_target_image_base}stat_backend:latest"
}

dependencies {
  implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version

  // Spring Boot Dependencies
  def withoutSpringLogging = {
      exclude module: 'spring-boot-starter-logging'
      exclude module: 'logback-classic'
  }
  developmentOnly("org.springframework.boot:spring-boot-devtools:$spring_version")
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
  implementation "com.h2database:h2:${h2_database}"

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.10"
  implementation group: 'org.neo4j.driver', name: 'neo4j-java-driver', version: "$neo4j_java_driver_version"
  testRuntimeOnly "org.neo4j.test:neo4j-harness:$neo4j_embedded_test" exclude module: "commons-text"

  testImplementation project(':umlp-test-rte')
}

String diff_location = "diff_store"
tasks.register('copyGeneratedFiles', Sync) {
  group = "diff"
  from umlp2java.getOutputDir()
  into layout.buildDirectory.dir(diff_location)
}

def umlp2java = tasks.named("umlp2java", UMLP2JavaTask) {
  input = file("./src/models")
  useSpring = false
  genNeo4j = true
  useNeo4j = true
}


tasks.register('diff', Exec) {
  group = "diff"
  dependsOn(umlp2java)
  commandLine 'cmd', '/c', 'git', 'diff', '--no-index', layout.buildDirectory.dir(diff_location).get().getAsFile().toPath(), umlp2java.get().getOutputDir().get().getAsFile().toPath()
  ignoreExitValue true
}
