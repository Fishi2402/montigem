description 'university example'

task generateUniversity(type: JavaExec) {
    group = 'umlp'
    classpath = sourceSets.main.runtimeClasspath
    mainClass = 'umlp.UMLPTool'
    args '-i', 'src/University.umlp', '-o', 'target'
}

build.dependsOn(generateUniversity)
