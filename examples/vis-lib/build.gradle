plugins {
  id 'java'
}

group 'org.example'
version '7.8.0-SNAPSHOT'

repositories {
  mavenCentral()
}

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
}

test {
  useJUnitPlatform()
}

task run {
  dependsOn ":examples:vis-lib:frontend:run", ':examples:vis-lib:backend:run'
}

