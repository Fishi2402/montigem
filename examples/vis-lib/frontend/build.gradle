plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

dependencies {
  implementation project(":examples:dtcockpit-jsweet:backend")
  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version

  testImplementation project(":examples:vis-lib:backend")
  testImplementation 'com.microsoft.playwright:playwright:1.44.0'
}

node {
  download = true
  version = "${node_version}"
  nodeProxySettings = ProxySettings.OFF
  nodeProjectDir = file("${buildDir}/frontendGen")
}

genGUI {
  domainModels = ["Domain"]
  guiCreateModels = ["person.CreatePerson", "person.CreatePersonWithFriends","person.CreateClubWithMembers"]

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

//translateJava2TSDomain {
//  verbose = true
//}
//
//translateJava2TSGUI {
//  verbose = true
//}
//
//genJava2TSConfig {
//  domainModel = 'Domain'
//}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate
]

task testApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

task buildApp(type: NpxTask) {
  dependsOn(testApp)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

task runApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

task run {
  dependsOn(runApp)
}

test {
  dependsOn buildApp
  useJUnitPlatform()
}
