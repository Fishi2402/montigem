plugins {
//  TODO Revert id 'java'
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

dependencies {
  implementation project(":examples:vis-lib:backend")
  implementation group: "de.monticore.lang", name: 'guidsl', version: mc_version
}

node {
  download = true
  version = "${node_version}"
  nodeProxySettings = ProxySettings.OFF
  nodeProjectDir = file("${buildDir}/frontendGen")
}

genGUI {
  domainModels = ["Domain"]
  guiCreateModels = ["person.Create"]
}

translateJava2TSDomain {
  domainModel = 'Domain'
  verbose = true
}

translateJava2TSGUI {
  domainModel = 'Domain'
  additionalIncludes = [
      '**/example_arrange/**/*.java',
      '**/example_basic/**/*.java',
      '**/example_charts/**/*.java',
      '**/example_input/**/*.java',
      '**/example_network/**/*.java',
      '**/example_table/**/*.java',
      '**/person/**/*.java'
  ]
  verbose = true
}

nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate
]

task testApp(type: NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

task buildApp(type: NpxTask) {
  dependsOn(testApp)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

task runApp(type: NpxTask) {
//  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

task run {
  dependsOn(runApp)
}
