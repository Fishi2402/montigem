<div
    *ngIf="input"
    style="display: flex; flex-direction: column; width: 100%; height: 100%;"
>
  <div style="display: flex; flex-direction: row; width: 100%; height: 100%;"
  >
    <div
        style="width: 50%; height: 75%; margin: 10px; border: 1px solid black;"
    >
      <ng-container *ngTemplateOutlet="input"></ng-container>
    </div>
    <div
        style="width: 50vw; height: 25vh; margin: 10px; border: 1px solid black;"
    >
      <ng-container *ngTemplateOutlet="input"></ng-container>
    </div>
    <div
        style="width: 500px; height: 300px; margin: 10px; border: 1px solid black;"
    >
      <ng-container *ngTemplateOutlet="input"></ng-container>
    </div>
    <div
        style="min-width: 200px; min-height: 100px; max-height: 600px; margin: 10px; border: 1px solid black;"
    >
      <ng-container *ngTemplateOutlet="input"></ng-container>
    </div>
  </div>
  <div
