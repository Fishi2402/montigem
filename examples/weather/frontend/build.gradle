task genDomain(type: UMLPFrontendTask) {
  dependsOn(frontendSetup)
  input = file("../models/Weather.umlp")
  outputDir = frontendSetup.getOutput().dir("build/appdomain")
  symbolOutDir = file("${project.buildDir}/symbols")
  hwcDir = file("src/app/")
}

task genGUI(type: UMLPGuiGenTask) {
  dependsOn(genDomain)
  input = file("../models")
  outputDir = frontendSetup.getOutput().dir("build/appgui")
  hwcDir = file("src/app/")
  modelDir = layout.projectDirectory.dir("../models")
  symbolDir = files(
      genDomain.symbolOutDir,
      project(":umlp-rte:client").tasks.createGuiSymbols.output,
      configurations.guiDefaultTypes.files
  )
  domainModels = ["Weather"]
  guiCreateModels = ["gui.ForecastCreate"]

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

