<svg [attr.width]="width" [attr.height]="height">
  <defs>
    <linearGradient
      [attr.id]="uuid + '-color-gradient'"
      x1="0%"
      y1="0%"
      x2="100%"
      y2="0%"
    >
      <stop offset="0%" [style.stop-color]="minColor" style="stop-opacity:1" />
      <stop offset="50%" [style.stop-color]="middleColor" style="stop-opacity:1" />
      <stop offset="100%" [style.stop-color]="maxColor" style="stop-opacity:1" />
    </linearGradient>
    <mask [attr.id]="uuid + '-range-mask'">
       <rect
        [attr.x]="(startPercentage)+ '%'"
        [attr.width]="((endPercentage - startPercentage)) + '%'"
        height="100%"
        rx="5"
        fill="white"
      />
    </mask>
  </defs>
  <!-- background -->
  <rect width="100%" height="100%" rx="5" fill-opacity="1" [attr.fill]="backgroundColor"/>
  <!-- foreground with color gradient, clipped by mask -->
  <rect width="100%" height="100%" rx="5" fill-opacity="1" [attr.mask]="'url(#' + uuid + '-range-mask)'" [attr.fill]="'url(#' + uuid + '-color-gradient)'"/>
</svg>
