import org.gradle.process.internal.DefaultJavaExecSpec
import org.gradle.process.internal.ExecActionFactory
import org.gradle.process.internal.JavaExecAction
import org.gradle.work.ChangeType
import org.gradle.work.FileChange
import org.gradle.work.Incremental
import org.gradle.work.InputChanges

import javax.annotation.Nullable
import javax.inject.Inject

/* (c) https://github.com/MontiCore/monticore */

plugins {
    // id "monticore" // MontiCore Plugin
    id "jacoco"
}

subprojects {
//    apply plugin: 'monticore'
    apply plugin: 'jacoco'

    ext.grammarDir = 'src/main/grammars'
    ext.outDir = "$buildDir/generated-sources/monticore/sourcecode"

    dependencies {
        implementation "de.se_rwth.commons:se-commons-utilities:$mc_version"
        testImplementation group:'junit', name:'junit', version:junit_version
    }


    sourceSets {
        main.java.srcDirs += [ outDir ]
    }

/*    compileJava {
        dependsOn project.collect { it.tasks.withType(MCTask) }
    }*/

}

configure(subprojects)  {
    dependencies {
//        implementation "de.se_rwth.commons:se-commons-logging:$se_commons_version"
//        implementation "de.se_rwth.commons:se-commons-utilities:$se_commons_version"
//
//        implementation "de.monticore:monticore-runtime:$mc_version"
//        implementation "de.monticore:monticore-grammar:$mc_version"
        testImplementation group:'junit', name:'junit', version:junit_version
    }
}

clean.dependsOn(subprojects.collect{it.getTasksByName("clean", false)})

jar.enabled = false


task generateJava(type: UMLPTask) {
    group = "umlP"
    inputDir = file(projectDir.path + "/initial/")
    hwcDir = layout.projectDirectory.dir("initial/hwc/")

    outputDir = layout.buildDirectory.dir("test/dyamic/")
}
build.dependsOn(generateJava)
