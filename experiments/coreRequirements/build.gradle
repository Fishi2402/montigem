plugins {
  id 'application'
  id 'org.springframework.boot' version "$spring_version"
  id 'io.spring.dependency-management' version '1.0.11.RELEASE'
  id 'com.google.cloud.tools.jib' version '3.2.1'
}

application {
  mainClass = 'hardy.UMLPApplication'
}
bootBuildImage {
  imageName = "corerequirements"
}
jib {
  to {
    image 'yolanv/jib-demo:gradle'
  }
}


description = "Experiments: Core Requirements"

sourceSets {
    main.java.srcDirs += ["$projectDir/target/generated-sources/"]
}

compileJava {
    dependsOn project.collect { it.tasks.withType(UMLPTask) }
}

dependencies {
    implementation group: 'com.google.code.gson', name: 'gson', version: gson_version
    implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version
    implementation group: 'org.hibernate', name: 'hibernate-vibur', version: hibernate_version
    implementation group: 'com.h2database', name: 'h2', version: h2_database

    // Spring Boot Dependencies
    def withoutSpringLogging = {
        exclude module: 'spring-boot-starter-logging'
        exclude module: 'logback-classic'
    }
    compileOnly("org.springframework.boot:spring-boot-devtools")
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', withoutSpringLogging
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', withoutSpringLogging
//    implementation group: 'org.webjars', name: 'stomp-websocket'
    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', withoutSpringLogging
}

task runServer {
    dependsOn(bootRun)
}

task generateFlensburg(type: UMLPTask) {
  inputDir = file("models")
  outputDir = layout.buildDirectory.dir("gen")
}

test {
    testLogging {
        events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
    useJUnitPlatform()
}