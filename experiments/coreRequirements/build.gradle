/* (c) https://github.com/MontiCore/monticore */

plugins {
    id 'application'
    id 'com.google.cloud.tools.jib' version '3.2.1'
    id 'io.spring.dependency-management' version '1.0.11.RELEASE'
    id 'org.springframework.boot' version "${spring_version}"
}

configurations {
    symbol
}

application {
    mainClass = 'hardy.UMLPApplication'
}
bootBuildImage {
    imageName = "corerequirements"
}
jib {
    to {
        image 'yolanv/jib-demo:gradle'
    }
}


description = "Experiments: Core Requirements"

sourceSets {
    main.java.srcDirs += ["$projectDir/target/generated-sources/"]
}

compileJava {
    dependsOn project.collect { it.tasks.withType(UMLPTask) }
}

repositories {
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
}

dependencies {
    implementation group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version
    implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'

    // Spring Boot Dependencies
    def withoutSpringLogging = {
        exclude module: 'spring-boot-starter-logging'
        exclude module: 'logback-classic'
    }
    compileOnly("org.springframework.boot:spring-boot-devtools:$spring_version")
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
//    implementation group: 'org.webjars', name: 'stomp-websocket'
    // JSweet
    implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"


    testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
    testImplementation 'com.h2database:h2:2.1.214'

    symbol "de.monticore:frontend-rte:$mc_version"
}

task runServer {
    dependsOn(bootRun)
}

task generateCDTOGUI(type: UMLPTask) {
    input = file("models/hardy")
    cdToGui = true
    outputDir = layout.buildDirectory.dir("genumlp/cd2gui")
}

task generateFlensburg(type: UMLPTask) {
    dependsOn(generateCDTOGUI)
    input = (file("models/hardy"))
    outputDir = layout.buildDirectory.dir("genumlp/hardy")
}

task copySymbols(type: Copy) {
    copy {
        from zipTree(configurations.symbol.asPath)
        into "$projectDir/target/symbols"
    }
}

task generateAll(type: UMLPTask) {
    dependsOn(copySymbols)
    input = (file("models"))
    outputDir = layout.buildDirectory.dir("gen")
    hwcDir = layout.projectDirectory.dir("src/main/java")
    modelDir = layout.projectDirectory.dir("models")
    symbolDir = file("models")
    //symbolDir = file("$projectDir/target/symbols")
}

test {
    testLogging {
        events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
    useJUnitPlatform()
}

project('stanley'){
    sourceSets.main.java{
        srcDir '../src/main/java'
    }
}