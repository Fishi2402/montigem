buildscript {
  repositories {
    mavenCentral()
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
//    maven { url "https://repository.jsweet.org/artifactory/plugins-release-local" }
//    maven { url "https://repository.jsweet.org/artifactory/plugins-snapshot-local" }
    maven { url "https://google-diff-match-patch.googlecode.com/svn/trunk/maven" }
  }
  dependencies {
    classpath('de.rwth.se.umlp.jsweet:jsweet-gradle-plugin:3.2.0-SNAPSHOT') {
      transitive = true
    }
  }
}

plugins {
  id "com.github.node-gradle.node" version "3.4.0"
  id "de.rwth.se.umlp.jsweet.jsweet-gradle-plugin" version "3.2.0-SNAPSHOT"
}

jsweet {
  verbose = true
  encoding = 'UTF-8'
  sourceMap = true
  tsOnly = true
//  outDir = project.file('target/javascript')
  tsOut = project.file('target/generated-Sources')
  candiesJsOut = project.file('target/candies')
  targetVersion = 'ES6'
  includes = ['**/hardy/**/*.java']
  excludes = ['**/WebSocketConfig.java', '**/DBAccessRestService.java', '**/DBTestService.java',
              '**/GreetingService.java', '**/CommandWebSocketService.java',
              '**/UMLPApplication.java', '**/WebSocketCommandCommunication.java']
  // extraSystemPath = '/my/path/to/npm'
  includeTranspilation = ['**/CarBuilder.java']
}

compileJava {
  enabled = false
}

node {
  // Whether to download and install a specific Node.js version or not
  // If false, it will use the globally installed Node.js
  // If true, it will download node using above parameters
  // Note that npm is bundled with Node.js
  download = true

  // Version of node to download and install (only used if download is true)
  // It will be unpacked in the workDir
  version = "12.18.2"

  // Whether the plugin automatically should add the proxy configuration to npm and yarn commands
  // according the proxy configuration defined for Gradle
  // Disable this option if you want to configure the proxy for npm or yarn on your own
  // (in the .npmrc file for instance)
  // nodeProxySettings = ProxySettings.SMART
}

// Task to generate an empty Angular application.
// It was run once in the parent folder to instantiate initial project.
/*
task generateAngularApp(type: NpxTask) {
  command = '@angular/cli@12.2.0'
  args = ['new', 'stanley', '--style=scss']
}
/**/

task buildApp(type: NpxTask) {
  command = "ng"
  args = ["build", "--prod"]
  dependsOn(tasks.npmInstall)
  inputs.dir(project.fileTree("src").exclude("**/*.spec.ts"))
  inputs.dir("node_modules")
  inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.app.json")
  outputs.dir("${project.buildDir}/webapp")
}

task testApp(type: NpxTask) {
  command = "ng"
  args = ["test"]
  dependsOn(tasks.npmInstall)
  inputs.dir("src")
  inputs.dir("node_modules")
  inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.spec.json", "karma.conf.js")
  outputs.upToDateWhen { true }
}

task runApp(type: NpxTask) {
  command = "ng"
  args = ["serve"]
  dependsOn(tasks.npmInstall)
  inputs.dir(project.fileTree("src").exclude("**/*.spec.ts"))
  inputs.dir("node_modules")
  inputs.files("angular.json", ".browserslistrc", "tsconfig.json", "tsconfig.spec.json")
  outputs.upToDateWhen { true }
}

sourceSets {
  java {
    main {
      resources {
        // This makes the processResources task automatically depend on the buildApp one
        srcDir(buildApp)
      }
    }
  }
}

/*
