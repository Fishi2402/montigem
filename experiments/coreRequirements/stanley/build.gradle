task genTS(type: UMLPFrontendTask) {
  input = file("../models/hardy")
  outputDir = file("$project.buildDir/app/genTS")  // Output Dirs must be disjoint!
  hwcDir = file("$projectDir/src/app")

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

task serializeUMLP {
  doLast {
    def modelPathStr = "${project.projectDir}/../models"
    def modelPath = Paths.get(modelPathStr)
    fileTree(modelPathStr).matching {
      include "**/*.umlp"
    }.each {
      def path = it.path
      def relativeModelPathStr = modelPath.relativize(Paths.get(path)).toString()
      javaexec {
        mainClass = 'de.monticore.CD4CodeTool'
        classpath = configurations.cdTool
        args "-i", path,
            "-s", "${project.buildDir}/symbols/${relativeModelPathStr}sym"
      }
    }
  }
}

task copyGUISymbols(type: Copy) {
    from zipTree(configurations.symbol.asPath)
    into "$project.buildDir/symbols"
}

