######################################
## MontiGem Specific Configuration
######################################
# Can be used in VirtualHost

DocumentRoot "/var/www/html"

ProxyPreserveHost on
RequestHeader set REMOTE-USER %{REMOTE_USER}s

## Forwards
 <Directory "/var/www/html">
   RewriteEngine on
   # Don't rewrite files or directories
   RewriteCond %{REQUEST_FILENAME} -f [OR]
   RewriteCond %{REQUEST_FILENAME} -d
   RewriteRule ^ - [L]

   # Rewrite everything else to index.html
   # to allow html5 state links
   RewriteRule ^ index.html [L]
 </Directory>

 #######################################################
 # Proxy Requests to "montigem-be/" to the backend
 #######################################################
 ProxyRequests Off

 ProxyPass "/umlp/api/" "http://backend:8081/umlp/api/"
 ProxyPassReverse "/umlp/api/" "http://backend:8081/umlp/api/"

  RewriteEngine on
  RewriteCond %{HTTP:Upgrade} websocket [NC]
  RewriteCond %{HTTP:Connection} upgrade [NC]
  RewriteRule ^/umlp/api/(.*) "ws://backend:8081/umlp/api/$1" [P,L]

