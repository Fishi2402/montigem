<!--
  translation of properties is straightforward except GUIViewElement typed parameters
  "contents" is of type List<GUIViewElement> => generate templates and put them outside
  each template contains a component generated by the usual rules

  General mapping:
  in model, where foo is of type List<GUIViewElement>:
  @A( ... , foo = [ @B(...), bar@C(...) ])

  in code:
  <a ... [foo]="[gemNode1, bar]">
  <ng-template #gemNode1>
    <b ...></b>
  </ng-template>
  <ng-template #bar>
    <c ...></c>
  </ng-template>
-->
<gem-column [design]="'gem-card'" [height]="'100%'" [contents]="[comp2Tpl, comp4Tpl]">
</gem-column>

<!-- 
  gemNode2 in its turn contains other component => same rule, create ng-template and put
  it outside. GUI tree is flattened in the generated code
-->
<ng-template #comp2Tpl>
  <gem-row [design]="'gem-card-header'" [contents]="[comp3Tpl]">
  </gem-row>
</ng-template>

<ng-template #comp3Tpl>
  <gem-text [value]="'title'">
  </gem-text>
</ng-template>

<ng-template #comp4Tpl>
  <gem-column [design]="'gem-card-body'" [contents]="[content]">
  </gem-column>
</ng-template>
