<!-- HWC-P -->
<table class="gem-table">
  <thead>
    <tr>
      <ng-container *ngIf="canDelete">
        <th class="gem-th"></th>
      </ng-container>
      <ng-container *ngFor="let col of columns">
        <th class="gem-th">{{col.getColName()}}</th>
      </ng-container>
    </tr>
  </thead>
  <tbody>
    <ng-container *ngFor="let row of rows">
      <tr>
        <ng-container *ngIf="canDelete">
          <td class="gem-td">
            <button mat-icon-button class="gem-table-action-button" (click)="deleteRow.emit(row)">
              <i class="fa fa-trash gem-table-action-icon" aria-hidden="true"></i>
            </button>
          </td>
        </ng-container>
        <ng-container *ngFor="let col of columns">
          <td class="gem-td">{{row[col.getAttrName()]}}</td>
        </ng-container>
      </tr>
    </ng-container>
  </tbody>
</table>
