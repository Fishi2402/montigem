import de.montigem.gradle.specific.merge.MergeTask

plugins {
  id 'de.rwth.se.montigem-backend'

  id 'com.google.cloud.tools.jib' version '3.4.4'
  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'org.springframework.boot' version "${spring_version}"
}

dependencies {
  api project(':umlp-rte')
  api project(':umlp-test-rte')
  api 'com.h2database:h2:2.1.214'

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version
  api group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version
  api group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version
  api group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version
  api group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version

  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2'

  implementation(project(":experiments:dsl-ast-integration:dsl"))
}

tasks.named("mergeUMLP", MergeTask) {
  source(project(":experiments:dsl-ast-integration:dsl2cd").tasks.named("dsl2cd").map { it.getOutputs() })
  dependsOn(project(":experiments:dsl-ast-integration:dsl2cd").tasks.named("dsl2cd"))
}

project(":experiments:dsl-ast-integration:dsl2cd").afterEvaluate { p ->
  sourceSets.main.java.srcDir(
      p.tasks.named("dsl2cd").flatMap { it.getJavaOut() }
  )
}

tasks.withType(Tar) {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Zip) {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

