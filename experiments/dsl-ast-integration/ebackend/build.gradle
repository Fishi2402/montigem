task runServer {
   dependsOn(bootRun {
      systemProperty "spring.shell.interactive.enabled", "false"
   })
}

test {
   testLogging {
      events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
   }
   useJUnitPlatform()
}

sourceSets {
   main {
//      java.srcDirs += [genInitData.outputDir]
   }
   test {
      java {
         exclude '**/gui/**'
      }
   }
}



tasks.withType(Tar) {
   duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
tasks.withType(Zip) {
   duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

