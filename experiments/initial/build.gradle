buildscript {
    dependencies {
        classpath "umlp:umlp-tool:$mc_version"
    }
}

plugins {
    id 'java'
    id "maven"
    id "maven-publish"
    id 'se-groovy'
}

description = 'Experiments: Initial Experiment'

project(':experiments:initial') {
    repositories {
        maven {
            credentials.username mavenUser
            credentials.password mavenPassword
            url repo
        }
        mavenLocal()
        mavenCentral()
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
    }

//    compileJava {
//        dependsOn project.collect { it.tasks.withType(SEGroovyTask) }
//    }

    task runUMLP(type: SEGroovyTask) {
        script = "${projectDir}/src/main/resources/UMLPBasic.groovy"
        baseClass = 'umlp.generator.UMLPScript'
        outputDir = file "${buildDir}/generated-sources/"

        arguments = [
                out          : "${buildDir}/generated-sources/",
                testOut      : "${buildDir}/generated-test-sources/",
//            package      : "de/monticore/montigem/tagging",
//            modelPath    : "${projectDir}/src/main/resources",
                handcodedPath: "${project.sourceSets.main.java.srcDirs[0]}",
//            grammars     : "de.monticore.CD4Analysis",
                models       : "${project.sourceSets.main.resources.srcDirs[0]}/AllElements.umlp",
        ]
    }

    dependencies {
//        implementation group: 'umlp', name: 'umlp-tool', version: mc_version
        implementation project(':umlp-tool')
        implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
        implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
        implementation group: 'org.codehaus.groovy', name: 'groovy', version: groovy_version
        implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
//    implementation group: 'de.se_rwth.commons', name: 'se-commons-groovy', version: mc_version
    }
}
