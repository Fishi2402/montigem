import org.apache.commons.io.FileUtils

plugins {
  id 'application'
  id 'org.springframework.boot' version "$spring_version"
  id 'io.spring.dependency-management' version '1.0.11.RELEASE'
}

/* (c) https://github.com/MontiCore/monticore */
description = "Experiments: Initial Experiment"

sourceSets {
  main.java.srcDirs += ["$projectDir/target/generated-sources/",
                        "$projectDir/hwc/"]
}

dependencies {
  implementation project(':experiments:coreRequirements')
  implementation group: 'com.google.code.gson', name: 'gson', version: gson_version
  implementation group: 'org.hibernate', name: 'hibernate-vibur', version: hibernate_version
  implementation group: 'org.hibernate', name: 'hibernate-core', version: hibernate_version

}

bootJar.onlyIf { false }
compileJava.onlyIf { project.hasProperty('testCompile') }
  // UMLP-Tool currently doesn't generate valid java code, so the compilation is not enabled by default
  // You can stat gradle with "gradle assemble -PtestCompile" to test the compilation of the generated code.

task generateJava(type: UMLPTask) {
  group = "umlP"
  input = files("models/B.umlp", "models/A.umlp")

  tmplDir = layout.projectDirectory.dir("src/main/resources")
  hwcDir = layout.projectDirectory.dir("hwc/")
  configTemplate = "MyConfig.ftl"
  outputDir = layout.buildDirectory.dir("generated-sources/")
  outputs.cacheIf { false } // This task is used to TEST THE CACHE! So it shouldn't be cached
}

task testMerge(type: UMLPMergeTask){
  source = layout.projectDirectory.dir("models/")
  includes = ["**.umlp"]

  outputFile = layout.projectDirectory.file("target/Merge.umlp")
}
assemble.dependsOn(testMerge)

task copyInputDir(type: Copy) {
  dependsOn generateJava

  from generateJava.input
  into layout.buildDirectory.dir("repro_test/inputDir/")
}
task copyHWCDir(type: Copy) {
  dependsOn generateJava

  from generateJava.hwcDir
  into layout.buildDirectory.dir("repro_test/hwcDir/")
}


task generateJava_second_run(type: UMLPTask) {
  dependsOn copyInputDir
  dependsOn copyHWCDir

  input.from(copyInputDir.getDestinationDir())
  hwcDir = copyHWCDir.getDestinationDir()

  outputDir = layout.buildDirectory.dir("repro_test/output")
  outputs.cacheIf { false } // This task is used to TEST THE CACHE! So it shouldn't be cached
}

task checkEquality(type: CheckDirEquality){
  dir1 = generateJava.outputDir
  dir2 = generateJava_second_run.outputDir
}

build.dependsOn(checkEquality)





abstract class CheckDirEquality extends DefaultTask {
  @InputDirectory
  abstract DirectoryProperty getDir1()

  @InputDirectory
  abstract DirectoryProperty getDir2()

  @TaskAction
  def run() {
    java.io.File dir1 = getDir1().asFile.get();
    java.io.File dir2 = getDir2().asFile.get();
    for (File f1 : FileUtils.listFiles(dir1, null, true)) {
      if (f1.isFile()) {
        String relPath1 = dir1.toPath().relativize(f1.toPath()).toString();
        File f2 = java.nio.file.Paths.get(dir2.toString(), relPath1).toFile();
        if (!FileUtils.contentEquals(f1, f2)) {
          throw new java.lang.RuntimeException("Generated Files are not equal! Gradle Task cannot be cached! \n" +
              "\t " + f1.toPath() + "\n\t " + f2.toPath() + "\n" +
              "Often this is caused by iterating over a `HashSet` (or `HashMap`). Instead use `LinkedHashSet` / `TreeSet` (or `LinkedHashMap` / `TreeMap`)")
        }
      }
    }
  }
}