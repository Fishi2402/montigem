plugins {
  id "base"
  id "java"
  id 'maven-publish'
  id 'de.rwth.se.montigem-module' // create models-jar
}

dependencies {
  generatorExtensionCompile group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
  testImplementation project(':umlp-test-rte')
}

tasks.register('printStuff') {
  doLast {
    println("Files")
    sourceSets.generatorExtension.output.files.each {
      println(it)
    }

    println("JC name " + sourceSets.generatorExtension.compileJavaTaskName)

    configurations.each {
      println("Config name ${it.name}")
    }

    println(project.group)
    println(project.name)
  }
}

