plugins {
  id 'de.rwth.se.montigem-backend'
}

dependencies {
  implementation(project(":experiments:module-system:module-definition"))
  umlpModulesGen(project(path: ":experiments:module-system:module-definition", configuration: "moduleGenTime"))
}

tasks.register('printUmlpModules')(){
  doLast{
    println("Files in umlpModulesGen")
    configurations.umlpModulesGen.files.each {
      println(it)
    }
  }
}
