plugins {
  id 'de.rwth.se.montigem-backend'
}

dependencies {
  implementation(project(":experiments:module-system:module-definition"))
  montigemModuleGeneratorExtension(project(path: ":experiments:module-system:module-definition", configuration: "moduleGenTime"))
}

tasks.register('printmontigemModule')(){
  doLast{
    println("Files in montigemModuleGeneratorExtension")
    configurations.montigemModuleGeneratorExtension.files.each {
      println(it)
    }
  }
}
