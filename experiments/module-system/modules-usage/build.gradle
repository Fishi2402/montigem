plugins {
  id 'de.rwth.se.montigem-backend'
}

dependencies {
  implementation(project(":experiments:module-system:module-definition"))
  montigemModuleGenExt(project(path: ":experiments:module-system:module-definition", configuration: "moduleGenTime"))
}

tasks.register('printmontigemModule')(){
  doLast{
    println("Files in montigemModuleGenExt")
    configurations.montigemModuleGenExt.files.each {
      println(it)
    }
  }
}
