import de.monticore.cdgen.gradleplugin.CDGenTask
import de.montigem.gradle.specific.UMLP2JavaTask

plugins {
  id 'de.rwth.se.montigem-backend'
  id 'de.rwth.se.cdgen' version "$mc_version"

  id 'application'
  id 'maven-publish'
}

sourceSets {
  cd2pojo
}

application {
  mainClass = 'mydomain.MyDomainServerApplication'
}

def generateGem = tasks.register("generateGem", CDGenTask) {
  input.from(project.file("../models/MyDomain.umlp"))
  class2MC = true
  outputDir.set(project.layout.buildDirectory.dir("py_out_java"))
  configTemplate = 'cd2python.Gem2Py'
  tmplDir = file('src/cd2pojo/resources')
  getExtraClasspathElements().from(configurations.cdTool)
  getExtraClasspathElements().from(sourceSets.cd2pojo.output)
  // This task outputs python files with the .java extension
}

tasks.register("transformGemToPy", Sync) {
  // actually rename the generated file to .py
  from(generateGem)
  into(project.layout.buildDirectory.dir("py_out"))
  eachFile { file ->
    if (file.name.endsWith(".java")) {
      def newName = file.name.replaceAll(/\.java/, ".py")
      file.name = newName
    }
  }
}

dependencies {
  // the cd2pojo sourceset requires the same dependencies as cdTool
  configurations.cd2pojoImplementation.extendsFrom(configurations.cdTool)

  cdTool("de.monticore.lang.cd4analysis:cdgradle:$mc_version")
  cdTool("de.monticore.lang:cd4analysis:$mc_version")
}

// Test setup

dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
  testImplementation project(':umlp-test-rte')

  // Run python via graal (normally only a testImplementation, but the graalpy plugin requires them too)
  implementation("org.graalvm.polyglot:polyglot:24.2.0")
  implementation("org.graalvm.polyglot:python:24.2.0")
}


dependencies {
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }
  api group: 'umlp', name: 'umlp-rte', version: mc_version, withoutSpringLogging
  api group: 'umlp', name: 'umlp-test-rte', version: mc_version, withoutSpringLogging
  api 'com.h2database:h2:2.1.214'
  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
}

test {
  dependsOn(tasks.named("transformGemToPy"))
}

tasks.register("cd2pojoJar", Jar) {
  from sourceSets.cd2pojo.output
  archiveClassifier = 'cd2pojo'
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifact cd2pojoJar
    }
  }
}
