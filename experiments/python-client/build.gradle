// https://github.com/graalvm/polyglot-embedding-demo/blob/main/build.gradle.kts
var isGraalVM = Paths.get("${System.getProperty("java.home")}/lib/graalvm").toFile().exists()

// TODO: Find out how to fix the modules resolution problem
if (!isGraalVM && false ) {
  /*
   * Path used when running on a different JDK than GraalVM.
   * This profile may be removed if you are always running with a
   * GraalVM JDK or if you don't want to use the optimizing runtime.
   *
   * Note: Using this path unlocks experimental options and is therefore
   * not recommended for production use.
   */
  configurations {
    compilerClasspath {
      canBeResolved = true
    }
  }
  dependencies {
    compilerClasspath("org.graalvm.compiler:compiler:24.2.0")
  }
  test {
    getJvmArgumentProviders().add(new CommandLineArgumentProvider() {
      @Override
      Iterable<String> asArguments() {
        var compilerDependencies = configurations.getByName("compilerClasspath").filter { it.name.endsWith(".jar") }
        return ["-XX:+UnlockExperimentalVMOptions", "-XX:+EnableJVMCI", "--upgrade-module-path=${compilerDependencies.asPath}",
//                "--add-reads", "ALL-DEFAULT"
        ]

      }
    })
  }
}
