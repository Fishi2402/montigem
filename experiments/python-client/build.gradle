dependencies {
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
  testImplementation project(':umlp-test-rte')

  // Run python via graal
  testImplementation("org.graalvm.polyglot:polyglot:24.2.0")
  testImplementation("org.graalvm.polyglot:python:24.2.0")
}

test {
  useJUnitPlatform()
  jvmArgs += '-XX:+UnlockExperimentalVMOptions' // EnableJVMCI is an experimental option
  jvmArgs += '-XX:+EnableJVMCI' // improve Graal performance
//  dependsOn installPydantic
}

