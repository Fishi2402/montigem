[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[project]
name = "montigem_runtime"
version = "0.0.1"
authors = [
  { name="SE-RWTH Staff"},
]
description = "Runtime for a montigem client"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]
dependencies = [
  "pydantic>=2.11.1",
  "websockets>=15.0.1"
]

[project.urls]
Homepage = "https://git.rwth-aachen.de/monticore/umlp"

