plugins {
  id 'java'
  id 'de.rwth.se.montigem-backend'
}

group 'org.example'

repositories {
  mavenCentral()
}

configurations {
  scGenerator
}

umlp2java {
  input = file("./models/SCExample.umlp")
  handWrittenCodeDir.setFrom([file("$projectDir/src/main/java")])
  useSpring = false
}

def modelsDir = projectDir.toPath().resolve("models")
def scOutDir = buildDir.toPath().resolve("sc")

def genSc = tasks.register('genSc', JavaExec) {
  group = "umlp"
  classpath configurations.scGenerator
  mainClass = "de.monticore.umlstatecharts.UMLStatechartsTool"

  def ampel = modelsDir.resolve("AmpelSC.sc")

  args = [
      "-i", ampel.toAbsolutePath().toString(),
      "-gen", scOutDir.toAbsolutePath().toString()
  ]

  inputs.file(ampel)
  outputs.dir(scOutDir)
}

sourceSets.main.java {
  srcDirs += scOutDir.toString()
}

tasks.named("compileJava") {
  dependsOn(genSc)
}

dependencies {
  scGenerator("de.monticore.lang:statecharts:$mc_version:mc-tool") {
    transitive = false
  }


  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.8.1'
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.8.1'
  testImplementation project(':umlp-test-rte')
}

test {
  useJUnitPlatform()
}
