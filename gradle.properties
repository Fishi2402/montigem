mavenUser=${username}
mavenPassword=${password}
repo=https://nexus.se.rwth-aachen.de/content/groups/umlp

#set true or use \u2013PuseLocalRepo=true to use local maven repo
useLocalRepo=false
grammarDir=src/main/grammars
version=7.5.0-SNAPSHOT
mc_version=7.5.0-SNAPSHOT
logging_version=7.5.0-SNAPSHOT
shadow_plugin_version=4.0.4
junit_version=5.8.1
groovy_version=4.0.2
slf4j_version=1.7.10
guava_version=31.1-jre
gson_version=2.9.0
spring_version=2.7.3
hibernate_version=5.6.9.Final
h2_database=2.1.210
neo4jVersion=4.4.10

org.gradle.caching=true
