de.rwth.se.umlp.debug=false # Debug Mode allows Breakpoints in UMLPTask. It clashes with "org.gradle.parallel"

org.gradle.jvmargs=-Xmx1024m -XX:MaxPermSize=256m -Dfile.encoding=UTF-8