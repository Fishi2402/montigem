mavenUser=${username}
mavenPassword=${password}
repo=https://nexus.se.rwth-aachen.de/content/groups/umlp

#set true or use \u2013PuseLocalRepo=true to use local maven repo
useLocalRepo=false
version=7.6.0-SNAPSHOT
mc_version=7.6.0-SNAPSHOT
logging_version=7.6.0-SNAPSHOT
junit_version=5.9.2
slf4j_version=1.7.10
guava_version=31.1-jre
spring_version=2.7.11
spring_shell_version=2.1.8
h2_database=2.1.214
