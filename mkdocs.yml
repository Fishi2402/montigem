site_name: MontiGem
use_directory_urls: false

theme:
  name: 'material'
  favicon: 'docs/img/umlptool.png'
  custom_dir: docs/overrides
  hide:
    - navigation
  features:
    - navigation.tabs
    - toc.integrate
    - toc.follow
    - content.tabs.link
  icon:
    logo: 'fontawesome/solid/desktop'

site_url: https://monticore.pages.rwth-aachen.de/monticore/umlp

copyright: '(c) https://github.com/MontiCore/monticore'

markdown_extensions:
  - def_list
  - attr_list
  - md_in_html
  - pymdownx.blocks.caption
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Home: 'index.md'
  - Beginners Guide: 'BeginnersGuide.md'
  - GUI Component Library: 'Frontend-RTE'
  - License: http://monticore.github.io/monticore/00.org/Licenses/LICENSE-MONTICORE-3-LEVEL/
