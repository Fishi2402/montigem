tasks.register('syncLibConfig', Sync) {
  dependsOn(nodeSetup)
  from 'config/projects'
  into "${project.buildDir}/frontendGen/projects"
  outputs.upToDateWhen {false}
}

// Prepare the frontend as a lib
tasks.register('syncLib', Sync) {
  dependsOn(frontendSetup, SYNC_genDomain, SYNC_genGUI, syncLibConfig)
  from "src/app"
  from "${project.buildDir}/frontendGen/build/appdomain/"
  from "${project.buildDir}/frontendGen/build/appgui/"
  into "${project.buildDir}/frontendGen/projects/commentmodule-ts/src/"
  outputs.upToDateWhen {false}
  preserve {
    include 'public-api.ts'
  }
}
