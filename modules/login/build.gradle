plugins {
  id "base"
  id "java"
  id 'maven-publish'
  id 'de.rwth.se.umlp-tool-module-models' // create models-jar
}

configurations {
  moduleGenTimeCompileOnly
  moduleGenTime
}

dependencies {
  moduleGenTimeCompileOnly("umlp:umlp-tool")
  moduleGenTimeCompileOnly group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
  moduleGenTimeCompileOnly group: 'de.monticore.lang', name: 'guidsl', version: mc_version
  moduleGenTimeCompileOnly group: 'de.monticore', name: 'monticore-runtime', version: mc_version
  moduleGenTimeCompileOnly group: 'de.monticore', name: 'monticore-grammar', version: mc_version
}

sourceSets {
  moduleGenTime {
    java {}
  }
}

// We do not have main java soures => Remove .jar from outgoing artifacts
tasks.named('jar') {
  enabled = false
}
configurations{
  [apiElements, runtimeElements].each {
    it.outgoing.artifacts.removeIf { it.buildDependencies.getDependencies(null).contains(jar) }
  }
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      // The plugin publishes moduleGenTime & the models jar
    }
  }
  // TODO: correct repo
  repositories {
    maven {
      url "file://${project.buildDir}/repo"
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword

      def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
      def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
      url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
  }
}
