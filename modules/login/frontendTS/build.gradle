plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  // TODO: -test
  id "de.rwth.se.umlp-tool-frontend"  // suffix "-test" adds aditional tests of the UMLPGenerator to "build" task
//  id "de.rwth.se.umlp-tool-frontend-test"  // suffix "-test" adds aditional tests of the UMLPGenerator to "build" task
  id 'maven-publish'
  id 'de.rwth.se.umlp-tool-module-jsfrontend' // create domainSymbols-jar
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}

createDomainSymbols {
  // TODO: Gradle setup
//  modelDir.from(project(":modules:login").layout.getProjectDirectory().dir("models"))

}

genDomain {
  // TODO: Gradle setup
//  modelDir.from(project(":modules:login").layout.getProjectDirectory().dir("models"))

}

generate {
  //println("ADDING GENERATE")
}


genGUI {
  domainModels = ["LoginModule"]
//  guiCreateModels = ["gui.login.UserCreate", "gui.project.ProjectCreate", "gui.project.ProjectsCreateByGroup"]

//  symbolDir.from(project(":modules:login").layout.getProjectDirectory().dir("models"))

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}
nodeSetup.dependsOn(frontendSetup)
npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall,
    generate  // Created from UMLP-Frontend Plugin.
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}
tasks.register('run') {
  dependsOn(runApp)
}

// We do not have main java soures => Remove .jar from outgoing artifacts
tasks.named('jar') {
  enabled = false
}
configurations{
  [apiElements, runtimeElements].each {
    it.outgoing.artifacts.removeIf { it.buildDependencies.getDependencies(null).contains(jar) }
  }
}

// Publish
publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
    }
  }
  repositories {
    maven {
      url "file://${project.buildDir}/repo"
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword

      def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
      def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
      url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
  }
}
