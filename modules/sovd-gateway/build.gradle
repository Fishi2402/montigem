plugins {
  id "base"
  id "java"
  id 'maven-publish'
  id 'de.rwth.se.montigem-module' // create models-jar
}

configurations {
  moduleGeneratorExtensionCompile
  moduleGenTime
}

dependencies {
  moduleGeneratorExtensionCompile("umlp:umlp-tool")
  moduleGeneratorExtensionCompile group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
  moduleGeneratorExtensionCompile group: 'de.monticore.lang', name: 'guidsl', version: mc_version
  moduleGeneratorExtensionCompile group: 'de.monticore', name: 'monticore-runtime', version: mc_version
  moduleGeneratorExtensionCompile group: 'de.monticore', name: 'monticore-grammar', version: mc_version
}

sourceSets {
  moduleGenTime {
    java {}
  }
}

// We do not have main java soures => Remove .jar from outgoing artifacts
tasks.named('jar') {
  enabled = false
}


publishing {
  publications {
    mavenJava(MavenPublication) {
      from components.java
      artifacts.removeIf {
        return it.classifier == null // remove the default jar (as it is skipped and otherwise an error is thrown during publishing)
      }
      // The plugin publishes moduleGenTime & the models jar
    }
  }
  // TODO: correct repo
  repositories {
    maven {
      url "file://${project.buildDir}/repo"
    }
  }
}
