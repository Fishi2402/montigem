plugins {
  id 'java-library'
  id 'de.rwth.se.umlp-tool-backend'

  id 'application'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
  id 'org.springframework.boot' version "${spring_version}"
}

repositories {
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url ma_repo
  }
}

dependencies {
  def withoutSpringLogging = {
    exclude module: 'spring-boot-starter-logging'
    exclude module: 'logback-classic'
    exclude module: 'log4j-to-slf4j'
  }

  api project(':umlp-rte'), {
    exclude group: "org.slf4j", module: "slf4j-simple"
  }
  testImplementation project(':umlp-test-rte')

  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'
  api 'com.h2database:h2:2.1.214'

  // Spring Boot Dependencies
  compileOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version, withoutSpringLogging
  api group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version, withoutSpringLogging
  api group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version, withoutSpringLogging
  api group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version

  implementation group: 'org.slf4j', name: 'slf4j-simple', version: "1.7.10"

  testImplementation group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging
  testImplementation 'org.junit.jupiter:junit-jupiter-api:5.9.2', withoutSpringLogging
  testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.9.2', withoutSpringLogging

  implementation "org.eclipse.jgit:org.eclipse.jgit:5.2.2.201904231744-r"

  implementation group: 'org.apache.geronimo.javamail', name: 'geronimo-javamail_1.6_mail', version: '1.0.1'
  implementation group: 'com.sun.activation', name: 'javax.activation', version: '1.2.0'

  api group: 'org.gitlab4j', name: 'gitlab4j-api', version: '5.3.0'

  implementation group: 'montiarc.languages', name: 'montiarc', version: ma_version
  implementation group: 'montiarc.languages', name: 'basis', version: ma_version
}

application {
  mainClass = 'autotechagil.AutoTechAgilServerApplication'
}

generateUmlpBackend {
  input = file("../models/AutoTechAgil.umlp")
  useSpring.set(true)
  useShell.set(false)
}

tasks.register('runServer') {
  dependsOn(bootRun {
    systemProperty "spring.shell.interactive.enabled", "false"
  })
}

test {
  testLogging.showStandardStreams = true
}
