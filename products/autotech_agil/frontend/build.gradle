plugins {
  id 'java'
  id 'de.rwth.se.montigem-frontend'
}

repositories {
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url ma_repo
  }
}

node {
  nodeProjectDir = file("${buildDir}/app")
}
nodeSetup.dependsOn(setupFrontend)

gui2java {
  domainModels = ["AutoTechAgil"]
}

SYNC_umlp2ts {
  filter { line -> line.replaceAll('../../../build/umlp_frontend/intermediate/', '../../../build/app/build/') }
}
SYNC_gui2java {
  filter { line -> line.replaceAll('../../../build/umlp_frontend/intermediate/', '../../../build/app/build/') }
}


nodeSetup.dependsOn(setupFrontend)
npmInstall.dependsOn(nodeSetup, ':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
}

tasks.register('runAppNoBuild', NpxTask) {
  command = "ng"
  args = ["serve"]
}

test {
  testLogging {
    events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
  useJUnitPlatform()
}
