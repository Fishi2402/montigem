// run tasks in this project with command:
// gradle :products:syse_functions:<taskName>
//
// important tasks / commands are:
// * start UMLP generator and compile java files:
//   * gradle :products:syse_functions:assemble
// * start UMLP Backend Server:
//   * gradle :products:syse_functions:bootRun
//   * command does not terminate. Stopping the command is also stopping the server
//   * url: http://localhost:8081 (there is no frontend)
//   * there can only be a single running server. A second server cannot start.
//
plugins {
  id 'de.rwth.se.montigem-backend' // Makes the task-types `UMLPTask` and `MergeTask` available

  id 'com.google.cloud.tools.jib' version '3.4.4'
  // Spring Plugins
  // id 'io.spring.dependency-management' version '1.0.15.RELEASE''
  id 'org.springframework.boot' version "${spring_version}"
}

description 'Demolition Recyling Database'

jib {
  container.mainClass = application.mainClass.get()
  from.image = "$container_from_image"
  to.image = "${container_target_image_base}demorec_backend:latest"
}

dependencies {
  //implementation name: 'WorkflowDSL-7.7.0-SNAPSHOT'
  //implementation name: 'TimeExpressions-7.7.0-SNAPSHOT'

  implementation project(':umlp-rte')
  testImplementation project(':umlp-test-rte')
  implementation 'com.h2database:h2:2.1.214'  // In-Memory database written in java
  implementation group: 'org.postgresql', name: 'postgresql', version: '42.5.1'

  developmentOnly group: 'org.springframework.boot', name: 'spring-boot-devtools', version: spring_version
  // Required for Hot-Reload
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-web', version: spring_version
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version

  implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
  implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version

  implementation group: 'de.monticore.lang', name: 'WorkflowDSL', version: mc_version
  // TODO: No longer published? implementation group: 'de.monticore.expressions', name: 'TimeExpressions', version: mc_version

  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version

  implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.9'
}
