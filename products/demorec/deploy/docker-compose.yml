#
# Example Docker-Compose for the deployment _on the server_
# All values inside <_> must be replaced
#
# Also see "deploy.md"
#
version: "2.1"
services:
  db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_PASSWORD=<REPLACE_WITH_A_PASSWORD>
      - POSTGRES_DB=umlpdb
      - POSTGRES_USER=admin
      - CONNECT_TIMEOUT=31536000
      - WAIT_TIMEOUT=31536000
    restart: "unless-stopped"
    expose:
      - 5432
      #ports:
      # - 5432:5432
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d umlpdb" ]
      interval: 10s
      timeout: 10s
      retries: 20
    volumes:
      - './data_database:/var/lib/postgresql/data/'     # Persist Data

  backend:
    image: registry.git.rwth-aachen.de/monticore/umlp/demorec_backend:latest
    environment:
      - UMLP_DEPLOYED_DOMAIN=https://demorec.se.rwth-aachen.de  # Required for Allowed Origins
      - jdbc_driver=org.postgresql.Driver
      - database_url=jdbc:postgresql://db:5432/umlpdb
      - password=<REPLACE_WITH_A_PASSWORD>
      - user=admin
      - deploy=true
      - FILE_LOCATION=/data/
    restart: "unless-stopped"
    links:
      - db
    depends_on:
      db:
        condition: service_healthy
    expose:
      - 8081/tcp
    volumes:
      - './data_upload:/data/'     # Persist Data from user upload

  position_picker:
    image: registry.git.rwth-aachen.de/se/projects/d36.bmbf.batterie/image-processing-unit/position_picker:latest
    environment:
      - DEPLOYED_DOMAIN=https://demorec.se.rwth-aachen.de  # Required for Allowed Origins
    restart: "unless-stopped"
    expose:
      - 5000/tcp
    volumes:
      - './scans/VW_MEB_250526:/app/assets'

  frontend:  # Stat Apache Server with Proxy to backend
    image: registry.git.rwth-aachen.de/monticore/umlp/demorec_frontend:latest
    environment:
      - UMLP_DEPLOYED_DOMAIN=demorec.se.rwth-aachen.de   # Required for SSL certificate
    restart: "unless-stopped"
    ports:
      - '4430:443'  # Proxy is redirecting traffic
      - '8080:80'
    links:
      - backend
      - position_picker
    volumes:
      - './Caddyfile_hw_start_01:/etc/caddy/Caddyfile_hw_start_01:ro'
      #      - './Caddyfile:/etc/caddy/Caddyfile:ro'
      - './caddy_secret_data:/data/'                         # Persist certificates, otherwise a new certificate might be created for every start
