plugins {
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

def useCD2GUI = false

dependencies {
  implementation project(":products:demorec:backend")
  guiTypes "de.monticore.lang:guidsl:${project.properties['mc_version']}:default-types"
  testImplementation project(':umlp-test-rte')

  domainSources project(":products:demorec:backend")
}

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

genGUI {
  domainModels = ["DemoRec"]
  guiCreateModels = ["gui.pack.PackCreate",
                     "gui.process.ProcessCreate",
                     "gui.step.ProcessStepCreate",
                     "gui.joinconnection.JoinConnectionCreate",
                     "gui.endeffector.EndEffectorCreate",
                     "gui.dimension.DimensionCreate",
                     "gui.measuringvalues.MeasuringValueCreate",
                     "gui.component.ComponentCreate",
                     "gui.kind.CreateComponentKind",
                     "gui.pack.PackTypeCreate",
                     "gui.editprocessmodels.edit.wizard.ActionCreate"]

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

translateJava2TSDomain {
  excludeSource.addAll([
      "glob:**/processmodeling/*",
      "glob:**/*test*/*"
  ])
  verbose = true
}


npmInstall.dependsOn(':umlp-rte:client:npmInstall')

def prebuildTasks = [
    npmInstall, generate
]

tasks.register('buildApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["build"]
}
assemble.dependsOn(buildApp)

tasks.register('testApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["test"]
}

tasks.register('runApp', NpxTask) {
  dependsOn(prebuildTasks)
  command = "ng"
  args = ["serve"]
  environment = [
      "NODE_OPTIONS": "--max-old-space-size=4096"
  ]
}

tasks.register('run') {
  dependsOn(runApp)
}

task runAppNoBuild(type: NpxTask) {
  command = "ng"
  args = ["serve"]
}

tasks.register('linkStuff', NodeTask) {
  dependsOn(prebuildTasks)
  def hwcsrc = file("$buildDir/frontendGen/hwcsrc")
  def hwcsrcTarget = file("src/main/ts")

  def frontendOut = file("$buildDir/build/umlp_frontend")
  def frontendOutTarget = file("$buildDir/umlp_frontend")

  outputs.upToDateWhen {
    isJunction(hwcsrc) &&
    isJunction(frontendOut)
  }

  def allLinks = [hwcsrc.toString(), hwcsrcTarget.toString(),
                  frontendOut.toString(), frontendOutTarget.toString(),
  ]

  script = file("$buildDir/frontendGen/symlink-creation.js")
  args = allLinks
}

// Utility method to detect junction/symlink
static boolean isJunction(File file) {
  return java.nio.file.Files.isSymbolicLink(file.toPath())
}

tasks.named('runApp') {
  dependsOn {
    tasks.named('linkStuff').get()
  }
}

tasks.named('buildApp') {
  dependsOn {
    tasks.named('linkStuff').get()
  }
}
