/* (c) https://github.com/MontiCore/monticore */

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  implementation project(":products:demorec:backend")
  testImplementation project(':umlp-test-rte')

  srcUMLPConfig project(":products:demorec:backend")
}

umlpJava2ts {
  excludeSource.addAll([
      "glob:**/processmodeling/*",
      "glob:**/*test*/*"
  ])
  verbose = true
}

gui2java2ts {
  guiCreateModels = [
      "gui.pack.PackCreate",
      "gui.process.ProcessCreate",
      "gui.step.ProcessStepCreate",
      "gui.joinconnection.JoinConnectionCreate",
      "gui.endeffector.EndEffectorCreate",
      "gui.dimension.DimensionCreate",
      "gui.measuringvalues.MeasuringValueCreate",
      "gui.component.ComponentCreate",
      "gui.kind.CreateComponentKind",
      "gui.pack.PackTypeCreate",
      "gui.editprocessmodels.edit.wizard.ActionCreate"
  ]

  excludeTranspile.addAll([
      "glob:**/service/**",
      "glob:**/service/*"
  ])
  verbose = true
}

tasks.named('runApp', NpxTask) {
  environment = [
      "NODE_OPTIONS": "--max-old-space-size=4096"
  ]
}

tasks.register('run') {
  dependsOn(runApp)
}

task runAppNoBuild(type: NpxTask) {
  command = "ng"
  args = ["serve"]
}
