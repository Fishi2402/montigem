<div style="border: 2px solid #000; padding: 10px; flex-direction: row" *ngFor="let photo of getPhotos()">
  <img style="max-width:100px" [src]='getPhotoPath(photo)' alt="Error trying to display {{photo.getFilename()}}.">
  <gem-button class='deletePhoto'
              label = "Delete Photo"
              (leftClick) = 'deletePhoto(photo)'
  >
  </gem-button>
</div>

<div *ngIf="getPhotos() && getPhotos().length === 0">
  <div>
    No photo uploaded yet.
  </div>
  <img style="max-width:100px" src="assets/missingPhoto.png" alt="No photo uploaded yet.">
</div>
