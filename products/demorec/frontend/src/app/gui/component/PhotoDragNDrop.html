<!-- file-upload.component.html -->
<div
    class="drop-container"
    (drop)="onFileDropped($event)"
    (dragover)="preventDefault($event)"
    (dragenter)="preventDefault($event)"
>
  <p>Drag and drop files here, or click to select files</p>
  <div  *ngIf="!stateUploading">
    <input class="browserSpecificFileUpload" type="file" (change)="onFileSelected($event)" multiple />
  </div>
  <div class="uploading" *ngIf="stateUploading"></div>
  <div *ngIf="uploadFailureMessage">
    <div style="color: red;">{{errorMessage}}</div>
  </div>
  <div *ngIf="files.length === 0">
    <div>No files to upload</div>
  </div>

  <div *ngFor="let file of files">
    {{ file.name }}
  </div>

  <div *ngIf='!stateUploading'>
    <gem-row *ngIf='!stateUploading' class="gemRow0"
             [components] = '[uploadTPL, cancelTPL, ]'
    >
    </gem-row>
  </div>

  <ng-template #uploadTPL>
    <gem-button class="upload"
                [label] = 'getUploadLabel()'
                (leftClick) = 'uploadLeftClick.bind(this)($event)'
                [disabled] = 'getUploadDisabled()'
    >
    </gem-button>
  </ng-template>

  <ng-template #cancelTPL>
    <gem-button class="cancel"
                [label] = 'getCancelLabel()'
                (leftClick) = 'cancelLeftClick.bind(this)($event)'
    >
    </gem-button>
  </ng-template>

</div>
