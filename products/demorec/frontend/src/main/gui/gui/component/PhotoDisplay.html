<div class = "photodisplay">
  <div class = "photo" style="border: 2px solid #000; padding: 10px; flex-direction: row" *ngFor="let photo of photoArray">
    <img style="max-width:100px" [src]='getPhotoPath(photo)' alt="Error loading photo." (click)="openImageInNewTab(photo)">
    <gem-button class='deletePhoto'
                label = "Delete Photo"
                (leftClick) = 'deletePhoto(photo)'
    >
    </gem-button>
  </div>
</div>

<div *ngIf="getComponent() && photoArray.length === 0">
  <div>No photo uploaded yet</div>
  <img style="max-width:20px" src="assets/missingPhoto.png" alt="No photo uploaded yet">
</div>
