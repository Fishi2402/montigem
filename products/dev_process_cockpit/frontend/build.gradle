import de.montigem.gradle.specific.CD2GUITask
import de.montigem.gradle.specific.GUI2JavaTask
import de.montigem.gradle.specific.GUIVariabilityTask

plugins {
  id "de.rwth.se.montigem-frontend"
}

def useCD2GUI = false

def cd2gui = tasks.register('cd2gui', CD2GUITask) {
  group = "umlp"
  enabled(useCD2GUI)
  setGroup('build')
  input = file("../models/DevProcessCockpit.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

def guiVariability = tasks.register('guiVariability', GUIVariabilityTask) {
  group = "umlp"
  if (useCD2GUI) {
    input.from(cd2gui.flatMap { it.getOutputDir().dir("models") })
  }
  input.from(file("./src/main/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

def gui2java2 = tasks.register('gui2java2', GUI2JavaTask) {
  group = "umlp"
  enabled(useCD2GUI)
  dependsOn(tasks.named("setupFrontend"))
  input.from(guiVariability.flatMap { it.getOutputDir().dir("cd2gui") })
  symbolPath.from(
      cd2gui.flatMap { it.getOutputDir().file("symbols") }
  )
  symbolPath.from(
      configurations.montigemModuleGUISymbols,
      configurations.montigemModuleImportMap
  )
  handWrittenCodeDir.from(file("src/app/"))
  symbolOutDir = layout.buildDirectory.dir("umlp/fe2/symbols")
  outputDir = layout.buildDirectory.dir("umlp/fe2")
  domain = ["DevProcessCockpit"]
  guiCreateModelsAsFile = file(cd2gui.flatMap { it.getOutputDir().file("meta/guiCreateModels.txt") })
}

['buildApp', 'testApp', 'runApp'].forEach {
  tasks.named(it) {
    dependsOn(gui2java2)
  }
}
