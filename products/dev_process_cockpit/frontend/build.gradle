import de.montigem.gradle.specific.CD2GUITask
import de.montigem.gradle.specific.GUI2JavaTask
import de.montigem.gradle.specific.GUIVariabilityTask

/* (c) https://github.com/MontiCore/monticore */

plugins {
  id "de.rwth.se.montigem-frontend"
}

dependencies {
  umlpModulesGuiSymbols project(":umlp-rte:client")
  umlpModulesImportMap project(":umlp-rte:client")
}

def useCD2GUI = false

node {
  nodeProjectDir = file("${buildDir}/frontendGen")
}
nodeSetup.dependsOn(frontendSetup)

tasks.register('generateCDTOGUI', CD2GUITask) {
  enabled(useCD2GUI)
  setGroup('build')
  input = file("../models/DevProcessCockpit.umlp")
  outputDir = layout.buildDirectory.dir("cd2gui")
}

tasks.register('guiVariability', GUIVariabilityTask) {
  setGroup('build')
  if (useCD2GUI) {
    input.from(generateCDTOGUI.getOutputDir().dir("models"))
  }
  input.from(file("../models/gui"))
  outputDir = layout.buildDirectory.dir("guiVariability")
}

genGUI {
  domainModels = ["DevProcessCockpit"]
  guiCreateModels = []

  /*
  debug = true
  outputs.upToDateWhen { false }
  /**/
}

tasks.register('genGUI2', GUI2JavaTask) {
  enabled(useCD2GUI)
  setGroup('build')
  dependsOn(genGUI, guiVariability)
  input = file(guiVariability.getOutputDir().dir("cd2gui"))
  symbolDir = files(
      generateCDTOGUI.getOutputDir().file("symbols"),
  )
  symbolDir.from(
      configurations.umlpModulesGuiSymbols,
      configurations.umlpModulesImportMap
  )
  hwcDir = file("src/app/")
  symbolOutDir = layout.buildDirectory.dir("umlp/fe2/symbols")
  outputDir = layout.buildDirectory.dir("umlp/fe2")
  domainModels = ["DevProcessCockpit"]
  guiCreateModelsAsFile = file(generateCDTOGUI.getOutputDir().file("meta/guiCreateModels.txt"))
}

npmInstall.dependsOn(':umlp-rte:client:npmInstall')


tasks.named('buildApp', NpxTask) {
  dependsOn(genGUI2)
}

tasks.named('testApp', NpxTask) {
  dependsOn(genGUI2)
}

tasks.named('runApp', NpxTask) {
  dependsOn(genGUI2)
}

tasks.register('run') {
  dependsOn(runApp)
}
