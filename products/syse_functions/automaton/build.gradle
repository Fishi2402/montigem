/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'de.rwth.se.umlp-tool-backend'
}

description 'Syse Functions'

generateUmlpBackend {
  //configTemplate = "umlp.UMLP2JavaNeo4j"
  modelDir.from(file("../models"))
}

dependencies {
  implementation project(":products:syse_functions:backend")
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
  implementation group: 'montiarc.languages', name: 'montiarc', version: ma_version
  implementation project(':umlp-rte')
  implementation project(':umlp-test-rte')
  testImplementation "com.h2database:h2:${h2_database}"
}

repositories {
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url ma_repo
  }
}

test {
  testLogging.showStandardStreams = true
}
