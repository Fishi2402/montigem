pluginManagement {
  repositories {
    if (("true").equals(getProperty('useLocalRepo'))) {
      mavenLocal()
    }
    maven {
      credentials.username mavenUser
      credentials.password mavenPassword
      url repo
    }
    gradlePluginPortal()
    mavenCentral()
  }
}

rootProject.name = 'umlp'
includeBuild "umlp-tool"
includeBuild "umlp-rte/umlp-frontend-rte-java"

include ":umlp-rte"
include ":umlp-rte:client"
include ":umlp-rte:umlp-frontend-rte"
include ":umlp-rte:umlp-frontend-rte-java"

include ":experiments"
include ":experiments:initial"
include ":experiments:coreRequirements"
include ":experiments:coreRequirements:stanley"
include ":experiments:dbPerformance"


include ":examples"
include ':examples:cars'
include ':examples:filesystem'
include ':examples:mediahub'
include ':examples:restaurant'
include ':examples:selib'
include ':examples:university'
include ':examples:stat'
include ':examples:artifacts-test'
include ':examples:artifacts-java'
include ':examples:flensburg-neo4j-test'
include ':examples:flensburg-test'
include ':examples:flensburg-test:client'
include ':examples:it-test'
include ':examples:assistenzsystem'
