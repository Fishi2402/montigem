import gradle.specific.UMLPJava2TypeScriptTask
import gradle.specific.cd.GUITypes2JavaTask

plugins {
    id 'application'
    id 'maven-publish'
    id 'java-library'
    id 'io.spring.dependency-management' version '1.0.15.RELEASE'
    id 'de.rwth.se.umlp-tool-dependencies'
}

group = "umlp"
description = "UMLP RTE"

def withoutSpringLogging = {
  exclude module: 'spring-boot-starter-logging'
  exclude module: 'logback-classic'
  exclude module: 'log4j-to-slf4j'
}

dependencies {
    api group: 'de.monticore', name: 'monticore-runtime', version: mc_version

    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version
    implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
    implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version

    // Compile only, such that we don't force the neo4j dependency into each product
    compileOnly group: 'org.neo4j', name: 'neo4j-jdbc-driver', version: neo4j_jdbc_version
    compileOnly "org.neo4j:neo4j:4.4.10"
    compileOnly "org.neo4j.driver:neo4j-java-driver:$neo4jVersion"

    // Used for umlp._infrastructure.TestSetup
    // Alternative: testing-rte + generate a testing module for each cd
    compileOnly 'org.junit.jupiter:junit-jupiter-api:5.9.2'
    // Used for AbstractPlaywrightE2ETest
    compileOnly 'com.microsoft.playwright:playwright:1.44.0'
    compileOnly group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging

    implementation("com.hivemq:hivemq-mqtt-client:1.3.0")
}

// TODO: umlpModules config is added elsewhere  by the umlp plugin
configurations {
  umlpModules
  umlpModulesGen
}

// POJOs
tasks.register('generateGuiComponentJava', GUITypes2JavaTask) {
  hwcDir = project.layout.files("src/main/java")
  input = file("client/models/")
  outputDir = project.layout.buildDirectory.dir("guiComponentTypes")
}

// Let RTE assemble depend on the generation
assemble.dependsOn generateGuiComponentJava

//task guiComponentTypesJar(type: Jar) {
//  from generateGuiComponentPOJOs.output
//  archiveClassifier = "guiComponentTypes"
//}

sourceSets {
  main {
    java.srcDirs += [generateGuiComponentJava.outputDir]
  }
}
//guiComponentTypesJar.dependsOn compileJava

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
    publications {
      maven(MavenPublication) {
        from(components.java)
      }
    }
    repositories.maven {
        credentials.username mavenUser
        credentials.password mavenPassword

        def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
        def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
        url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
}


////////// Transpile the (client) runtime
// Note: This is currently purely to compare it by hand

configurations {
  jsweettranspilerRuntime {
    extendsFrom(configurations.compileClasspath)
  }
}

dependencies {
  jsweettranspilerRuntime project(path: ":umlp-rte:umlp-jsweet")
}

tasks.register("transpileRuntime", UMLPJava2TypeScriptTask) {
  getInput().setFrom(sourceSets.main.java)
  getVerbose().set(true)
  getOutputDir().set(project.layout.buildDirectory.dir("runtimeTS"))
  getJSweetClassPath().from(configurations.jsweettranspilerRuntime)
  // getDomainModel().set("NYI")
  getExcludeSource().add("glob:**/shellapi/*.java")
  getExcludeSource().add("glob:**/test_infrastructure/*.java")
  getExcludeSource().add("glob:**/common/DatabaseAccessManage*.java")
  getExcludeSource().add("glob:**/common/Neo4jDatabaseStarter.java")
  getExcludeSource().add("glob:**/common/GemIdManager4*.java")
  getExcludeSource().add("glob:**/service/**.java")
  getExcludeSource().add("glob:**/service2/**.java")
}

repositories {
  // Only use jsweet repos for everything in org.jsweet*(excl jsweet-core which is in maven-central)
  // since they throw 409 errors for dependencies in other groups
  maven {
    url "https://repository.jsweet.org/artifactory/libs-snapshot-local"
    mavenContent {
      includeModuleByRegex("org[.]jsweet.*", "(?!jsweet-core).*")
    }
  }
  maven {
    url "https://repository.jsweet.org/artifactory/libs-release-local"
    mavenContent {
      includeModuleByRegex("org[.]jsweet.*", "(?!jsweet-core).*")
    }
  }
}

// END Transpile runtime
