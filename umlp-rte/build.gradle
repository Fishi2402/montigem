buildscript {
    repositories {
        if(("true").equals(getProperty('useLocalRepo'))) { mavenLocal() }
        mavenCentral()
        maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
        maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
    }
    dependencies {
        classpath('de.rwth.se.umlp.jsweet:jsweet-gradle-plugin:3.2.0-SNAPSHOT') {
            transitive = true
        }
    }
}

plugins {
    id 'application'
    id 'maven-publish'
    id 'java-library'
    id "de.rwth.se.umlp.jsweet.jsweet-gradle-plugin" version "3.2.0-SNAPSHOT"
}


group = "umlp"
description = "UMLP RTE"

// Enable for implementing a new Adapter
repositories {
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
}

dependencies {
    api group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version
    api group: 'org.postgresql', name: 'postgresql', version: '42.2.19'
    api group: 'com.google.guava', name: 'guava', version: guava_version

    // Enable for implementing a new Adapter
    implementation group: 'org.jsweet', name: 'jsweet-transpiler', version: "3.2.0-SNAPSHOT"
}

test {
    testLogging {
        events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
    useJUnitPlatform()
}

/////////////////////////   JSweet //////////////////////////////
// Enable for implementing a new Adapter
sourceSets {
    main.java.srcDirs += ["$projectDir/jsweet_extension"]
}

jsweet {
    verbose = true
    encoding = 'UTF-8'
    sourceMap = true
    tsOnly = true
    tsOut = project.file('frontend/target/generated-sources/ts')
    targetVersion = 'ES6'
    includes = ['**/*.java']
    module = 'commonjs'
    excludes = ['**/umlp/jsweet/extension/**/*.java']    // Enable for implementing a new Adapter
    workingDir = project.file('frontend/target/.jsweet')
}

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
    publications {
      maven(MavenPublication) {
        from(components.java)
      }
    }
    repositories.maven {
        credentials.username mavenUser
        credentials.password mavenPassword

        def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
        def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
        url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
}