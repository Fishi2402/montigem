/* (c) https://github.com/MontiCore/monticore */
plugins {
    id 'application'
    id 'maven-publish'
    id 'java-library'
}


group = "umlp"
description = "UMLP RTE"

repositories {
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
}

dependencies {
    api group: 'de.monticore', name: 'monticore-runtime', version: mc_version

    implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
}

test {
    testLogging {
        events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
    useJUnitPlatform()
}

/////////////////////////   JSweet //////////////////////////////
project('umlp-frontend-rte'){
    sourceSets.main.java {
        srcDirs = ['../src/main/java']
    }
}

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
    publications {
      maven(MavenPublication) {
        from(components.java)
      }
    }
    repositories.maven {
        credentials.username mavenUser
        credentials.password mavenPassword

        def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
        def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
        url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
}