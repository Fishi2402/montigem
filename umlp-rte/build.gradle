/* (c) https://github.com/MontiCore/monticore */

plugins {
    id 'application'
    id 'maven-publish'
    id 'java-library'
}


group = "umlp"
description = "UMLP RTE"


dependencies {
    api group: 'de.se_rwth.commons', name: 'se-commons-logging', version: logging_version

    api group: 'com.google.code.gson', name: 'gson', version: gson_version
    api group: 'org.hibernate', name: 'hibernate-core', version: hibernate_version
    api group: 'com.google.guava', name: 'guava', version: guava_version
}

test {
    testLogging {
        events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
    }
    useJUnitPlatform()
}

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
    publications {
      maven(MavenPublication) {
        from(components.java)
      }
    }
    repositories.maven {
        credentials.username mavenUser
        credentials.password mavenPassword

        def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
        def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
        url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
    }
}