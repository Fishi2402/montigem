def buildTaskPrefix = "build_"
def publishTaskPrefix = "publish_"

libs.each {
  def libName = it
  def buildTaskName = "${buildTaskPrefix}${libName}"
  def genNpmrcTaskName = "gen_npmrc_${libName}"
  def publishTaskName = "${publishTaskPrefix}${libName}"
  def npmOutput = "dist/umlp/mc/fenix/${libName}"

  // task `build_<lib_name>` that runs `npm run build @umlp/<lib_name>`
  task "${buildTaskName}"(type: NpmTask) {
    dependsOn tasks.npmInstall
    args = ["run", "build", "@umlp/${libName}"]
    inputs.dir(project.fileTree("projects/umlp/mc/fenix/${libName}/")
        .exclude("**/*.spec.ts", "**/*.md"))
    inputs.files("angular.json", "tsconfig.base.json", "package-lock.json")
    outputs.dir("${project.buildDir}/${npmOutput}")
  }

  // task `gen_npmrc_<lib_name>` that creates .npmrc file for publishing
  task "${genNpmrcTaskName}"(type: NPMAuthCreate) {
    dependsOn "${buildTaskName}"
    npmrcFile = file("${project.buildDir}/${npmOutput}/.npmrc")
    unscoped = true
  }

  // task `publish_<lib_name>` that runs `npm publish <lib_name>`
  task "${publishTaskName}"(type: NpmTask) {
    dependsOn "${genNpmrcTaskName}"
    workingDir = file("${project.buildDir}/${npmOutput}")
    args = ["publish"]
  }
}

tasks.register('buildAll') {
  dependsOn tasks.findAll { it.name.startsWith(buildTaskPrefix) }
}

tasks.register('publishAll') {
  dependsOn tasks.findAll { it.name.startsWith(publishTaskPrefix) }
}

