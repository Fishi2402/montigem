plugins {
  id 'java'
  id 'maven-publish'
  id "com.github.node-gradle.node" version "5.0.0"
  id "de.rwth.se.umlp-tool-frontend"
}

repositories {
  mavenCentral()
}

configurations {
  guiDefaultTypes
}

dependencies {
  guiDefaultTypes "de.monticore.lang:guidsl:${project.properties['mc_version']}:default-types"
  implementation project(":umlp-rte")
}

tasks.register('createCDSymbols', SerializeCDSymbolsTask) {
  input = file("models/")
  // symbolPath = file("models/")
  output = layout.buildDirectory.dir("CDSymbols")
}

tasks.register('createGuiSymbols', SerializeGUISymbolsTask) {
  input = file("models/")
  symbolDir = files(createCDSymbols.getOutput(), configurations.guiDefaultTypes.files)
  output = layout.buildDirectory.dir("GuiSymbols")
}

def componentLibs = [
    "arrange",
    "basic",
    "charts",
    "functiondisplay",
    "input",
    "navigation",
    "table",
    "networkgraph"
]

def libs = [
    "common",
    "commonj2ts",
    "theme",
] + componentLibs

def buildTaskPrefix = "build_"
def publishTaskPrefix = "publish_"
def copyTaskPrefix = "copy_types_"
def genTaskPrefix = "gen_"
def genNpmrcTaskPrefix = "npmrc_"
def buildFolders = []

libs.each {
  def libName = it
  def buildTaskName = "${buildTaskPrefix}${libName}"
  def genNpmrcTaskName = "${genNpmrcTaskPrefix}${libName}"
  def publishTaskName = "${publishTaskPrefix}${libName}"
  def npmOutput = "dist/${libName}"

  // task `build_<lib_name>` that runs `npm run build @umlp/<lib_name>`
  task "${buildTaskName}"(type: NpmTask) {
    dependsOn tasks.npmInstall
    args = ["run", "build", "@umlp/${libName}"]
    // e.g. `projects/basic/src/mc/fenix/basic/`
    inputs.dir(project.fileTree("projects/${libName}")
        .exclude("**/build/**")
        .exclude("**/*.spec.ts", "**/*.md"))
    inputs.files("angular.json", "tsconfig.json", "tsconfig.prod.json", "package.json")
    // e.g. `build/dist/basic/`
    outputs.dir("${project.buildDir}/${npmOutput}")
  }

  // task `npmrc_<lib_name>` that creates .npmrc file for publishing
  task "${genNpmrcTaskName}"(type: NPMAuthCreate) {
    dependsOn "${buildTaskName}"
    // e.g. `build/dist/basic/.npmrc`
    npmrcFile = file("${project.buildDir}/${npmOutput}/.npmrc")
    unscoped = true
  }

  // task `publish_<lib_name>` that runs `npm publish <lib_name>`
  task "${publishTaskName}"(type: NpmTask) {
    dependsOn "${genNpmrcTaskName}"
    // e.g. `build/dist/basic/`
    workingDir = file("${project.buildDir}/${npmOutput}")
    args = ["publish"]
  }

  def copyTaskName = "${copyTaskPrefix}${libName}"
  def sourceDir = "${project.buildDir}/guiComponentTypes/mc/fenix/${libName}"
  def genDir = "projects/${libName}/build"
  buildFolders << genDir
  def targetRoot = "${genDir}/cd"
  def targetDir = "${targetRoot}/mc/fenix/${libName}"

  task "${copyTaskName}"(type: Copy) {
    dependsOn translateJava2TSDomain
    // e.g. `build/guiComponentTypes/mc/fenix/basic/`
    from sourceDir
    // e.g. `projects/basic/build/cd/mc/fenix/basic/`
    into targetDir
  }

  tasks[buildTaskName].dependsOn tasks[copyTaskName]
  def genTaskName = "${genTaskPrefix}${libName}"

  if (libName in componentLibs) {
    task "${genTaskName}"(type: UMLPGuiGenTask) {
      dependsOn(createCDSymbols, tasks[copyTaskName])
      input = layout.projectDirectory.dir("models/mc/fenix/${libName}")
      modelDir = layout.projectDirectory.dir("models")
      hwcDir = file(layout.projectDirectory.dir("projects/${libName}/src"))
      symbolDir = files(createCDSymbols.getOutput(), configurations.guiDefaultTypes.files)
      outputDir = layout.projectDirectory.dir("${genDir}/gui")
      importsDir = files(targetRoot)
      guiGenJsweet = false
      guiGenTSFuncionality = true
      gen4TSLib = true
    }

    tasks[buildTaskName].dependsOn tasks[genTaskName]
  }
}

clean.doLast {
  buildFolders.each { folder ->
    delete file(folder)
  }
}

tasks.build_basic.inputs.files(tasks.build_common.outputs.files.singleFile)
tasks.build_basic.dependsOn(tasks.build_common)
tasks.build_basic.inputs.files(tasks.build_commonj2ts.outputs.files.singleFile)
tasks.build_basic.dependsOn(tasks.build_commonj2ts)
tasks.build_charts.inputs.files(tasks.build_commonj2ts.outputs.files.singleFile)
tasks.build_charts.dependsOn(tasks.build_commonj2ts)
tasks.build_input.inputs.files(tasks.build_commonj2ts.outputs.files.singleFile)
tasks.build_input.dependsOn(tasks.build_commonj2ts)
tasks.build_networkgraph.inputs.files(tasks.build_commonj2ts.outputs.files.singleFile)
tasks.build_networkgraph.dependsOn(tasks.build_commonj2ts)

tasks.register('buildAll') {
  dependsOn tasks.findAll { it.name.startsWith(buildTaskPrefix) }
}

tasks.register('publishAll') {
  dependsOn tasks.findAll { it.name.startsWith(publishTaskPrefix) }
}

build.dependsOn(buildAll)

publish.dependsOn(publishAll)

dependencies {
}

sourceSets {
  symbols {
    resources {
      srcDirs(createCDSymbols.getOutput(), createGuiSymbols.getOutput())
      include "**/*sym"
    }
  }
}

tasks.register('symbolJar', Jar) {
  from sourceSets.symbols.output
  includeEmptyDirs = false
}

jar.dependsOn(symbolJar)

artifacts {
  archives symbolJar
}

publishing {
  publications {
    mavenJava(MavenPublication) {
      artifact symbolJar
    }
  }
  repositories.maven {
    credentials.username mavenUser
    credentials.password mavenPassword

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}


// JSweet
translateJava2TSDomain {
  verbose = true
  File projectBase = parent.projectDir
  File srcDir = new File(projectBase, "src/main/java")

  def hwcFiles = []
  srcDir.traverse(type: groovy.io.FileType.FILES) { file ->
    if (file.getPath().startsWith(srcDir.getPath() + File.separator + "mc" + File.separator + "fenix")) {
      hwcFiles << file
    }
  }
  input.from(hwcFiles)
  input.from(files(project(":umlp-rte").buildDir, "guiComponentTypes"))

/*
  parent.tasks.named('generateGuiComponentJava').configure{
    task -> task.doLast {
      input.from(files(task.outputDir))
    }
  }
*/
  outputDir.set(new File(project.buildDir, "guiComponentTypes"))
}

gradle.projectsEvaluated {
  translateJava2TSDomain.configure {task ->
    task.dependsOn(project(":umlp-rte").tasks["generateGuiComponentJava"])
  }
}

genGUI {
  enabled = false
}

createDomainSymbols {
  enabled = false
}

frontendSetup {
  enabled = false
}

genJava2TSGUIConfig {
  enabled = false
}

genJava2TSDomainConfig {
  enabled = false
}

translateJava2TSGUI {
  enabled = false
}
