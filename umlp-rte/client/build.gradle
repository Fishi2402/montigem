// JSweet
translateJava2TSDomain {
  verbose = true
  File projectBase = parent.projectDir
  File srcDir = new File(projectBase, "src/main/java")

  def hwcFiles = []
  srcDir.traverse(type: groovy.io.FileType.FILES) { file ->
    if (file.getPath().startsWith(srcDir.getPath() + File.separator + "mc" + File.separator + "fenix") ||
      file.getPath().startsWith(srcDir.getPath() + File.separator + "rte" + File.separator + "deser")) {
      hwcFiles << file
    }
  }
  input.from(hwcFiles)
  input.from(files(project(":umlp-rte").buildDir, "guiComponentTypes"))

/*
  parent.tasks.named('generateGuiComponentJava').configure{
    task -> task.doLast {
      input.from(files(task.outputDir))
    }
  }
*/
  outputDir.set(new File(project.buildDir, "guiComponentTypes"))
}

gradle.projectsEvaluated {
  translateJava2TSDomain.configure {task ->
    task.dependsOn(project(":umlp-rte").tasks["generateGuiComponentJava"])
  }
}

def copyTaskPrefix = "copy_"
def copyTaskPostFix = "Types"

libs.each {
  def libName = it
  def copyTaskName = "${copyTaskPrefix}${libName}${copyTaskPostFix}"
  def sourceDir = "${project.buildDir}/guiComponentTypes/mc/fenix/${libName}"
  def targetDir = "projects/umlp/mc/fenix/${libName}/src/lib/gen"
  def buildTaskName = "${buildTaskPrefix}${libName}"

  task "${copyTaskName}"(type: Copy) {
    dependsOn translateJava2TSDomain
    from "${sourceDir}"
    into "${targetDir}"
  }

  tasks[buildTaskName].dependsOn tasks[copyTaskName]
}

