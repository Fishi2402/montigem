<gem-column
  class="gem-card"
  [components]="[gemNode2, gemNode3, gemNode4]"
>
</gem-column>
<ng-template #gemNode2>
  <gem-row
    height="initial"
    class="gem-card-header"
    [component]="titleTpl"
  >
  </gem-row>
</ng-template>
<ng-template #gemNode3>
  <hr class="gem-card-line">
</ng-template>
<ng-template #gemNode4>
  <gem-column
    height="initial"
    class="gem-card-body"
    [component]="component"
  >
  </gem-column>
</ng-template>
<ng-template #titleTpl>
  <ng-template [ngIf]="!titleComponent">
    {{title}}
  </ng-template>
  <ng-template [ngIf]="titleComponent">
    <ng-template [ngTemplateOutlet]="titleComponent">
    </ng-template>
  </ng-template>
</ng-template>
