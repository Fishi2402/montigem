<div style="margin-bottom: 5px">
  <gem-chart-options>
    <li *ngIf="displayLegend === true">
      <h3>Legend Position</h3>
      <div class="legendButtons">
        <button (click)="setLegendPosition('left')">Left</button>
        <button (click)="setLegendPosition('top')">Top</button>
        <button (click)="setLegendPosition('bottom')">Bottom</button>
        <button (click)="setLegendPosition('right')">Right</button>
      </div>
    </li>
    <li>
      <h3>Pie Chart Settings</h3>
      <div class="field">
        <input class="slider" #sliderSelector
          (change)="changeInnerRadius(+sliderSelector.value)"
          type="range" min="0" max="100" value="_innerRadius"
        />
        <span class="right">Inner Radius</span>
      </div>
    </li>
  </gem-chart-options>
</div>

<div
  [ngClass]="changeContainer()"
  *ngIf="dataSets != null && dataSets.length > 0; else elseBlock"
>
  <div class="wholeChartContainer">
    <canvas
      baseChart
      [data]="{datasets: dataSets}"
      [labels]="labels"
      [options]="options"
      [type]="'pie'"
    >
    </canvas>
  </div>
  <gem-chart-legend
    [labels]="legendLabels"
    [colors]="legendColors"
    [displayLegend]="displayLegend"
    >
  </gem-chart-legend>
</div>

<ng-template #elseBlock>
  <p>No data available</p>
</ng-template>
