<gem-row [components]="[gemNode3,gemNode5,gemNode7]" class="gem-columns-items">
</gem-row>
<ng-template #gemNode3>
  <gem-column [component]="gemNode2" class="gem-columns-item1"> </gem-column>
</ng-template>
<ng-template #gemNode2>
  <ng-container *ngFor="let c of column1">
    <gem-column [component]="c" class="gem-column-item"></gem-column>
  </ng-container>
</ng-template>

<ng-template #gemNode5>
  <gem-column [component]="gemNode4" class="gem-columns-item2"> </gem-column>
</ng-template>

<ng-template #gemNode4>
  <ng-container *ngFor="let c of column2">
    <gem-column [component]="c" class="gem-column-item"></gem-column>
  </ng-container>
</ng-template>
<ng-template #gemNode7>
  <gem-column [component]="gemNode6" class="gem-columns-item3"> </gem-column>
</ng-template>
<ng-template #gemNode6>
  <ng-container *ngFor="let c of column3">
    <gem-column [component]="c" class="gem-column-item"></gem-column>
  </ng-container>
</ng-template>
