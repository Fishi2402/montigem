<button
  type="button"
  role="button"
  class="gem-button"
  [ngStyle]="style"
  [ngClass]="classes"
  [disabled]="disabled ? 'disabled' : null"
  (click)="leftClick.emit($event)"
>
  <ng-container *ngIf="content">
    <ng-container *ngFor="let c of content">
      <ng-container *ngTemplateOutlet="c"></ng-container>
    </ng-container>
  </ng-container>
  <ng-container *ngIf="!content">
    {{ label }}
  </ng-container>
</button>
