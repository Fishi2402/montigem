<label
  class="gem-dual-range-label"
  [class.gem-dual-vertical-range-label]="vertical"
  [for]="id + 'DualRange'"
  >{{ labelText }}</label
>
<div
  class="gem-dual-range-wrapper"
  [class.gem-vertical-dual-range-wrapper]="vertical"
>
  <span
    class="gem-dual-range-min"
    [class.gem-dual-vertical-range-min]="vertical"
    >{{ minValue }}</span
  >
  <div class="gem-dual-range-container">
    <div
      class="gem-dual-range-start-value"
      [class.gem-dual-vertical-range-value]="vertical"
      [id]="id + 'rangeStartV'"
    ></div>
    <input
      class="gem-dual-range-start"
      type="range"
      [id]="id + 'DualRange'"
      [min]="minValue"
      [max]="maxValue"
      [ngModel]="startValue"
      (ngModelChange)="onStartChange($event)"
      [step]="step"
    />
    <div
      class="gem-dual-range-end-value"
      [class.gem-dual-vertical-range-value]="vertical"
      [id]="id + 'rangeEndV'"
    ></div>
    <input
      class="gem-dual-range-end"
      type="range"
      [id]="id + 'DualRange'"
      [min]="minValue"
      [max]="maxValue"
      [ngModel]="endValue"
      (ngModelChange)="onEndChange($event)"
      [step]="step"
    />
  </div>
  <span
    class="gem-dual-range-max"
    [class.gem-dual-vertical-range-max]="vertical"
    >{{ maxValue }}</span
  >
</div>
