<label class="gem-label-radio" [for]="id + 'Radio'">
  <span *ngIf="!rightPosition">{{ labelText }}</span>
  <input
    class="gem-radio"
    type="radio"
    [id]="id + 'Radio'"
    [value]="value"
    [ngModel]="selectedValue"
    [disabled]="disabled"
    [name]="group"
    (ngModelChange)="onSelectedValueChange($event)"
  />
  <span *ngIf="rightPosition">{{ labelText }}</span>
</label>
