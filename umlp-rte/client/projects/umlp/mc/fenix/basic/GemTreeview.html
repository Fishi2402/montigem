<ul class="gem-tree-root" *ngFor="let item of getItems()">
  <li class="gem-tree-item">
    <span class="gem-tree-item-text">
      <span *ngIf="item.getChildrenList()" class="gem-tree-item-icon" (click)="onExpand(item)">
        <i class="fa fa-plus-square" *ngIf="!item.isExpanded()"></i>
        <i class="fa fa-minus-square" *ngIf="item.isExpanded()"></i>
      </span>
      <span (click)="getLeftClick()(item)">{{ item.getName() }}</span>
    </span>
  </li>

  <ng-container *ngIf="item.isExpanded()">
    <ng-template [ngTemplateOutlet]="children" [ngTemplateOutletContext]="{items: item.getChildrenList()}">
    </ng-template>
  </ng-container>
</ul>

<ng-template #children let-items="items">
  <ul class="gem-tree-root-nested" *ngFor="let item of getItems()">
    <li class="gem-tree-item">
      <span class="gem-tree-item-text">
        <span *ngIf="item.getChildrenList() && item.getChildrenList().length > 0" class="gem-tree-item-icon" (click)="onExpand(item)">
          <i class="fa fa-plus-square" *ngIf="!item.isExpanded()"></i>
          <i class="fa fa-minus-square" *ngIf="item.isExpanded()"></i>
        </span>
        <span (click)="getLeftClick()(item)">{{ item.getName() }}</span>
      </span>
    </li>

    <ng-container *ngIf="item.isExpanded()">
      <ng-template [ngTemplateOutlet]="children" [ngTemplateOutletContext]="{items: item.getChildrenList()}">
      </ng-template>
    </ng-container>
  </ul>
</ng-template>
