<div class="gem-dropdown-container">
  <label class="gem-label-text-input" [for]="id + 'Input'">{{ labelText }}</label>
  <input
    class="gem-text-input gem-dropdown-button"
    [id]="id + 'Input'"
    type="button"
    [value]="entry"
    (click)="toggleDropdown()"
  />
  <div #content class="gem-dropdown-content">
    <div *ngFor="let option of options" (click)="selectOption()">{{ option.display }}</div>
  </div>
</div>
