<div
  class="gem-dropdown-container"
  (keydown.arrowDown)="focusDown()"
  (keydown.arrowUp)="focusUp()"
  (keydown.enter)="selectWithEnter($event)"
  (keydown.escape)="hideDropdown()"
  (keydown.tab)="tabOut()"
  (keydown)="onKeyPress($event)"
  (keyup)="onKeyRelease($event)"
>
  <label class="gem-label-text-input" [for]="getInputId()">{{ labelText }}</label>
  <button
    class="gem-dropdown-input"
    tabindex="0"
    [id]="getInputId()"
    [disabled]="disabled"
    (click)="toggleDropdown()"
    [matTooltip]="
        validity?.status === 'Error' || validity?.status === 'Warning'
          ? validity.message
          : null
      "
    matTooltipPosition="after"
    [class.gem-input-error]="validity?.status === 'Error'"
    [class.gem-input-warning]="validity?.status === 'Warning'"
  >
    <div class="gem-dropdown-text">{{ entry }}</div>
    <mat-icon class="gem-dropdown-icon" [fontIcon]="isContentShown ? 'arrow_drop_up' : 'arrow_drop_down'"></mat-icon>
  </button>
  <div *ngIf="isContentShown" class="gem-dropdown-content">
    <div *ngIf="searchEnabled" class="gem-search-input-container">
      <div class="gem-search-icon">
        <mat-icon fontIcon="search"></mat-icon>
      </div>
      <input
        [id]="getSearchInputId()"
        class="gem-text-input gem-search-input"
        type="text"
        placeholder="Search ..."
        tabindex="0"
        autocomplete="off"
        [(ngModel)]="filterString"
        (keyup)="filterOptions()"
      >
    </div>
    <div [id]="getOptionsId()" class="gem-dropdown-options">
      <div
        *ngFor="let option of filteredOptions; let i = index"
        class="gem-dropdown-option"
        [class.highlight-option]="highlightIdx == i"
        (click)="selectOption(option)"
        (mousemove)="setHighlightIdx(i)"
      >
        {{ option.display }}
      </div>
    </div>
  </div>
</div>
