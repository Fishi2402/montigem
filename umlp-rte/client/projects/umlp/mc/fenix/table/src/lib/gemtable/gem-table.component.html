<table class="gem-table-style" [style.width]="width">
  <caption *ngIf="caption?.length > 0" class="gem-table-caption">{{ caption }}</caption>
  <ng-container *ngTemplateOutlet="header"></ng-container>
  <tbody>
    <ng-container *ngTemplateOutlet="body"></ng-container>
  </tbody>
</table>
