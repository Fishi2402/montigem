<div class="gem-table-wrapper">
  <!-- Elements above the actual table (start) -->
  <div class="gem-table-header">
    <!-- Left above the actual table (start) -->
    <div class="gem-table-header-left">
      <div
        class="gem-table-filter"
        *ngIf="isFilterable"
      >
        <i class="fa fa-search" aria-hidden="true"></i>
        <input
          #filterInput
          (keyup)="filter($event)"
          placeholder="Suche"
        />
      </div>

      <div
        *ngIf="filterTemplate"
        class="gem-table-advanced-search"
      >
        <button
          type="button"
          class="gem-table-button"
          (click)="toggleCustomSearch()"
        >
          <i
            class="fa"
            [ngClass]="hasCustomSearch ? 'fa-minus' : 'fa-plus'"
            aria-hidden="true"
          >
          </i>
          <span>Extended</span>
        </button>
      </div>

      <!-- Slider to enable or disable batch mode -->
      <div *ngIf="selectable" class="gem-table-slider">
        <mat-slide-toggle
          color="primary"
          labelPosition="after"
          (change)="toggleBatchMode($event)"
        >
        </mat-slide-toggle>
        Edit multiple
      </div>
    </div>
    <!-- Left above the actual table (end) -->

    <!-- Right above the actual table (start) -->
    <div class="gem-table-settings-wrapper">

      <mat-menu #colVisibilityMenu>
        <div (click)="$event.stopPropagation()">
          <ul class="gem-table-settings-menu">
            <ng-container
              *ngFor="let col of columns; trackBy: columnIdentifier"
            >
              <li>
                <mat-checkbox
                  (change)="toggleHideColumn(col.id)"
                  [checked]="!isHiddenColumn(col)"
                >
                  <span>{{ getColumnName(col) }}</span>
                </mat-checkbox>
              </li>
            </ng-container>
          </ul>
        </div>
      </mat-menu>

      <mat-menu #groupingMenu="matMenu">
        <div (click)="$event.stopPropagation()">
          <ul class="gem-table-settings-menu">
            <li>
              <mat-radio-button
                name="groupingMenu"
                (change)="ungroup()"
                checked
              >
                No grouping
              </mat-radio-button>
            </li>
            <ng-container
              *ngFor="let col of columns; trackBy: columnIdentifier"
            >
              <li *ngIf="!col.excludeFromGrouping">
                <mat-radio-button
                  name="groupingMenu"
                  [id]="col.id"
                  [checked]="isGroupedByColumn(col)"
                  (change)="group(col)"
                >
                  {{ getColumnName(col) }}
                </mat-radio-button>
              </li>
            </ng-container>
          </ul>
        </div>
      </mat-menu>

      <!-- Settings menu (start) -->
      <!-- Button to open the menu -->
      <button
        *ngIf="hasSettingsButton()"
        [matMenuTriggerFor]="columnsMenu"
        class="gem-table-button"
        type="button"
      >
        <i class="fa fa-cog" aria-hidden="true"></i>
        Settings
      </button>

      <mat-menu #columnsMenu="matMenu" [overlapTrigger]="false">
        <ng-container *ngIf="presentInactiveRow()">
          <span class="gem-table-menu-header">Rows</span>
          <mat-divider></mat-divider>

          <button
            mat-menu-item
            (click)="toggleHideRows()"
          >
            <i
              class="fa"
              [ngClass]="{
                'fa-plus': areRowsHidden,
                'fa-minus': !areRowsHidden
              }"
              ari-hidden="true"
            ></i>
            {{ !areRowsHidden ? "Hide " : "Show " }} deactivated
          </button>
        </ng-container>

        <ng-container>
          <span class="gem-table-menu-header">Columns</span>
          <mat-divider></mat-divider>
          <button mat-menu-item [matMenuTriggerFor]="colVisibilityMenu">
            <i class="fa fa-eye-slash" aria-hidden="true"></i>
            Hide/Show
          </button>
          <button [matMenuTriggerFor]="groupingMenu" mat-menu-item>
            <i class="fa fa-list" aria-hidden="true"></i>
            Group by
          </button>
        </ng-container>

        <!--
        <span class="gem-table-menu-header">Einstellungen</span>
        <mat-divider></mat-divider>
        <button mat-menu-item [matMenuTriggerFor]="colSaveMenu">
          <i class="fa fa-save" aria-hidden="true"></i>
          Speichern
        </button>
        <button mat-menu-item [matMenuTriggerFor]="colLoadMenu">
          <i class="fa fa-cloud-download" aria-hidden="true"></i>
          Laden
        </button>
        -->
      </mat-menu>

      <!-- Submenu: Einstellungen > Laden -->

      <!--
      <mat-menu #colLoadMenu="matMenu">
        <button
          mat-menu-item
          (click)="loadSettings(TabellenIdentifierTypDTO.USER)"
        >
          Meine Einstellung
        </button>
        <button
          mat-menu-item
          (click)="loadSettings(TabellenIdentifierTypDTO.INSTITUT)"
        >
          Institutsstandard
        </button>
        <button
          mat-menu-item
          (click)="loadSettings(TabellenIdentifierTypDTO.DEFAULT)"
        >
          Werkseinstellungen
        </button>
      </mat-menu>
      -->

      <!-- Submenu: Einstellungen > Speichern -->

      <!--
      <mat-menu #colSaveMenu="matMenu">
        <button
          mat-menu-item
          (click)="storeSettings(TabellenIdentifierTypDTO.USER)"
        >
          Für mich
        </button>
        <button
          mat-menu-item
          disabled
          (click)="storeSettings(TabellenIdentifierTypDTO.INSTITUT)"
        >
          Für mein Institut
        </button>
      </mat-menu>
      -->

      <!-- Settings menu (end) -->
    </div>
    <!-- Right above the actual table (end) -->
  </div>

  <div [hidden]="!hasCustomSearch">
    <ng-container *ngTemplateOutlet="filterTemplate"></ng-container>
  </div>

  <!-- Elements above the actual table (end) -->

  <div class="mat-elevation-z2" [ngStyle]="tableContainerStyle">
    <table mat-table [dataSource]="rowData" #table class="gem-table">

      <!-- Left icons column (start) -->

      <ng-container
        *ngIf="hasIconsCol()"
        matColumnDef="iconsCol"
      >
        <th mat-header-cell *matHeaderCellDef class="gem-table-icons-col">
          <ng-container *ngIf="hasFilterHeader">
            <button
              (click)="expandSecondHeader()"
            >
              <!--mat-icon *ngIf="!expandedSecondHeader">expand_less</mat-icon>
              <mat-icon *ngIf="expandedSecondHeader">expand_more</mat-icon>
              <span class="search-icon material-icons"> search </span-->
              <i
                class="fa fa-search gem-table-column-filter-icon"
                aria-hidden="true"
              ></i>
            </button>
          </ng-container>
          <ng-container *ngIf="batchMode">
            <mat-checkbox
              (change)="$event ? masterToggleSelect($event) : null"
              [checked]="isAllSelected()"
              [indeterminate]="isSomeSelected()"
              [disableRipple]="true"
              class="selection-checkbox"
            >
            </mat-checkbox>
          </ng-container>
        </th>
        <td
          mat-cell
          *matCellDef="let row"
          (contextmenu)="
            onContextMenu($event, { model: row }, isInEditMode(row))
          "
        >
          <ng-container *ngIf="!batchMode">
            <!--
            <button
              *ngIf="editRowId == null && extendableRow(row) && canAddNextRow"
              (click)="addNextRow(row); focus(firstEditableColumn)"
              type="button"
              mat-icon-button
            >
              <mat-icon class="md-24">add_circle_outline</mat-icon>
            </button>
            -->

            <button
              *ngIf="
                (editRowId == null
                  && !staticRow(row)
                  && canDelete)
                || (alwaysEdit && canDelete)
              "
              (click)="deleteRow(row); focus(firstEditableColumn)"
              type="button"
              mat-icon-button
            >
              <mat-icon class="md-24">delete</mat-icon>
            </button>

            <button
              *ngIf="
                editRowId == null &&
                !staticRow(row) &&
                canUpdate &&
                !alwaysEdit
              "
              (click)="enableEditMode(row, firstEditableColumn)"
              type="button"
              mat-icon-button
            >
              <mat-icon class="md-24">edit</mat-icon>
            </button>

            <!-- TODO: general templates, not only on add -->
            <ng-container *ngIf="isInEditMode(row) && !alwaysEdit && canUpdate">
              <!-- Save Button-->
              <button
                (click)="save(row)"
                oncontextmenu="return false;"
                type="button"
                mat-icon-button
              >
                <mat-icon class="md-24">save</mat-icon>
              </button>

              <!-- Clear Button -->
              <button
                (click)="cancel(row)"
                oncontextmenu="return false;"
                type="button"
                mat-icon-button
              >
                <mat-icon class="md-24">clear</mat-icon>
              </button>
            </ng-container>
          </ng-container>
          <ng-container *ngIf="batchMode">
            <mat-checkbox
              (click)="$event.stopPropagation()"
              (change)="$event ? toggleSelect($event, row) : null"
              [checked]="row.gemSelected"
              [disableRipple]="true"
            >
            </mat-checkbox>
          </ng-container>
        </td>
        <!-- TODO: summary row -->
        <td mat-footer-cell *matFooterCellDef></td>
      </ng-container>

      <!-- Left icons column (end) -->

      <!-- Main columns (start) -->

      <ng-container
        *ngFor="let column of columns; trackBy: columnIdentifier"
        [matColumnDef]="column.id"
        [sticky]="column.frozenLeft"
        [stickyEnd]="column.frozenRight"
      >
        <th
          mat-header-cell
          *matHeaderCellDef
          draggable="true"
          (dragstart)="dragStart($event, column)"
          (drop)="drop($event, column)"
          (dragover)="dragOver($event, column)"
          [ngStyle]="column.width && { width: column.width }"
          [ngClass]="{
            resizable: column.resizable,
            draggable: column.id === draggedColumnId,
            hidden: isHiddenColumn(column)
          }"
        >
          <span
            (click)="sort(column)"
            class="datatable-header-cell-label"
            [innerHTML]="getColumnName(column)"
          >
          </span>
          <i *ngIf="column.isFiltered" class="fa fa-filter" aria-hidden="true">
          </i>
        </th>
        <!--table content-->
        <td
          mat-cell
          *matCellDef="let row"
          [ngStyle]="cellStyle(column, row)"
          [ngClass]="{ hidden: isHiddenColumn(column) }"
          (click)="enableEditMode(row, column)"
          (contextmenu)="
            onContextMenu(
              $event,
              { prop: column.prop, model: row, columns: columns },
              isInEditMode(row)
            )
          "
        >
          <ng-container *ngIf="alwaysEdit && column.editTemplate">
            <ng-template
              [ngTemplateOutlet]="column.editTemplate"
              [ngTemplateOutletContext]="{
                row: row,
                column: column,
                value: getCellValue(column, row)
              }"
            >
            </ng-template>
          </ng-container>
          <ng-container
            *ngIf="
              (!isInEditMode(row) && !alwaysEdit) ||
              (alwaysEdit && !column.editTemplate)
            "
          >
            <ng-container *ngIf="column.displayTemplate">
              <ng-template
                [ngTemplateOutlet]="column.displayTemplate"
                [ngTemplateOutletContext]="{
                  row: row,
                  column: column,
                  value: getCellValue(column, row)
                }"
              >
              </ng-template>
            </ng-container>
            <ng-container *ngIf="!column.displayTemplate">
              <div
                [attr.title]="column?.tooltip?.disabled ? null : getCellValue(column, row)"
                [innerHTML]="getCellValue(column, row)"
              ></div>
            </ng-container>
          </ng-container>
          <ng-container *ngIf="isInEditMode(row) && !alwaysEdit && canUpdate">
            <div
              [focusColumn]="{ handler: focusHandler, id: column.id }"
              (keydown.arrowup)="jumpCellUp($event, row, column)"
              (keydown.arrowdown)="jumpCellDown($event, row, column)"
              (keydown.Tab)="jumpCellForward($event, row, column)"
              (keydown.shift.Tab)="jumpCellBack($event, row, column)"
              (focusout)="onFocusOut(row)"
            >
              <ng-container *ngIf="column.editTemplate">
                <ng-template
                  [ngTemplateOutlet]="column.editTemplate"
                  [ngTemplateOutletContext]="{
                    row: row,
                    column: column,
                    value: getCellValue(column, row)
                  }"
                >
                </ng-template>
              </ng-container>
              <ng-container *ngIf="!column.editTemplate">
                <ng-container *ngIf="column.displayTemplate">
                  <ng-template
                    [ngTemplateOutlet]="column.displayTemplate"
                    [ngTemplateOutletContext]="{
                      row: row,
                      column: column,
                      value: getCellValue(column, row)
                    }"
                  >
                  </ng-template>
                </ng-container>
                <ng-container *ngIf="!column.displayTemplate">
                  <div
                    [attr.title]="column?.tooltip?.disabled ? null : getCellValue(column, row)"
                    [innerHTML]="getCellValue(column, row)"
                  ></div>
                </ng-container>
              </ng-container>
            </div>
          </ng-container>
        </td>
        <!--
          <td mat-cell *matCellDef="let row" class="datatable-body-cell" [ngClass]="{'hidden': isHiddenColumn(column)}">
          </td>
        -->
        <!-- TODO: summary row -->

        <td
          mat-footer-cell
          *matFooterCellDef
          [ngClass]="{ hidden: isHiddenColumn(column) }"
        >
          <ng-container *ngIf="column?.footer?.template">
            <ng-template [ngTemplateOutlet]="column.footer.template">
            </ng-template>
          </ng-container>
          <ng-container *ngIf="column?.footer?.value">
            {{ column.footer.value }}
          </ng-container>
        </td>
      </ng-container>

      <!-- Main columns (end) -->

      <!-- TODO: second level of header -->
      <!--
      <ng-container *ngIf="selectable" matColumnDef="selectgroup" sticky>
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef></td>
      </ng-container>
      <ng-container *ngFor="let column of columns; trackBy: columnIdentifier" [matColumnDef]="column.id + 'group2'" [sticky]="column.frozenLeft"
        [stickyEnd]="column.frozenRight">
        <th mat-header-cell *matHeaderCellDef [ngClass]="{'hidden': isHiddenColumn(column)}">
          <button (click)="group(column.prop)">Group</button>
          <button (click)="toggleHideColumn(column.prop)">Hide</button>
        </th>
      </ng-container>
      -->

      <!-- First creation row (start) -->

      <!-- TODO: could be a problem if selectable enabled -->
      <ng-container *ngIf="canCreate">
        <ng-container *ngIf="selectable" matColumnDef="selectgroup" sticky>
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef></td>
        </ng-container>
        <ng-container
          *ngFor="let column of columns; trackBy: columnIdentifier"
          [matColumnDef]="column.id + 'addNew'"
          [sticky]="column.frozenLeft"
          [stickyEnd]="column.frozenRight"
        >
          <th
            mat-header-cell
            *matHeaderCellDef
            [ngClass]="{ hidden: isHiddenColumn(column) }"
            (focusin)="focusAddNew()"
            (focusout)="unfocusAddNew()"
          >
            <ng-container *ngIf="editRowId == null || alwaysEdit">
              <ng-template
                [ngTemplateOutlet]="column.editTemplate"
                [ngTemplateOutletContext]="{
                  row: createDummy,
                  column: column,
                  value: getCellValue(column, createDummy)
                }"
              >
              </ng-template>
            </ng-container>
            <ng-container *ngIf="editRowId != null && !alwaysEdit">
              <div class="gem-table-create-hidden">
                <ng-template
                  [ngTemplateOutlet]="column.editTemplate"
                  [ngTemplateOutletContext]="{
                    row: createDummy,
                    column: column,
                    value: getCellValue(column, createDummy)
                  }"
                >
                </ng-template>
              </div>
            </ng-container>
          </th>
        </ng-container>
      </ng-container>

      <!-- First creation row (end) -->

      <!-- Filter header -->
      <ng-container
        *ngIf="expandedSecondHeader && hasFilterHeader"
        matColumnDef="iconsColfilter"
      >
        <th mat-header-cell *matHeaderCellDef class="gem-table-icons-col">
          <button
            oncontextmenu="return false;"
            type="button"
            mat-icon-button
            class="cancel action-button"
            (click)="resetFilters()"
          >
            <span class="material-icons">delete_forever</span>
          </button>
        </th>
        <td mat-cell *matCellDef="let row"></td>
      </ng-container>

      <!-- Filter header -->
      <ng-container *ngIf="expandedSecondHeader && hasFilterHeader">
        <ng-container
          *ngFor="let column of columns; trackBy: columnIdentifier"
          [matColumnDef]="column.id + 'filter'"
          [sticky]="column.frozenLeft"
          [stickyEnd]="column.frozenRight"
        >
          <th
            mat-header-cell
            *matHeaderCellDef
            class="datatable-body-cell add-new-row-cell"
            [ngClass]="{ hidden: isHiddenColumn(column) }"
          >
            <div>
              <!--
              <macoco-expanded-search
                [reset]="clearFilters"
                [signOptions]="false"
                [filterType]="column.type"
                (addInput)="filterColumn($event, column)"
              >
              </macoco-expanded-search>
              -->

              <ng-container *ngIf="column.type == 1 || column.type == 2">
                <button
                  mat-icon-button
                  aria-label="Example icon-button with a menu"
                  [matMenuTriggerFor]="signFilter"
                  class="filter-button"
                >
                  <i class="fa fa-filter icon" aria-hidden="true"> </i>
                </button>
              </ng-container>
            </div>

            <mat-menu #signFilter [overlapTrigger]="false">
              <!--
              <macoco-expanded-search
                [reset]="clearFilters"
                [signOptions]="true"
                [filterType]="column.type"
                (addInput)="filterColumn($event, column)"
              >
              </macoco-expanded-search>
              -->
            </mat-menu>
          </th>
        </ng-container>
      </ng-container>
      <!-- TODO: second level of header -->
      <!-- <tr mat-header-row *matHeaderRowDef="groupColumnIds2; sticky: true;"></tr> -->

      <!-- TODO: experimental, remove or integrate -->
      <!-- <tr mat-row *matRowDef="let row; columns: groupColumnIds; when: isGroup" (click)="groupHeaderClick(row)"> </tr> -->
      <tr
        mat-row
        *matRowDef="let group; columns: groupColumnIds; when: isGroup"
        (click)="toggleGroupExpand(group)"
        class="group-header"
        [ngStyle]="getGroupStyle(group)"
        [title]="getGroupTooltip(group)"
      ></tr>
      <!-- TODO: two level group header, problems with spawning second row -->
      <!-- <tr mat-row *matRowDef=" let row; columns: ['groupHeader']; when: isGroup;"
        (click)="toggleGroupExpand(row)"></tr> -->

      <tr mat-header-row *matHeaderRowDef="columnIds; sticky: true"></tr>
      <ng-container *ngIf="canCreate">
        <tr
          mat-header-row
          *matHeaderRowDef="addNewColumnIds; sticky: true"
          [ngClass]="{
            hidden: !alwaysEdit && editRowId != null
          }"
          class="add-new-row"
        ></tr>
      </ng-container>
      <!-- Filter header -->
      <ng-container *ngIf="expandedSecondHeader && hasFilterHeader">
        <tr
          mat-header-row
          *matHeaderRowDef="filterColumnIds; sticky: false"
          [ngClass]="{ hidden: !expandedSecondHeader && hasFilterHeader }"
          class="add-new-row"
        ></tr>
      </ng-container>
      <tr
        mat-row
        *matRowDef="let row; columns: columnIds"
        [ngStyle]="getCellStyle(row)"
        draggable="true"
        (dragstart)="onDragStart($event, row)"
      ></tr>
        <!--(click)="selection?.toggle(row)"-->

      <!-- TODO: summary row -->
      <ng-container *ngIf="hasColumnFooter">
        <tr mat-footer-row *matFooterRowDef="columnIds; sticky: true"></tr>
      </ng-container>

      <!-- Group header -->
      <!-- TODO: two level group header, problems with spawning second row -->
      <!--
      <ng-container matColumnDef="groupHeader">
        <td mat-cell *matCellDef="let group" class="group-header" [ngStyle]="{'padding-left': 2*group.level + '%'}">
          <mat-icon *ngIf="group.expanded">expand_less</mat-icon>
          <mat-icon *ngIf="!group.expanded">expand_more</mat-icon>
          <strong>
            {{getCellValue(groupColumns[group.level-1], group.props[groupColumnProps[group.level-1]])}}
          </strong>
        </td>
      </ng-container>
      -->

      <ng-container
        *ngIf="hasIconsCol()"
        matColumnDef="iconsColgroup"
      >
        <th mat-header-cell *matHeaderCellDef class="gem-table-icons-col"></th>
        <td mat-cell *matCellDef="let row"></td>
      </ng-container>

      <ng-container *ngIf="canCreate" matColumnDef="iconsColaddNew">
        <th mat-header-cell *matHeaderCellDef class="gem-table-icons-col">
          <div [ngClass]="{ 'gem-table-create-hidden': editRowId != null && !alwaysEdit }">
            <button
              name="saveNewButton"
              (click)="createRow()"
              oncontextmenu="return false;"
              type="button"
              mat-icon-button
              class="save action-button"
            >
              <mat-icon class="md-24">save</mat-icon>
            </button>
            <button
              (click)="cancelCreateRow()"
              oncontextmenu="return false;"
              type="button"
              mat-icon-button
              class="cancel action-button"
            >
              <mat-icon class="md-24">clear</mat-icon>
            </button>
          </div>
        </th>
        <td mat-cell *matCellDef="let row"></td>
      </ng-container>

      <!--              Wochen und Monaten-->
      <ng-container
        *ngFor="let column of columns; trackBy: columnIdentifier"
        [matColumnDef]="column.id + 'group'"
      >
        <td
          mat-cell
          *matCellDef="let group"
          (click)="closeContextMenu()"
          (contextmenu)="
            onContextMenu(
              $event,
              { prop: column.prop, model: group, columns: columns },
              false
            )
          "
        >
          <ng-container *ngIf="isGroupedByColumn(column)">
            <mat-icon *ngIf="group.expanded">expand_less</mat-icon>
            <mat-icon *ngIf="!group.expanded">expand_more</mat-icon>
            <strong *ngIf="group.extension">
              <!--              Wochen und Monaten-->
              {{ group.extension.title }}
            </strong>
            <strong *ngIf="!group.extension">
              <!--    Datum-->
              {{ group.props[groupColumnProps[group.level - 1]] }}
            </strong>
          </ng-container>
          <ng-container *ngIf="column.summarize">
            <!--         Stunden-->
            <span>{{ group.summary[column.prop] }}</span>
          </ng-container>
        </td>
      </ng-container>
    </table>
    <ng-container *ngIf="footerTemplate">
      <ng-template [ngTemplateOutlet]="footerTemplate"> </ng-template>
    </ng-container>
  </div>
</div>
