<div class="gem-table-border" >
  <table class="gem-table-style">
    <thead>
    <ng-container *ngFor="let header of headers">
      <ng-container *ngTemplateOutlet="header"></ng-container>
    </ng-container>
    </thead>
    <tbody>
    <ng-container *ngFor="let b of body">
      <ng-container *ngTemplateOutlet="b"></ng-container>
    </ng-container>
    </tbody>
  </table>
</div>
