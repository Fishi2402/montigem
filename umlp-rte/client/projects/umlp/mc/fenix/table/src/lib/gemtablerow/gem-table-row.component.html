<ng-template #tableRowTemplate>
  <tr class="gem-table-row">
    <ng-container *ngFor="let c of content">
      <ng-container *ngIf="cells != null; else tableRowCols">
        <ng-container *ngTemplateOutlet="c"></ng-container>
      </ng-container>
      <ng-template #tableRowCols>
        <td class="gem-table-cell">
          <ng-container *ngTemplateOutlet="c"></ng-container>
        </td>
      </ng-template>
    </ng-container>
  </tr>
</ng-template>
