plugins {
  /*
  id 'java'
  id 'maven-publish'
  id "de.rwth.se.montigem-frontend"
  /**/
  id 'de.rwth.se.montigem-module-frontend' // create domainSymbols-jar
}

configure(mglib) {
  libs.addAll(
      project(":umlp-rte:frontend:arrange"),
      project(":umlp-rte:frontend:basic"),
      project(":umlp-rte:frontend:charts"),
      project(":umlp-rte:frontend:common"),
      project(":umlp-rte:frontend:commonj2ts"),
      project(":umlp-rte:frontend:editor"),
      project(":umlp-rte:frontend:fischertechnik"),
      project(":umlp-rte:frontend:functiondisplay"),
      project(":umlp-rte:frontend:input"),
      project(":umlp-rte:frontend:navigation"),
      project(":umlp-rte:frontend:networkgraph"),
      project(":umlp-rte:frontend:table"),
      project(":umlp-rte:frontend:theme")
  )
  libScope = "@umlp"
}

project(":umlp-rte:frontend").afterEvaluate {
  def arrange = project(":umlp-rte:frontend:arrange").tasks.named("buildLib")
  def basic = project(":umlp-rte:frontend:basic").tasks.named("buildLib")
  def charts = project(":umlp-rte:frontend:charts").tasks.named("buildLib")
  def common = project(":umlp-rte:frontend:common").tasks.named("buildLib")
  def commonj2ts = project(":umlp-rte:frontend:commonj2ts").tasks.named("buildLib")
  def editor = project(":umlp-rte:frontend:editor").tasks.named("buildLib")
  def input = project(":umlp-rte:frontend:input").tasks.named("buildLib")
  def networkgraph = project(":umlp-rte:frontend:networkgraph").tasks.named("buildLib")

  def aNeedsB = { TaskProvider a, TaskProvider b ->
    a.configure { t ->
      t.inputs.files(b.map { it.outputs.files.singleFile })
      t.dependsOn(b)
    }
  }

  aNeedsB(basic, common)
  aNeedsB(basic, commonj2ts)
  aNeedsB(arrange, common)
  aNeedsB(charts, commonj2ts)
  aNeedsB(input, commonj2ts)
  aNeedsB(networkgraph, commonj2ts)
  aNeedsB(editor, commonj2ts)
}

