<svg viewBox="0 0 1388 1057" xmlns="http://www.w3.org/2000/svg" fill="none">

  <style>
    :root {
      /* Sensors */
      --lightBarrierOvenOpacity: 0;
      --refSwitchFeederInsideOpacity: 0;
      --refSwitchFeederOutsideOpacity: 0;
      --refSwitchVacuumAtOvenOpacity: 0;
      --refSwitchVacuumAtTurnTableOpacity: 0;
      --enableSawOpacity: 0;
      --refSwitchTurnTableAtVacuumOpacity: 0;
      --refSwitchTurnTableAtBeltOpacity: 0;
      --refSwitchTurnTableAtSawOpacity: 0;
      --lightBarrierConveyorEndOpacity: 0;

      /* Actuators */
      --enableOvenLightOpacity: 0;
      --enableValveMoveOvenDoorOpacity: 0;
      --moveOvenFeederExtendOpacity: 0;
      --moveOvenFeederRetractOpacity: 0;
      --enableCompressorOpacity: 0;
      --enableValveVacuumOpacity: 0;
      --enableValveMoveVacuumOpacity: 0;
      --moveVacuumToOvenOpacity: 0;
      --moveVacuumToTurnTableOpacity: 0;
      --moveTurnTableClockwiseOpacity: 0;
      --moveTurnTableCounterclockwiseOpacity: 0;
      --enableValveMoveFeederOpacity: 0;
      --moveConveyorForwardOpacity: 0;
    }

    .indicator-circle {
      fill: #e09400;
    }

    .indicator-overlay {
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    .arrow-outline {
      stroke: white;
      stroke-width: 1.5;
      fill: none;
      stroke-opacity: 0.5;
    }

    .text-label {
      font-family: sans-serif;
      font-size: 18.8104px;
      text-align: center;
      text-anchor: middle;
      fill: white;
    }

    .text-label-small {
      font-family: sans-serif;
      font-size: 13px;
      text-anchor: start;
      fill: white;
    }

    .text-label-small-center {
      font-family: sans-serif;
      font-size: 13px;
      text-anchor: middle;
      fill: white;
    }

    .text-label-small-end {
      font-family: sans-serif;
      font-size: 13px;
      text-anchor: end;
      fill: white;
    }
  </style>

  <defs>
    <linearGradient id="bgGradient" x1="694.364" y1="-168.495" x2="694.364" y2="1384.13" gradientUnits="userSpaceOnUse">
      <stop stop-color="#72757D" offset="0"/>
      <stop offset="1" stop-color="#0B090C"/>
    </linearGradient>

    <!-- Reusable indicator overlay (circle with X) -->
    <g id="xIndicator">
      <circle cx="0" cy="0" r="13.5" class="indicator-overlay"/>
      <line x1="-10.207" y1="9.832" x2="9.832" y2="-10.207" class="indicator-overlay"/>
      <line x1="-9.793" y1="-10.207" x2="10.247" y2="9.832" class="indicator-overlay"/>
    </g>

    <!-- Reusable arrow shapes -->
    <path id="arrowRightShape" d="M -15,-4 h 20 v -5 l 12,9 l -12,9 v -5 h -20 z"/>
    <path id="arrowLeftShape" d="M 15,-4 h -20 v -5 l -12,9 l 12,9 v -5 h 20 z"/>
    <path id="arrowDownShape" d="M -4,-15 v 20 h -5 l 9,12 l 9,-12 h -5 v -20 z"/>
    <path id="curvedArrowShape" d="M 94,-34 A 100,100 0 0,1 97,26 L 101,28 L 88,40 L 87,21 L 90,24 A 93,93 0 0,0 87,-32 Z"/>
  </defs>

  <!-- Background -->
  <rect width="1388" height="1057" fill="url(#bgGradient)"/>

  <!-- ------- Machine Graphics ------- -->
  <g id="model">

    <!-- Feeder tubes -->
    <path d="m 446.805,139.335 c -12.39,0 -24.832,-0.364 -37.214,0 -11.457,0.337 -20.157,18.032 -20.157,27.825 0,9.811 -1.051,20.621 -5.513,29.547 -3.86,7.718 -10.958,12.596 -17.66,17.831 -3.823,2.988 -20.806,17.406 -20.243,16.282"

    <path d="m 478.933,136.271 c -1.245,-5.605 -19.361,-8.2 -23.806,-9.041 -14.839,-2.808 -29.801,-5.675 -44.967,-5.675 -6.983,0 -17.296,5.048 -19.718,12.312 -3.364,10.091 -1.539,22.58 -1.539,33.088 0,6.701 1.146,15.536 -2.116,21.593 -2.721,5.054 -3.853,12.723 -8.704,16.496 -5.003,3.891 -10.225,7.392 -14.861,11.927 -3.857,3.773 -9.979,7.655 -15.005,9.33"

    <path d="m 449,224 c 2.761,0 5,2.239 5,5 V 383 H 382 V 224 Z" fill="#1a2437"/>
    <path d="M 285,224 V 383 H 213 V 229 c 0,-2.761 2.239,-5 5,-5 z" fill="#1a2437"/>

    <path d="m 213,322 c 0,-2.761 2.239,-5 5,-5 h 227 c 2.761,0 5,2.239 5,5 v 65 H 213 Z" fill="#1a2437"/>

      <path d="m 305,310 h 57 v 6 h -57 z"/>
      <rect x="476" y="366.838" width="6" height="6"/>

      <path d="m 450,142.838 h -10 v -6 h 10 z"/>
      <path d="m 517,142.838 h -10 v -6 h 10 z"/>

      <path d="m 756,319 c 1.657,0 3,1.343 3,3 v 62 h -20 v -62 c 0,-1.657 1.343,-3 3,-3 z"/>
    </g>

      <path d="m 602,360.838 c 0,-1.657 1.343,-3 3,-3 h 10 c 1.657,0 3,1.343 3,3 v 67 c 0,1.657 -1.343,3 -3,3 h -10 c -1.657,0 -3,-1.343 -3,-3 z"/>

    </g>

      <path d="m 682,348 h 57 v 6 h -57 z"/>
      <path d="m 682,359 h 57 v 6 h -57 z"/>
      <path d="m 682,370 h 57 v 6 h -57 z"/>
    </g>

    <!-- Conveyor base and column -->
    <rect x="1168" y="924" width="145" height="257" rx="5"
          transform="rotate(180,1168,924)" fill="#1a2437"/>
    <path d="m 1125,667 c 1.1,0 2,0.8954 2,2 v 255 h -33 V 669 c 0,-1.1046 0.9,-2 2,-2 z" fill="#87acbc"/>
    <path d="m 1079,924 v -21 c 0,-1.105 0.9,-2 2,-2 h 13 c 1.1,0 2,0.895 2,2 v 21 z" fill="#ffffff"/>

    <!-- Turntable -->
    <rect x="423.329" y="942" width="241" height="208" rx="5"
          transform="rotate(180,423.329,942)" fill="#1a2437"/>
    <ellipse cx="302.829" cy="838" rx="88.5" ry="88" fill="#ffffff"/>

      <path d="m 294.329,875 v -77 h 19 v 77 z"/>

    <path d="m 290.329,798 c -1.657,0 -3,-1.343 -3,-3 v -38 c 0,-1.657 1.343,-3 3,-3 h 27 c 1.656,0 3,1.343 3,3 v 38 c 0,1.657 -1.344,3 -3,3 z"

    <path d="M 372,297.08 V 280 c 0,-1.105 0.895,-2 2,-2 h 10.133 c 1.105,0 2,0.895 2,2 v 17.08 z" fill="#ffffff"/>

    <path d="m 1042,193 c 1.1,0 2,0.895 2,2 v 48 h -12 v -48 c 0,-1.105 0.9,-2 2,-2 z" fill="#ebebeb"/>
    <path d="m 1045,243 c 1.66,0 3,1.343 3,3 v 20 c 0,1.657 -1.34,3 -3,3 h -13 c -1.66,0 -3,-1.343 -3,-3 v -20 c 0,-1.657 1.34,-3 3,-3 z"
          fill="#0070e0"/>
  </g>

  <!-- ------- Arrow Outlines ------- -->
  <g id="arrowOutlines">
    <!-- Oven feeder -->
    <use href="#arrowLeftShape" transform="translate(285, 235) rotate(-33)" class="arrow-outline"/>
    <use href="#arrowRightShape" transform="translate(370, 178) rotate(-33)" class="arrow-outline"/>

    <!-- Gripper vertical -->
    <use href="#arrowDownShape" transform="translate(530, 120)" class="arrow-outline"/>

    <!-- Vacuum horizontal -->
    <use href="#arrowLeftShape" transform="translate(360, 440)" class="arrow-outline"/>
    <use href="#arrowRightShape" transform="translate(520, 440)" class="arrow-outline"/>

    <!-- Turntable rotation -->
    <use href="#curvedArrowShape" transform="translate(313, 838)" class="arrow-outline"/>
    <use href="#curvedArrowShape" transform="translate(292, 838) scale(-1, 1)" class="arrow-outline"/>

    <!-- Turntable pusher -->
    <use href="#arrowDownShape" transform="translate(455, 800)" class="arrow-outline"/>

    <!-- Conveyor -->
    <use href="#arrowDownShape" transform="translate(978, 790) scale(1.2)" class="arrow-outline"/>
  </g>

  <!-- ------- Status Indicators ------- -->
  <g id="statusIndicators">
    <!-- Oven light barrier -->
    <circle cx="264.278" cy="296.245" r="13" class="indicator-circle"
            style="opacity: var(--lightBarrierOvenOpacity, 0);"/>
    <!-- Oven light -->
    <circle cx="100" cy="238" r="13" class="indicator-circle"
            style="opacity: var(--enableOvenLightOpacity, 0);"/>
    <!-- Oven door -->
    <circle cx="100" cy="348" r="13" class="indicator-circle"
            style="opacity: var(--enableValveMoveOvenDoorOpacity, 0);"/>

    <!-- Feeder inside -->
    <circle cx="355" cy="138" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchFeederInsideOpacity, 0);"/>
    <!-- Feeder outside -->
    <circle cx="270" cy="195" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchFeederOutsideOpacity, 0);"/>

    <!-- Compressor -->
    <circle cx="100" cy="470" r="13" class="indicator-circle"
            style="opacity: var(--enableCompressorOpacity, 0);"/>
    <!-- Vacuum valve -->
    <circle cx="440" cy="440" r="13" class="indicator-circle"
            style="opacity: var(--enableValveVacuumOpacity, 0);"/>
    <!-- Vacuum at oven -->
    <circle cx="279" cy="440" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchVacuumAtOvenOpacity, 0);"/>
    <!-- Vacuum at turntable -->
    <circle cx="602" cy="440" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchVacuumAtTurnTableOpacity, 0);"/>

    <!-- Saw -->
    <circle cx="1040" cy="346" r="13" class="indicator-circle"
            style="opacity: var(--enableSawOpacity, 0);"/>

    <!-- Turntable at vacuum -->
    <circle cx="303" cy="690" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchTurnTableAtVacuumOpacity, 0);"/>
    <!-- Turntable at belt -->
    <circle cx="430" cy="955" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchTurnTableAtBeltOpacity, 0);"/>
    <!-- Turntable at saw -->
    <circle cx="175" cy="955" r="13" class="indicator-circle"
            style="opacity: var(--refSwitchTurnTableAtSawOpacity, 0);"/>

    <!-- Conveyor light barrier -->
    <circle cx="978.344" cy="917.224" r="13" class="indicator-circle"
            style="opacity: var(--lightBarrierConveyorEndOpacity, 0);"/>
  </g>

  <!-- ------- Indicator Overlays ------- -->
  <g id="indicatorOverlays">
    <!-- Oven -->
    <use href="#xIndicator" transform="translate(264.278, 296.245)"/>
    <use href="#xIndicator" transform="translate(100, 238)"/>
    <use href="#xIndicator" transform="translate(100, 348)"/>

    <!-- Feeder -->
    <use href="#xIndicator" transform="translate(355, 138)"/>
    <use href="#xIndicator" transform="translate(270, 195)"/>

    <!-- Gripper / Vacuum -->
    <use href="#xIndicator" transform="translate(100, 470)"/>
    <use href="#xIndicator" transform="translate(440, 440)"/>
    <use href="#xIndicator" transform="translate(279, 440)"/>
    <use href="#xIndicator" transform="translate(602, 440)"/>

    <!-- Saw -->
    <use href="#xIndicator" transform="translate(1040, 346)"/>

    <!-- Turntable -->
    <use href="#xIndicator" transform="translate(303, 690)"/>
    <use href="#xIndicator" transform="translate(430, 955)"/>
    <use href="#xIndicator" transform="translate(175, 955)"/>

    <!-- Conveyor -->
    <use href="#xIndicator" transform="translate(978.344, 917.224)"/>
  </g>

  <!-- ------- Arrow Indicators ------- -->
  <g id="arrowIndicators">
    <!-- Oven feeder extend -->
    <g style="opacity: var(--moveOvenFeederExtendOpacity, 0);">
      <use href="#arrowLeftShape" transform="translate(285, 235) rotate(-33)" fill="#e09400"/>
    </g>
    <!-- Oven feeder retract -->
    <g style="opacity: var(--moveOvenFeederRetractOpacity, 0);">
      <use href="#arrowRightShape" transform="translate(370, 178) rotate(-33)" fill="#e09400"/>
    </g>

    <!-- Gripper vertical -->
    <g style="opacity: var(--enableValveMoveVacuumOpacity, 0);">
      <use href="#arrowDownShape" transform="translate(530, 120)" fill="#e09400"/>
    </g>

    <!-- Vacuum to oven -->
    <g style="opacity: var(--moveVacuumToOvenOpacity, 0);">
      <use href="#arrowLeftShape" transform="translate(360, 440)" fill="#e09400"/>
    </g>
    <!-- Vacuum to turntable -->
    <g style="opacity: var(--moveVacuumToTurnTableOpacity, 0);">
      <use href="#arrowRightShape" transform="translate(520, 440)" fill="#e09400"/>

    <!-- Turntable clockwise -->

      <use href="#curvedArrowShape" transform="translate(313, 838)" fill="#e09400"/>
    </g>
    <!-- Turntable counter-clockwise -->
    <g style="opacity: var(--moveTurnTableCounterclockwiseOpacity, 0);">
      <use href="#curvedArrowShape" transform="translate(292, 838) scale(-1, 1)" fill="#e09400"/>
    </g>
    <!-- Turntable pusher -->
    <g style="opacity: var(--enableValveMoveFeederOpacity, 0);">
      <use href="#arrowDownShape" transform="translate(455, 800)" fill="#e09400"/>
    </g>

    <!-- Conveyor forward -->
    <g style="opacity: var(--moveConveyorForwardOpacity, 0);">
      <use href="#arrowDownShape" transform="translate(978, 790) scale(1.2)" fill="#e09400"/>
    </g>
  </g>

  <!-- ------- Labels ------- -->

      <text x="1100" y="176">Säge</text>
      <text x="290" y="650">Drehtisch</text>
      <text x="1100" y="650">Förderband</text>

    <text class="text-label-small" x="120" y="353">Ofentür</text>

    <text class="text-label-small" x="230" y="465">am Ofen</text>
    <text class="text-label-small" x="618" y="465">am Drehtisch</text>
    <text class="text-label-small-center" x="440" y="470">Greifer an</text>
    <text class="text-label-small" x="120" y="475">Pumpe läuft</text>

    <!-- Saw -->

    <!-- Turntable -->
    <text class="text-label-small" x="323" y="695">bei Vakuum</text>
    <text class="text-label-small" x="450" y="960">bei Band</text>
    <text class="text-label-small-end" x="158" y="960">bei Säge</text>
    <text class="text-label-small" x="475" y="805">Schieber</text>

    <!-- Conveyor -->
