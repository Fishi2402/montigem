<svg
  width="578"
  height="360"
  viewBox="0 0 578 360"
  id="svg229"
  xmlns="http://www.w3.org/2000/svg"
>
  <style id="style1">
    :root {
      /* Activity indicators */
      --pumpIndicatorOpacity: 0;
      --pusherIndicator1Opacity: 0;
      --pusherIndicator2Opacity: 0;
      --pusherIndicator3Opacity: 0;
      --beltIndicatorOpacity: 0;

      /* Barrier indicators */
      --barrierIndicator1Opacity: 0;
      --barrierIndicator2Opacity: 0;
      --barrierIndicator3Opacity: 0;
      --barrierIndicatorFeed1Opacity: 0;
      --barrierIndicatorFeed2Opacity: 0;

      /* Color indicators */
      --colorIndicator: white;
    }
  </style>
  <defs>
    <linearGradient
      id="bgGradient"
      x1="289.151"
      y1="-68.545898"
      x2="289.151"
      y2="563.07898"
      gradientUnits="userSpaceOnUse"
      gradientTransform="scale(1,0.82997875)">
      <stop stop-color="#72757D" offset=""/>
      <stop offset="1" stop-color="#0B090C"/>
    </linearGradient>

    <!-- Reusable activity indicator overlay -->
    <g id="activityIndicator" style="stroke: #ffffff; stroke-width: 2; fill: none;">
      <circle cx="176.5" cy="83.5" r="13.5"/>
      <line x1="166.293" y1="93.332298" x2="186.332" y2="73.2929"/>
      <line x1="166.707" y1="73.2929" x2="186.74699" y2="93.332298"/>
    </g>
  </defs>

  <rect width="578" height="360" fill="url(#bgGradient)" id="bg"/>

  <!-- Status Indicators -->
  <g id="statusIndicators">
    <!-- Pusher indicators -->
    <circle cx="176" cy="279" r="13" class="indicator-circle" style="fill: #e09400; opacity: var(--pusherIndicator1Opacity, 1);" id="pusherIndicator1"/>
    <circle cx="141" cy="279" r="13" class="indicator-circle" style="fill: #e09400; opacity: var(--pusherIndicator2Opacity, 1);" id="pusherIndicator2"/>
    <circle cx="102" cy="279" r="13" class="indicator-circle" style="fill: #e09400; opacity: var(--pusherIndicator3Opacity, 1);" id="pusherIndicator3"/>

    <!-- Barrier indicators -->
    <circle cx="325" cy="97" r="13" class="indicator-circle" style="fill: #e09400; opacity: var(--barrierIndicatorFeed1Opacity, 1);" id="barrierIndicatorFeed1" />
    <circle cx="229" cy=97 r="13" class="indicator-circle" style="fill: #e09400; opacity: var(--barrierIndicatorFeed2Opacity, 1);" id="barrierIndicatorFeed2"/>
    <circle cx="176" cy="83" r="13" style="fill: #e09400; opacity: var(--barrierIndicator1Opacity, 1);" class="indicator-circle" id="barrierIndicator1"/>
    <circle cx="141" cy="83" r="13" style="fill: #e09400; opacity: var(--barrierIndicator2Opacity, 1);" class="indicator-circle" id="barrierIndicator2"/>
    <circle cx="102" cy="83" r="13" style="fill: #e09400; opacity: var(--barrierIndicator3Opacity, 1);" class="indicator-circle" id="barrierIndicator3"/>

    <!-- Pump and color indicators -->
    <circle cx="472" cy="75" r="13" class="indicator-circle" style="fill: #e09400; opacity: var(--pumpIndicatorOpacity, 1);" id="pumpIndicator"/>
    <circle cx="472" cy="165.173" r="15" class="indicator-circle" style="fill: var(--colorIndicator, white);" id="colorIndicator"/>

    <!-- Belt indicator -->
    <path
      style="fill: #e09400; opacity: var(--beltIndicatorOpacity, 1);"
      id="beltIndicator"
      d="m 473.3125,246.69336 -17.61914,10.09961 -17.5039,10.29883 17.55664,10.20898 17.66992,10.00782 0.043,-13.40039 h 34.57226 v -13.81446 h -34.60745 z"
    />
  </g>

  <!-- Main Graphic -->
  <g id="graphic">
    <g id="centerGraphic">
      <rect x="73" y="123" height="122" width="263" rx="5" fill="#1a2437"/>
      <path d="M 336,198 H 73 v -28 h 263 z" fill="#87acbc"/>
      <path d="m 218,160 c 0,-1.105 0.895,-2 2,-2 h 116 v 52 H 220 c -1.105,0 -2,-0.895 -2,-2 z" fill="#0070e0"/>

      <!-- Vertical bars -->
      <g style="fill:#ebebeb">
        <rect x="167" y="123" width="20" height="47"/>
        <rect x="131" y="123" width="20" height="47"/>
        <rect x="95" y="123" width="20" height="47"/>
        <rect x="101" y="212" width="8" height="33"/>
        <rect x="137" y="212" width="8" height="33"/>
        <rect x="173" y="212" width="8" height="33"/>
      </g>

      <!-- Blue connectors -->
      <g style="fill:#0070e0;">
        <path d="m 101,212.08 c -1.6569,0 -3,-1.343 -3,-3 V 196 c 0,-1.657 1.3431,-3 3,-3 h 8.133 c 1.657,0 3,1.343 3,3 v 13.08 c 0,1.657 -1.343,3 -3,3 z"/>
        <path d="m 137,212.08 c -1.657,0 -3,-1.343 -3,-3 V 196 c 0,-1.657 1.343,-3 3,-3 h 8.133 c 1.657,0 3,1.343 3,3 v 13.08 c 0,1.657 -1.343,3 -3,3 z"/>
        <path d="m 173,212.08 c -1.657,0 -3,-1.343 -3,-3 V 196 c 0,-1.657 1.343,-3 3,-3 h 8.133 c 1.657,0 3,1.343 3,3 v 13.08 c 0,1.657 -1.343,3 -3,3 z"/>
      </g>

      <!-- Example stones -->
      <circle cx="104.5" cy="157.5" r="7.5" fill="blue" stroke="black"/>
      <circle cx="104.5" cy="134.5" r="7.5" fill="blue" stroke="black"/>
      <circle cx="140.5" cy="158.5" r="7.5" fill="red" stroke="black"/>
      <circle cx="176.5" cy="168.5" r="7.5" fill="white" stroke="black"/>
    </g>

    <!-- Belt indicator overlay -->
    <path
      id="beltIndicatorOverlay"
      style="stroke: #ffffff; stroke-width: 2; fill: none;"
      d="m 473.47082,246.90786 -17.61914,10.09961 -17.5039,10.29883 17.55664,10.20898 17.66992,10.00782 0.043,-13.40039 h 34.57226 v -13.81446 h -34.60745 z"
    />

    <!-- Activity indicator overlays using the reusable def -->
    <use href="#activityIndicator" />
    <use href="#activityIndicator" transform="translate(-35,0)"/>
    <use href="#activityIndicator" transform="translate(-75,0)"/>
    <use href="#activityIndicator" transform="translate(53,14)" />
    <use href="#activityIndicator" transform="translate(148,14)"/>
    <use href="#activityIndicator" transform="translate(296,-9)" />
    <use href="#activityIndicator" transform="translate(0,196)"/>
    <use href="#activityIndicator" transform="translate(-35,196)"/>
    <use href="#activityIndicator" transform="translate(-75,196)"/>

    <!-- Text labels -->
    <g id="text" style="font-family: Arial, sans-serif; font-size: 19.5803px; text-align: center; text-anchor: middle; fill: #ffffff;">
      <text x="140.34" y="40.22">Lichtschranke aktiv</text>
      <text x="149.77" y="315.39">Schieber aktiv</text>
      <text x="472.02" y="39.67">Pumpe läuft</text>
      <text x="474.04" y="132.19">Erkannte Farbe</text>
      <text x="471.44" y="223.99">Laufband läuft</text>
    </g>
  </g>
</svg>
