<div id="box" [class.gem-vertical-range-box]="vertical" >
  <label
    #titleLabel
    [class.gem-vertical-range-label]="vertical"
    class="gem-range-label"
    [for]="id + 'Range'"
  >
    {{ labelText }}
  </label>
  <div [class.gem-rotated-wrapper]="vertical"
       [style.margin-bottom]="sliderBottomLength">
    <div class="gem-range-wrapper" [class.gem-vertical-range-wrapper]="vertical">
      <span [class.gem-vertical-range-min]="vertical" class="gem-range-min">
        {{ minValue }}
      </span>
      <div class="gem-range-container">
        <div
          #rangeVElement
          [class.gem-vertical-range-value]="vertical"
          class="gem-range-value"
        >
        </div>
        <input
          #slider
          class="gem-range"
          type="range"
          [min]="minValue"
          [max]="maxValue"
          [style.width]="size"
          [ngModel]="value"
          (ngModelChange)="onValueChange($event)"
          [step]="step"
          (change)="snapToTick()"
        />
        <div class="gem-range-ticks">
          <div
            *ngFor="let marker of visibleTicks"
            [class.gem-range-tick]="!vertical"
            [class.gem-vertical-tick]="vertical"
            [style.left]="getTickPosition(marker)"
            [style.top]="'100%'"
          >
            <div [class.gem-range-tick-mark]="!vertical" [class.gem-vertical-tick-mark]="vertical"></div>
            <div [class.gem-range-tick-label]="!vertical" [class.gem-vertical-tick-label]="vertical" *ngIf="marker.getLabel()" #tickLabel>{{ marker.getLabel() }}</div>
          </div>
        </div>
      </div>

      <span [class.gem-vertical-range-max]="vertical" class="gem-range-max">
      {{ maxValue }}
    </span>
    </div>
  </div>
</div>
