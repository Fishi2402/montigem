/////////////////////////   NODE   //////////////////////////////
node {
  download = true
  version = "18.16.1"
}

task generateIndexTS {
  println "Generating index.ts files for Frontend RTE TS Lib"
  doLast {
    project.file("projects/umlp-frontend-rte/src/lib").traverse { File file ->
      if (file.directory) {
        def out = file.listFiles().findAll { it.directory }
          .collect { "export * from \"./" + it.name + "\";" }
        out.addAll(file.listFiles()
          .findAll { it.name.endsWith(".ts") && !it.name.equals('index.ts') }
          .collect { "export * from \"./" + it.name.substring(0, it.name.length() - 3) + "\";" }
        )
        def outStr = out.join("\n")
        new File(file, "index.ts").text = """$outStr"""
      }
    }
  }
}

//project.getTasksByName("jsweet", true).forEach {
//  t ->
//    generateIndexTS.dependsOn(t)
//}

task buildLib(type: NpxTask) {
  command = "ng"
  args = ["build"]
  dependsOn(project.tasks.npmInstall)
  dependsOn(project.tasks.generateIndexTS)
  inputs.dir(project.fileTree("projects/umlp-frontend-rte/src").exclude("**/*.spec.ts"))
  inputs.dir("node_modules")
  inputs.files("tsconfig.json")
  outputs.dir("${project.buildDir}/dist")
}
//build.dependsOn(buildLib)

task packLib(type: NpmTask) {
  dependsOn(buildLib)
  args = ["pack"]
}
tasks.packLib.workingDir = project.file("dist/umlp-frontend-rte")

