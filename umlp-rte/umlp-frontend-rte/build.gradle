buildscript {
  repositories {
    mavenCentral()
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
  }
  dependencies {
    classpath('de.rwth.se.umlp.jsweet:jsweet-gradle-plugin:3.2.0-UMLP-SNAPSHOT') {
      transitive = true
    }
    classpath project(":umlp-rte:umlp-frontend-rte-java")
  }
}

plugins {
  id "de.rwth.se.umlp.jsweet.jsweet-gradle-plugin" version "3.2.0-UMLP-SNAPSHOT"
  id "com.github.node-gradle.node" version "3.4.0"
}

compileJava {
  enabled = false
}

group = "umlp"
description = "UMLP FRONTEND RTE"

// Enable for implementing a new Adapter
repositories {
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url repo
  }
  maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
  maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
}

dependencies {
  implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
}

/////////////////////////   JSweet   //////////////////////////////

jsweet {
  verbose = true
  encoding = 'UTF-8'
  sourceMap = true
  tsOnly = true
  tsOut = project.file('projects/umlp-frontend-rte/src/lib/target')
  targetVersion = 'ES6'
  includes = ['**/*.java']
  module = 'commonjs'
  autoPropagateAsyncAwaits = true
  workingDir = project.file('target/.jsweet')
  excludes = [
    '**/service/**',
    '**/shellapi/**',
    '**/service/**',
  ]
  excludeTranspilation = [
    '**/DatabaseAccessManager.java',
    '**/HashMapWithOrderedKeys.java',
    '**/CommandResultDeSer.java',
  ]
}

/////////////////////////   NODE   //////////////////////////////
node {
  download = true
  version = "12.18.2"
}

task buildLib(type: NpxTask) {
  command = "ng"
  args = ["build", "--prod"]
  dependsOn(tasks.npmInstall)
  inputs.dir(project.fileTree("projects/umlp-frontend-rte/src").exclude("**/*.spec.ts"))
//  inputs.dir(project.fileTree("target/generated-sources/ts"))
  inputs.dir("node_modules")
  inputs.files("tsconfig.json")
  outputs.dir("${project.buildDir}/dist")
}

project.getTasksByName("jsweet", true).forEach {
  t-> {
    print(t.name)
    t.finalizedBy(buildLib)
    buildLib.dependsOn(t)
  }
}

