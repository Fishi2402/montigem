buildscript {
  repositories {
    if(("true").equals(getProperty('useLocalRepo'))) { mavenLocal() }
    mavenCentral()
    maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
    maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
  }
  dependencies {
    classpath('de.rwth.se.umlp.jsweet:jsweet-gradle-plugin:3.2.0-SNAPSHOT') {
      transitive = true
    }
  }
}

plugins {
  id "de.rwth.se.umlp.jsweet.jsweet-gradle-plugin" version "3.2.0-SNAPSHOT"
  id "com.github.node-gradle.node" version "3.4.0"
}

compileJava {
  enabled = false
}

group = "umlp"
description = "UMLP FRONTEND RTE"

// Enable for implementing a new Adapter
repositories {
  maven { url "https://repository.jsweet.org/artifactory/libs-snapshot-local" }
  maven { url "https://repository.jsweet.org/artifactory/libs-release-local" }
}

dependencies {
  // Enable for implementing a new Adapter
  implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
  implementation group: 'org.jsweet', name: 'jsweet-transpiler', version: "3.2.0-SNAPSHOT"
}

/////////////////////////   JSweet   //////////////////////////////
// Enable for implementing a new Adapter
sourceSets {
  sourceSets.main.java {
    srcDirs += ["$projectDir/jsweet_extension"]
  }
}

jsweet {
  verbose = true
  encoding = 'UTF-8'
  sourceMap = true
  tsOnly = true
  tsOut = project.file('projects/umlp-frontend-rte/src/lib/target')
  targetVersion = 'ES6'
  includes = ['**/*.java']
  module = 'commonjs'
//  excludes = ['**/umlp/jsweet/extension/**/*.java']    // Enable for implementing a new Adapter
  workingDir = project.file('target/.jsweet')
  excludeTranspilation = [
    '**/umlp/jsweet/extension/**/*.java',
    '**/CommandObjectMapper.java',
    '**/DatabaseAccessManager.java',
    '**/*DeSer*',
    '**/BaseClassObjectMapper.java',
    '**/HashMapWithOrderedKeys.java',
    '**/service/websocket/**',
    '**/shellapi/UMLPShellApi.java'
  ]
}

/////////////////////////   NODE   //////////////////////////////
node {
  download = true
  version = "12.18.2"
}

task buildLib(type: NpxTask) {
  command = "ng"
  args = ["build", "--prod"]
  dependsOn(tasks.npmInstall)
  inputs.dir(project.fileTree("projects/umlp-frontend-rte/src").exclude("**/*.spec.ts"))
//  inputs.dir(project.fileTree("target/generated-sources/ts"))
  inputs.dir("node_modules")
  inputs.files("tsconfig.json")
  outputs.dir("${project.buildDir}/dist")
}

