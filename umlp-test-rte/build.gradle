import gradle.specific.UMLPJava2TypeScriptTask
import gradle.specific.cd.GUITypes2JavaTask

//TODO which of those plugins and dependencies are really needed?

plugins {
  id 'application'
  id 'maven-publish'
  id 'java-library'
  id 'io.spring.dependency-management' version '1.0.15.RELEASE'
}

group = "umlp"
description = "RTE for unit- and e2e-tests in UMLP projects"

def withoutSpringLogging = {
  exclude module: 'spring-boot-starter-logging'
  exclude module: 'logback-classic'
  exclude module: 'log4j-to-slf4j'
}

dependencies {
  api group: 'de.monticore', name: 'monticore-runtime', version: mc_version

  api project(':umlp-rte')

  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-websocket', version: spring_version
  implementation group: 'org.springframework.shell', name: 'spring-shell-starter', version: spring_shell_version
  implementation group: 'org.springframework.boot', name: 'spring-boot-starter-webflux', version: spring_version

  compileOnly group: 'org.neo4j', name: 'neo4j-jdbc-driver', version: neo4j_jdbc_version
  compileOnly "org.neo4j:neo4j:4.4.10"
  compileOnly "org.neo4j.driver:neo4j-java-driver:$neo4jVersion"

  // Used for umlp.backendrte.test_infrastructure.TestSetup
  compileOnly 'org.junit.jupiter:junit-jupiter-api:5.9.2'
  // Used for umlp.backendrte.test_infrastructure.playwright.AbstractPlaywrightE2ETest
  api "com.microsoft.playwright:playwright:$playwright_version"
  api group: 'org.springframework.boot', name: 'spring-boot-starter-test', version: spring_version, withoutSpringLogging

  implementation("com.hivemq:hivemq-mqtt-client:1.3.0")
}

// TODO: umlpModules config is added elsewhere  by the umlp plugin
configurations {umlpModules{}}

/////////////////////////   Deployment  //////////////////////////////////

// configure deployment
publishing {
  publications {
    maven(MavenPublication) {
      from(components.java)
    }
  }
  repositories.maven {
    credentials.username mavenUser
    credentials.password mavenPassword

    def releasesRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-releases/"
    def snapshotsRepoUrl = "https://nexus.se.rwth-aachen.de/content/repositories/umlp-snapshots/"
    url = version.endsWith("SNAPSHOT") ? snapshotsRepoUrl : releasesRepoUrl
  }
}

repositories {
  // Only use jsweet repos for everything in org.jsweet*(excl jsweet-core which is in maven-central)
  // since they throw 409 errors for dependencies in other groups
  maven {
    url "https://repository.jsweet.org/artifactory/libs-snapshot-local"
    mavenContent {
      includeModuleByRegex("org[.]jsweet.*", "(?!jsweet-core).*")
    }
  }
  maven {
    url "https://repository.jsweet.org/artifactory/libs-release-local"
    mavenContent {
      includeModuleByRegex("org[.]jsweet.*", "(?!jsweet-core).*")
    }
  }
}
