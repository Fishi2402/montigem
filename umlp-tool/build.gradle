import de.mclsg.TaskTypes
import de.mclsg.task.AutoconfigureTask

/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'java'
  id 'java-gradle-plugin'
  id 'maven-publish'
  id 'de.monticore.generator' version "$mc_version"
  id 'com.github.johnrengelman.shadow' version "$shadow_plugin_version"

  id 'de.monticore.language-server' version "$mclsg_version"
  id 'org.jetbrains.intellij' version '1.13.3' apply(false)
  id "io.github.themrmilchmann.ecj" version "0.2.0"
}

def shouldBuildIntelliJPlugin = ("true").equals(getProperty('buildIntelliJPlugin'))
def shouldBuildVscodePlugin = ("true").equals(getProperty('buildVscodePlugin'))

if(shouldBuildIntelliJPlugin) {
  apply plugin: "org.jetbrains.intellij"
  intellij.version = "2022.2"
}

configurations {
  guiDefaultTypes
}

dependencies {
  implementation group: 'de.monticore.lang', name: 'ocl', version: mc_version
  implementation group: 'org.slf4j', name: 'slf4j-simple', version: slf4j_version
  implementation group: 'de.monticore', name: 'monticore-runtime', version: mc_version
  implementation group: 'de.monticore', name: 'monticore-grammar', version: mc_version
  implementation group: 'de.monticore', name: 'class2mc', version: mc_version
  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version
  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version, classifier: 'cdmerge'
  implementation group: 'de.monticore.lang', name: 'guidsl', version: mc_version
  implementation group: 'de.monticore.lang', name: 'cd2gui', version: mc_version
  implementation "de.monticore.language-server:monticore-language-server-runtime:$mclsg_version"
  implementation group: 'de.monticore.lang', name: 'cd4analysis', version: mc_version, classifier: 'language-server'
  implementation group: 'de.se_rwth.commons', name: 'se-commons-gradle', version: mc_version
  implementation group: 'de.monticore.lang', name: 'od', version: mc_version

  implementation group: "org.yaml", name: "snakeyaml", version: "$snake_yaml_version"

  implementation group: 'org.jsweet', name: 'jsweet-core', version: "6.3.0"
  implementation group: 'de.rwth.se.umlp.jsweet', name: 'jsweet-transpiler', version: '3.2.0-UMLP-SNAPSHOT'

  implementation('com.google.cloud.tools:jib-core:0.27.1')

  testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-engine', version: junit_version
  testImplementation group: 'org.junit.jupiter', name: 'junit-jupiter-params', version: junit_version
  testImplementation group: 'com.github.javaparser', name: 'javaparser-symbol-solver-core', version: javaparser_version
  testImplementation group: 'org.mockito', name: 'mockito-inline', version: mockito_version
  testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.11.2")
  testRuntimeOnly gradleApi()

  grammar("de.monticore.lang:cd4analysis:$mc_version")
  grammar("de.monticore:monticore-grammar:$mc_version")
  grammar("de.monticore.lang:guidsl:$mc_version")

  guiDefaultTypes "de.monticore.lang:guidsl:$mc_version:default-types"
}

group = 'umlp'
repositories {
  if (("true").equals(getProperty('useLocalRepo'))) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url repo
  }
  mavenCentral()
  if(shouldBuildIntelliJPlugin) {
    maven { url 'https://www.jitpack.io' }
  }
 }

test {
  systemProperty 'guidsl-default-types', configurations.guiDefaultTypes.asPath
  useJUnitPlatform()
}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(11)
  }
}

description = 'UML/P Language and Tool'

compileJava {
  dependsOn project.collect { it.tasks.withType(MCTask) }
  options.warnings = false
}

//can not be registered lazy because then everything breaks
//noinspection ConfigurationAvoidance
task autoconfigure(type: AutoconfigureTask) {
  mclsgAggregation {
    languageAggregationName = "UMLPWithGUI"
    targetPackage = "umlp_with_gui"
    member("UMLP", "umlp", true)
    member("de.monticore.GUIDSL", "gui", false)
    modelPath = ["$projectDir/src/main/grammars"]
    if(shouldBuildIntelliJPlugin) {
      including(TaskTypes.INTELLIJ_PLUGIN)
    }
    if(shouldBuildVscodePlugin){
      including(TaskTypes.VSCODE_PLUGIN)
    }
  }
}
tasks.build.dependsOn tasks.named('autoconfigure')

task printConfigs(){
  doLast{
    configurations.each {
      if(it.name.equals("grammarSymbolDependencies") && it.canBeResolved){
        println("${it.name} , resolved: ${it.canBeResolved}, consumed: ${it.canBeConsumed}")
        try{
          it.resolve().each{
            println(it)
          }
        }catch(Exception e){
          e.printStackTrace()
        }

      }
    }
  }
}

if(shouldBuildIntelliJPlugin) {
  def lspWorkdir = file("../examples/").getAbsolutePath()

  runIde {
    environment.put("LSP_PORT", "3000")
    args += lspWorkdir
  }

tasks.register('runLsp', JavaExec) {
    classpath tasks.packUMLPWithGUILanguageServer.archiveFile.get().asFile
    args("-port", "3000", "-r", "-mp", lspWorkdir, "-mup")
    environment("LSP_SYSTEM_EXIT", "false")
    dependsOn tasks.packUMLPWithGUILanguageServer
  }
}

if(shouldBuildVscodePlugin) {
  task runVscodePluginMultiproject(type: JavaExec) {
    def generatorDirConfig = generateUMLPWithGUILanguageServer.getMclsgPluginAggregationExtension()
    def lspWorkDir = project.getProjectDir().toPath().getParent().resolve("examples").toAbsolutePath().toString()
    classpath(packUMLPWithGUILanguageServer.archiveFile.get())
    environment(generatorDirConfig.getSimpleName().toUpperCase() + "_LSP_PORT", "3000");
    args("-sock", "-port", "3000", "-mp", lspWorkDir, "-mup");

    doFirst {
      def timerTask = new TimerTask() {
        private final String langName = generatorDirConfig.getSimpleName()
        private final String genDir = generatorDirConfig.getFullVscodePluginDir()

        @Override
        void run() {
          def processBuilder
          if (System.getProperty("os.name").toLowerCase().contains("win")) {
            processBuilder = new ProcessBuilder("cmd.exe", "/c", "code", "--extensionDevelopmentPath", genDir, lspWorkDir
            )
          } else {
            processBuilder = new ProcessBuilder("code", "--extensionDevelopmentPath", genDir, lspWorkDir)
          }

          processBuilder.environment().put("UMLPWITHGUI_LSP_PORT", "3000")

          try {
            processBuilder.start()
          } catch (IOException e) {
            throw new RuntimeException(e)
          }
        }
      }

      new Timer().schedule(timerTask, 2000)
    }
    dependsOn packUMLPWithGUILanguageServer
    dependsOn buildUMLPWithGUIVscodePlugin
  }
}

///////////////////////// Building Jars //////////////////////////////////

// build sources jar with handwritten + generated sources
tasks.register('sourcesJar', Jar) {
  archiveClassifier = 'sources'
  from(sourceSets.main.allJava)
}

sourcesJar.dependsOn project.collect { it.tasks.withType(MCTask) }
//sourcesJar.dependsOn tasks.named('generateUMLPWithGUILanguageServer')


shadowJar { // all in one jar
  manifest {
    attributes "Main-Class": "umlp.UMLPTool"
  }
  archiveClassifier = 'cli'
  archiveFileName = "UMLPTool.jar"
  zip64 = true
//        minimize()
  duplicatesStrategy DuplicatesStrategy.INCLUDE
}

jar.dependsOn(sourcesJar)
// jar.dependsOn(shadowJar)

gradlePlugin {
  plugins {
    umlpplugin {
      id = "de.rwth.se.umlp-tool"
      implementationClass = "gradle.UMLPPluginBase"
    }
    umlpplugin_backend {
      id = "de.rwth.se.umlp-tool-backend"
      implementationClass = "gradle.UMLPPluginBackend"
    }
    umlpplugin_backend_test {
      id = "de.rwth.se.umlp-tool-backend-test"
      implementationClass = "gradle.UMLPPluginBackendTest"
    }
    umlpplugin_testing {
      id = "de.rwth.se.umlp-tool-testing"
      implementationClass = "gradle.UMLPPluginTestInfrastructure"
    }
    umlpplugin_frontend {
      id = "de.rwth.se.umlp-tool-frontend"
      implementationClass = "gradle.UMLPPluginFrontend"
    }
    umlpplugin_frontend_test {
      id = "de.rwth.se.umlp-tool-frontend-test"
      implementationClass = "gradle.UMLPPluginFrontendTest"
    }
    umlpplugin_module_models {
      id = "de.rwth.se.umlp-tool-module-models"
      implementationClass = "gradle.module.UMLPPluginModule"
    }
    umlpplugin_module_backend {
      id = "de.rwth.se.umlp-tool-module-backend"
