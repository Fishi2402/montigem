/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'application'
}

repositories {
  if (("true") == getProperty('useLocalRepo')) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url = repo
  }
  gradlePluginPortal()
  mavenCentral()
}

dependencies {
  implementation group: 'de.monticore.lang', name: 'sd-language', version: mc_version
  implementation "de.monticore:monticore-runtime:${mc_version}"
  implementation "de.monticore:monticore-grammar:${mc_version}"
  implementation "de.monticore.lang:cd4analysis:${mc_version}"
  implementation "umlp:umlp-tool:$version"

  // JUnit 5 setup
  testImplementation "org.junit.jupiter:junit-jupiter-api:$junit_version"
  testImplementation "org.junit.jupiter:junit-jupiter-params:$junit_version"
  testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:$junit_version"
  testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.11.2"
}

test {
  useJUnitPlatform()
}

tasks.register('sd2test', JavaExec) {
  classpath = sourceSets.main.runtimeClasspath
  mainClass = 'umlp.SD2TestTool'
  workingDir = '../..'
}

group = "umlp"
