/* (c) https://github.com/MontiCore/monticore */

plugins {
  id 'application'
}

repositories {
  if (("true") == getProperty('useLocalRepo')) {
    mavenLocal()
  }
  maven {
    credentials.username mavenUser
    credentials.password mavenPassword
    url = repo
  }
  gradlePluginPortal()
  mavenCentral()
}

dependencies {
  implementation group: 'de.monticore.lang', name: 'sd-language', version: mc_version
  implementation "de.monticore:monticore-runtime:${mc_version}"
  implementation "de.monticore:monticore-grammar:${mc_version}"
  implementation "de.monticore.lang:cd4analysis:${mc_version}"
  implementation "umlp:umlp-tool:$version"
}

group = "umlp"
