import groovy.json.JsonBuilder
import java.util.regex.Pattern

// this file drives the MultiProjectLanguageServer's capability to read the project structure
// from gradle state instead of a manifest file. This cannot be done in automatic testing from
// within a Gradle setup however, since the server starts a second Gradle instance and the outer
// instead blocks the new instance w.r.t. file access.

gradle.rootProject { root ->
    root.ext.subprojectCollection = []

    root.task('aggregateAndProcessInfo') {
        doLast {
          File target = new File(Objects.requireNonNull(
              getProperty("lsp.manifest.file"),
              "Property lsp.manifest.file must be set!"
          ))

          def generator = new groovy.json.JsonGenerator.Options()
            .excludeFieldsByName('contentHash', 'originalClassName')
            .build()
          def allInfo = root.ext.subprojectCollection

          def res = new MCLSMultiprojectPluginExtension()
          allInfo.unique{ it.projectpath }.each { res.addSubprojectDirect(it) }
          res.ignoredDirectories = ["build", ".git", "target", "node_modules", ".gradle"]

          target.getParentFile().mkdirs()
          target.write(new JsonBuilder(res, generator).toPrettyString())
        }
    }
}

allprojects {
  task manifestTask(){
    doLast{
      tasks.each {
        if(it.class.name.contains("UMLP2JavaTask")){
          try{
            def subproj = new MCLSMultiprojectPluginExtension.SubprojectLayoutExtension();
            def model = it.getInput().getAsFileTree().getFiles().findAll {it.name.endsWith(".umlp")}[0]

            if(model != null){
              // Extract package
              def modelText = model.text
              def matcher = Pattern.compile("^\\s*package\\s+([\\w\\.]+)", Pattern.MULTILINE).matcher(modelText)
              def packName = matcher.find() ? matcher.group(1) : null

              subproj.name = model.parentFile.parentFile.name
              subproj.projectpath = model.parentFile.parentFile.toString()
              List<String> resources = new ArrayList<>()
              Set<String> guiSymbolPaths = new HashSet<>();

              resources.addAll(it.getModelDir().getFiles().collect { it.toString() })

              if(packName == null){
                resources.add(model.parentFile.toString())
              } else {
                File f = model
                for(String part : packName.split("[.]")){
                  f = model.parentFile
                }
                resources.add(f.toString())
              }

              subproj.modelDirs = []
              rootProject.ext.subprojectCollection << subproj

              if(project.path.endsWith(":backend")){
                def frontendPath = project.path.substring(0, project.path.lastIndexOf(':')) + ":frontend"
                println("Searching frontend under " + frontendPath)
                def frontend = findProject(frontendPath)
                if(frontend != null){
                  println("Found frontend")
                  Configuration config = frontend.configurations.findByName("guiLib")
                  if(config != null){
                    println("Found config")
                    guiSymbolPaths.addAll(config.files.collect{ it.toString() })
                  }else{
                    println("Did not find config")
                  }

                  // Extract gui model dir(s) and symbol path(s)
                  println("Going through frontend tasks")
                  frontend.tasks.each{
                    if(it.class.name.contains("GUI2Java2TSTask")){
                      println("Frontend Task " + it.path + " matches")
                      it.getModelDir().getFiles().each {
                        println("Adding frontend resource " + it)
                        resources.add(it.toString())
                      }
                      it.getSymbolPath().getFiles().each {
                        if(it.toString().endsWith(".jar")){
                          println("Adding frontend symbol path " + it)
                          guiSymbolPaths.add(it.toString())
                        }
                      }
                    }
                  }
                }else{
                  println("Did not find frontend")
                }
              }else{
                println("Project path '${project.path}' does not end with :backend")
              }

              subproj.resources = resources.toArray(new String[0])
              subproj.symbolPath = guiSymbolPaths.toArray(new String[0])

              def generator = new groovy.json.JsonGenerator.Options()
                  .excludeFieldsByName('contentHash', 'originalClassName')
                  .build()

              println(new JsonBuilder(subproj, generator))
            } else {
              println("Can not find model, input files where " + it.getInput().getFiles())
            }
          }catch(Exception e){
            e.printStackTrace()
          }
        }
      }
    }
  }

  rootProject.tasks.aggregateAndProcessInfo.dependsOn manifestTask
}


